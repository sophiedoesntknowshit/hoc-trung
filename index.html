      case "rp-add-w": { var rh = el.getAttribute("data-h"); rpAddRun(function (R) { return rpAddWord(R, rh); }); break; }
      case "rp-add-s": { var ri = Number(el.getAttribute("data-i")); rpAddRun(function (R) { return rpAddSent(R, ri); }); break; }
      case "rp-add-all": rpAddRun(function (R) {
        var n = 0;
        rpFixes(R).forEach(function (i) { n += rpAddSent(R, i); });
        R.sc.keys.filter(function (h) { return !rpUsed(R, h); }).forEach(function (h) { n += rpAddWord(R, h); });
        return n;
      }); break;
      case "map-ai-next": aiGenStart(el.getAttribute("data-id"), el.getAttribute("data-br"), null, false); break;
      case "map-ai-branch": mapAiBranchStart(el.getAttribute("data-id")); break;
      // 🔗 Mở rộng trên thẻ từ
      case "exp-toggle": if (session && session.current) { var es = expState(session.current); es.open = !es.open; expRefresh(); } break;
      case "exp-item": {
        if (!session || !session.current) break;
        var ek = el.getAttribute("data-g") + ":" + el.getAttribute("data-i"), ed = expState(session.current).det;
        if (ed[ek]) delete ed[ek]; else ed[ek] = true;
        expRefresh();
        break;
      }
      case "exp-add": case "exp-add-all": {
        if (!session || !session.current) break;
        var ex = expItemAt(session.current, el);
        if (ex) expAdd(session.current, action === "exp-add" ? [ex.x] : ex.g.items, !!ex.g.ai);
        break;
      }
      case "exp-ai": if (session && session.current) expAiStart(session.current); break;
      case "mp-word": {
        var mi = Number(el.getAttribute("data-i"));
        if (mapLv.open[mi]) delete mapLv.open[mi]; else mapLv.open[mi] = true;
        renderMapLv(true);
        break;
      }
      case "mp-word-all": {
        var mws = mapLvWords(), mall = mws.every(function (w, i) { return mapLv.open[i]; });
        mapLv.open = {};
        if (!mall) mws.forEach(function (w, i) { mapLv.open[i] = true; });
        renderMapLv(true);
        break;
      }
      default: break;
    }
  }
  app.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el || !app.contains(el)) return;
    e.preventDefault();
    onAction(el.getAttribute("data-action"), el);
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "importFile") { importBackupFile(t.files && t.files[0]); return; }
    if (t.id === "auSeek") { seekHold = false; updateAudioUi(); return; }
    var deckId = t.getAttribute("data-deck");
    if (deckId) {
      var ids = db.settings.selectedDecks.filter(function (id) { return id !== deckId; });
      if (t.checked) ids.push(deckId);
      setSelectedDecks(keepUnloadedLessons(ids));
      return;
    }
    // Cấp HSK của từ mới: phiên đang chạy giữ hàng từ mới đã nạp lúc bắt đầu, bộ lọc mới áp từ phiên sau.
    var hskAttr = t.getAttribute("data-hsk");
    if (hskAttr != null) {
      var n = Number(hskAttr), lv = hskLevels().filter(function (x) { return x !== n; });
      if (t.checked) lv.push(n);
      if (!hskVal(lv)) { t.checked = true; toast("Giữ ít nhất 1 cấp HSK"); return; }
      db.settings.hskLevels = hskVal(lv);
      var hsel = 'input[data-hsk="' + n + '"]';
      saveDb(); renderKeepScroll(hsel, document.activeElement === t ? hsel : null);
      return;
    }
    // AI chấm bài: lưu ở "hoctrung.ai.v1" (không vào db.settings → không đi theo backup)
    var aiAttr = t.getAttribute("data-ai");
    if (aiAttr) {
      var fresh = aiRead(); if (fresh) AI = fresh;
      if (aiAttr === "model") AI.model = AI_MODELS[t.value] ? t.value : AI_DEFAULT;
      else if (aiAttr === "enabled") AI.enabled = !!AI.key && !!t.checked;
      aiSave(); renderKeepScroll(".aiset");
      return;
    }
    var key = t.getAttribute("data-setting");
    if (!key) return;
    if (key === "newPerSession") db.settings.newPerSession = Number(t.value) || 10;
    else if (key === "reviewCap") { var cv = capVal(t.value); db.settings.reviewCap = cv == null ? REVIEW_CAP_DEFAULT : cv; }
    else if (key === "drawPad") db.settings.drawPad = !!t.checked;
    else if (key === "autoSpeak") db.settings.autoSpeak = !!t.checked;
    else if (key === "speechScore") db.settings.speechScore = !!t.checked;
    else if (key === "sessionBlocks") db.settings.sessionBlocks = !!t.checked;
    else if (key === "mapAiAuto") db.settings.mapAiAuto = !!t.checked;
    else if (key === "warmup") { var wv = warmVal(t.value); db.settings.warmup = wv == null ? WARM_DEFAULT : wv; }
    else if (key === "theme") { db.settings.theme = themeVal(t.value) || "dem"; applyTheme(); }
    saveDb(); render();
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "auSeek" && audioEl) { seekHold = true; audioEl.currentTime = Number(t.value) || 0; return; }
    if (t.id === "exFree" && exam) exam.free[t.getAttribute("data-n")] = t.value;
    if (t.id === "trInput" && session) session.trTyped = t.value;
    if (t.id === "wuInput") { var wq = warmCur(); if (wq) wq.typed = t.value; }
    if (t.id === "rpIn" && rp) rp.draft = t.value;
    var mn = t.getAttribute && t.getAttribute("data-mnew");
    if (mn) MAPNEW_TXT[mn] = t.value;
  });
  // Ô "✨ Nhánh mới": theo dõi bộ gõ đang ghép chữ (Telex / IME) để hoãn vẽ lại bản đồ (mapRedrawHeld).
  app.addEventListener("compositionstart", function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-mnew")) mapComposing = true;
  });
  app.addEventListener("compositionend", function (e) {
    if (!(e.target && e.target.getAttribute && e.target.getAttribute("data-mnew"))) return;
    mapComposing = false;
    if (mapRefreshPending) setTimeout(function () { if (!mapComposing && mapRefreshPending) mapAiRefresh(); }, 0);
  });
  app.addEventListener("focusout", function (e) {
    if (!(e.target && e.target.getAttribute && e.target.getAttribute("data-mnew"))) return;
    mapComposing = false;
    if (mapRefreshPending) setTimeout(function () { if (mapRefreshPending) mapAiRefresh(); }, 0);
  });
  // Ô khóa OpenAI (không nằm trong form để trình duyệt khỏi đòi lưu như mật khẩu): Enter = Lưu.
  app.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "aiKeyIn" && e.key === "Enter" && !e.isComposing) { e.preventDefault(); aiSaveKey(); }
    // Ô "✨ Nhánh mới" trong bản đồ: Enter = Soạn
    var mn = e.target && e.target.getAttribute && e.target.getAttribute("data-mnew");
    if (mn && e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!e.repeat) mapAiBranchStart(mn); }
  });
  // Ô gõ thẻ Dịch câu nằm trong form: phím "Xong/Enter" của bàn phím điện thoại (có máy không gửi keydown Enter) = Kiểm tra.
  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target && e.target.id === "trForm" && view === "session" && session) flip();
    if (e.target && e.target.id === "wuForm" && view === "session" && session) warmCheck();
    if (e.target && e.target.id === "rpForm" && view === "roleplay") rpSend();
  });
  // Listener gắn 1 lần trên #app (delegation) nên đổi thẻ / vẽ lại canvas không rò listener.
  if (window.PointerEvent) {
    app.addEventListener("pointerdown", onPointerDown);
    app.addEventListener("pointermove", onPointerMove);
    app.addEventListener("pointerup", onPointerUp);
    app.addEventListener("pointercancel", onPointerUp);
  } else {
    app.addEventListener("touchstart", onTouchStart, { passive: false });
    app.addEventListener("touchmove", onTouchMove, { passive: false });
    app.addEventListener("touchend", onPadEnd);
    app.addEventListener("touchcancel", onPadEnd);
    app.addEventListener("mousedown", onMouseDown);
    app.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onPadEnd);
  }

  document.addEventListener("keydown", function (e) {
    if (view !== "session" || !session) return;
    var t = e.target;
    // Ô gõ của thẻ Dịch câu: Enter = Kiểm tra (trừ lúc bộ gõ Trung đang ghép chữ), Esc = rời ô; phím khác (Space…) gõ bình thường.
    if (t && (t.id === "trInput" || t.id === "wuInput")) {
      if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!e.repeat) { if (t.id === "wuInput") warmCheck(); else flip(); } }
      else if (e.key === "Escape") { e.preventDefault(); t.blur(); }
      return;
    }
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var isSpace = key === " " || key === "Spacebar";
    // Space không cuộn trang; Space/Enter không "bấm" nút đang focus (vd. nút Kết thúc) thay cho phím tắt.
    if (isSpace || key === "Enter") {
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
    }
    // Giữ phím sẽ auto-repeat: chặn để Space giữ lâu không vừa lật vừa chấm Nhớ.
    if (e.repeat) { e.preventDefault(); return; }
    // Phím đã xử lý ở đây mà làm đổi màn (Esc, chuyển khúc, mở bài/đề) thì chặn luôn, không để examKey/lessonKey
    // (gắn sau, cùng document) xử lý lại phím đó ở màn mới.
    if (key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); escapeSession(); return; }
    if (warmActive()) { warmKey(e, key, isSpace); return; } // kiểm tra bài cũ đầu buổi
    var it = session.current;
    if (!it) {
      if (session.blocks && session.gate != null) { if (key === "Enter" || isSpace) { e.stopImmediatePropagation(); blkGo(); } return; } // thẻ chuyển khúc
      if (session.blocks) { // khúc 3: màn chọn
        if (key === "1") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenLesson(); }
        else if (key === "2") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenExam(); }
        else if (key === "3") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenRp(); }
        else if (key === "Enter" && session.elapsed >= TARGET_SEC) endSession(true);
        return;
      }
      if (key === "Enter") endSession(true);
      return;
    }
    var mode = modeOf(it);
    if ((key === "r" || key === "R") && mode === "phrase" && micSupported()) { e.preventDefault(); recToggle("card:" + it.id); return; }
    if (isSpace) {
      if (mode === "new") return;
      if (!session.flipped) flip(); else gradeCurrent(3);
      return;
    }
    if (key === "Enter") {
      e.preventDefault();
      if (mode === "new") understood(); else if (!session.flipped) flip();
      return;
    }
    if (/^[1-4]$/.test(key) && mode !== "new" && session.flipped) {
      e.preventDefault();
      gradeCurrent(Number(key));
    }
  });
  // Phím tắt màn đề: tách riêng, chỉ chạy khi view === "exam" (phím phiên học ở trên chỉ chạy khi view === "session").
  document.addEventListener("keydown", examKey);
  // Phím tắt giáo trình: chỉ chạy khi view === "lesson" / "lessons".
  document.addEventListener("keydown", lessonKey);
  document.addEventListener("keydown", mapKey);
  document.addEventListener("keydown", rpKey);

  // ---------- khởi động ----------
  // Mở link / tải lại trang: về đúng màn theo hash. Mở mới (chưa có history.state của app) thì dựng
  // mục gốc = Trang chủ (+ mục Danh sách đề/bài nếu link trỏ thẳng vào đề/bài) để Back lùi từng màn.
  function initialRoute() {
    var h = location.hash, st = history.state;
    try {
      if (!(st && typeof st.n === "number")) {
        history.replaceState({ d: 0, n: 0 }, "", baseUrl());
        var mid = /^#exam\//.test(h) ? "#exams" : /^#lesson\//.test(h) ? "#lessons" : /^#map\//.test(h) || /^#roleplay\//.test(h) ? "#map" : "";
        if (mid) history.pushState({ d: 1, n: 1, p: "" }, "", mid);
      }
    } catch (e) { /* bỏ qua */ }
    routeTo(h);
  }
  // Nạp file các bài giáo trình đang học TRƯỚC khi dựng thẻ (chờ xong/lỗi, tối đa 8s).
  function boot() {
    var ids = db.settings.enabledLessons.filter(function (id) { return !!LESSON_META[id]; });
    var topics = mapOnTopics(); // chủ đề có cấp bản đồ đang học: nạp cùng lúc với bài giáo trình
    var started = false, wait = (ids.length ? 1 : 0) + (topics.length ? 1 : 0);
    var go = function () {
      started = true;
      rebuildItems();
      var miss = ids.filter(function (id) { return !lessonData(id); });
      var mmiss = topics.filter(function (t) { return !mapData(t); });
      if (!DECKS.length) app.innerHTML = missingDecksHtml();
      else initialRoute();
      // Gọi sau render() để không bị vẽ đè; bài về muộn thì vòng dự phòng bên dưới dựng lại thẻ.
      if (miss.length) toast("Không tải được " + miss.length + " bài giáo trình (" + miss.join(", ") + ") — từ của bài chưa có trong phiên. Mở bài trong Giáo trình để thử lại.");
      else if (mmiss.length) toast("Không tải được bản đồ chủ đề (" + mmiss.join(", ") + ") — từ của cấp đang học chưa có trong phiên. Mở cấp trong Bản đồ để thử lại.");
      if (DECKS.length) mapAdvance(null, false); // tiến độ nhập từ backup / máy khác có thể đã đạt 80%
      if (dictFixNeeded()) setTimeout(function () { loadDict(); }, 2000); // dữ liệu AI đã lưu có "?" / pinyin hỏng → nạp từ điển để sửa
    };
    var part = function () { if (--wait <= 0) go(); };
    if (!wait) { go(); return; }
    app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải giáo trình…</p></div></div>';
    if (topics.length) {
      loadMapTopics(topics, part, 8000);
      topics.forEach(function (t) { // chủ đề về muộn hơn timeout: dựng lại thẻ khi tới
        loadMapTopic(t, function (ok) {
          if (!ok || !started || mapOnKeys().every(function (k) {
            return MAP_LV[k].topic.id !== t || DECKS.some(function (d) { return d.id === MAP_LV[k].deckId; });
          })) return;
          rebuildItems();
          if (view === "home") render();
        });
      });
    }
    if (!ids.length) return;
    loadLessons(ids, part, 8000);
    // Bài nào về muộn hơn timeout: dựng lại thẻ khi tới, nếu đang ở trang chủ thì vẽ lại.
    ids.forEach(function (id) {
      loadLesson(id, function (ok) {
        if (!ok || !started || DECKS.some(function (d) { return d.id === id; })) return;
        rebuildItems();
        if (view === "home") render();
      });
    });
  }
  boot();
})();
</script>
</body>
</html>
