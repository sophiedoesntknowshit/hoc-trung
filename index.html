.expmore .chiettu .label{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--zhu-ink)}
.card .expmore .ex{margin-top:8px;padding-top:4px;border-top:0}
.card .expmore .ex::before{top:3px}
.expmore .ex-zh{font-size:18px;line-height:1.45;color:var(--ink-zh)}
.expmore .ex-py{font-size:13.5px;color:var(--ink3)}
.expmore .ex-vi{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink2)}
.expnone{margin:8px 0;font-size:13px;color:var(--ink3)}
.expaib{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px}
button.expai-btn{color:var(--plum-ink);border-color:var(--plum-line)}
.experr{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.4;color:var(--orange-ink)}
.experr .ic{flex:none;width:14px;height:14px}
/* trạng thái trỏ (giống nền: :hover thường) */
button.mthead:hover{background:var(--hover);border-color:transparent}
.mtopic.open button.mthead:hover{background:none}
button.mlv:hover{background:var(--hover);border-color:transparent}
button.maigen:hover{background:var(--hover);border-color:transparent}
button.maibtn:hover{background:var(--plum-soft);border-color:var(--plum)}
button.maibtn:disabled:hover{background:transparent;border-color:var(--plum-line)}
button.mchip:hover{background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--zhu-line);text-underline-offset:5px}
button.mback:hover{background:none;color:var(--ink)}
button.expbtn:hover{background:var(--hover);border-color:var(--rule)}
.exprow:hover{background:var(--hover)}
button.expai-btn:hover{background:var(--plum-soft);border-color:var(--plum)}
button.expai-btn:disabled:hover{background:transparent;border-color:var(--plum-line)}
/* ==== [/S2] ==== */
/* ==== [S3] luyện đề HSK4 ==== */
/* --- danh sách đề (#exams): đầu báo + số liệu 3 cột + hàng mục lục (số son · tên đề serif · dòng phụ · số câu đã làm) --- */
.exams .pagehead{margin-top:0}
.exams .pagehead .hl{margin:8px 0 0}
.exams .pagehead .small-btn{flex:none;margin-bottom:4px}
.exsum .stat b small{font-size:16px;color:var(--ink3);margin-left:1px}
.exitem .it b{font-variant-numeric:lining-nums}
.exitem .it small{white-space:normal}
.exitem .labels{margin:6px 0 0}
.exitem .labels .tag .ic{width:13px;height:13px}

/* --- thanh đầu màn đề: kính mờ, kẻ mảnh dưới (dính khi đang ở phần Nghe vì có audio) --- */
.bar.exbar{position:sticky;top:0;z-index:5;margin:-14px -20px 0;padding:4px 20px 6px;background:var(--bg-glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.bar.exbar.nostick{position:static;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
html.insess .bar.exbar{top:var(--smh)}
.exbar .bar-top{display:flex;align-items:center;gap:8px;min-height:48px}
.exbar .exback{flex:none;min-width:44px;padding:0;margin-left:-10px;border-color:transparent;color:var(--ink2)}
.exbar .exback .ic{width:22px;height:22px}
.exbar .exback:hover{border-color:transparent;color:var(--ink)}
.exbar .bar-top b{flex:1;min-width:0;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:lining-nums}
.exbar .bar-top b em{font-style:italic;font-weight:400;color:var(--ink2)}
.exdone{flex:none;font-family:var(--serif);font-size:21px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.exdone small{font-family:var(--sans);font-size:12px;color:var(--ink3);margin-left:2px}
/* trình phát audio: hàng 1 = phát/dừng + rãnh tua + giờ; hàng 2 = lùi/tới 5s + tốc độ (chữ, gạch chân son) */
.audio-ctl{margin:0}
.au-main{display:flex;align-items:center;gap:12px}
.audio-ctl #auToggle{flex:none;width:44px;min-width:44px;height:44px;padding:0;border-radius:50%;border-color:var(--zhu-line);color:var(--zhu-ink)}
.audio-ctl #auToggle:hover{background:var(--zhu-soft);border-color:var(--zhu-ink)}
.audio-ctl #auToggle .ic{width:19px;height:19px}
.audio-ctl #auToggle .ic.fill{margin-left:3px}
.audio-ctl input[type=range]{flex:1;min-width:0;height:44px;margin:0;padding:0;-webkit-appearance:none;appearance:none;background:transparent;border:0;cursor:pointer}
.audio-ctl input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;
  background:linear-gradient(var(--zhu-ink),var(--zhu-ink)) 0 0/var(--p,0%) 100% no-repeat,var(--rule2)}
.audio-ctl input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:var(--rule2)}
.audio-ctl input[type=range]::-moz-range-progress{height:2px;border-radius:2px;background:var(--zhu-ink)}
.audio-ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-6px;border:0;border-radius:50%;background:var(--zhu-ink)}
.audio-ctl input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--zhu-ink)}
.audio-ctl input[type=range]:focus-visible{outline-offset:-6px}
.audio-ctl .time{flex:none;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.au-sub{display:flex;align-items:center;gap:2px;margin-left:-10px}
.au-sub > button{min-height:44px;padding:0 10px;border-color:transparent;font-size:13.5px;color:var(--ink2);gap:5px;font-variant-numeric:tabular-nums}
.au-sub > button:hover{border-color:transparent}
.au-sub > button .ic{width:15px;height:15px}
.au-rates{display:flex;margin-left:auto;margin-right:-8px}
.au-rates button{position:relative;min-width:46px;min-height:44px;padding:0 6px;border:0;border-radius:0;background:none;font-size:13.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.au-rates button:hover{background:none;color:var(--ink2)}
.au-rates button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--zhu-ink)}
.aubad{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;color:var(--ink3)}
.aubad .ic{color:var(--orange-ink)}
.exwarn{display:flex;align-items:flex-start;gap:8px;margin:14px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.exwarn .ic{flex:none;margin-top:2px;color:var(--orange-ink)}

/* --- hàng tab chung (.ptabs: phần đề, cấp giáo trình): chữ + gạch chân son 2px, cuộn ngang sát mép, không viên thuốc --- */
.ptabs{display:flex;gap:22px;overflow-x:auto;overflow-y:hidden;margin:14px -20px 0;padding:0 20px;border-bottom:1px solid var(--rule);
  scroll-padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ptabs::-webkit-scrollbar{display:none}
@media (pointer:fine){.ptabs{scrollbar-width:thin;scrollbar-color:var(--rule2) transparent}.ptabs::-webkit-scrollbar{display:block;height:4px}.ptabs::-webkit-scrollbar-thumb{background:var(--rule2)}}
.ptabs button{flex:none;min-height:46px;padding:8px 0 10px;border:0;border-radius:0;background:none;font-size:14.5px;color:var(--ink3);white-space:nowrap;gap:6px}
.ptabs button:hover{background:none;color:var(--ink2)}
.ptabs button i{font-style:normal;font-family:var(--kai);font-size:17px;line-height:1;font-synthesis:none}
.ptabs button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--zhu-ink)}
.ptabs button.on i{color:var(--zhu-ink)}

/* --- phiếu số câu (kiểu phiếu trả lời): ô kẻ mảnh; đúng/sai = màu + dấu ✓ ✕ nhỏ góc ô; câu đang mở = gạch chân son --- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));margin:16px 0 0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.qgrid button{position:relative;min-width:0;min-height:44px;padding:0;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;background:none;
  font-family:var(--serif);font-size:16px;color:var(--ink2);font-variant-numeric:lining-nums tabular-nums}
.qgrid button:hover{background:var(--hover);border-color:var(--rule)}
.qgrid button.done{color:var(--ink);background:var(--hover)}
.qgrid button.ok,.qgrid button.ok:hover{color:var(--green-ink);background:var(--green-soft)}
.qgrid button.bad,.qgrid button.bad:hover{color:var(--red-ink);background:var(--red-soft)}
.qgrid button.ok::after,.qgrid button.bad::after{position:absolute;top:4px;right:5px;font-family:var(--sans);font-size:10px;font-weight:600;line-height:1}
.qgrid button.ok::after{content:"✓"}
.qgrid button.bad::after{content:"✕"}
.qgrid button.cur{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--zhu-ink)}
.qgrid button.cur:not(.ok):not(.bad):not(.done){background:var(--zhu-soft)}
.qgrid button.cur.ok{color:var(--green-ink)}
.qgrid button.cur.bad{color:var(--red-ink)}

/* --- câu hỏi: không khung (gỡ kiểu thẻ học .card của cụm thẻ), đầu câu "Câu 12" serif + con dấu 听/读/写 --- */
.card.excard{position:static;margin:24px 0 0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;text-align:left;overflow:visible;min-height:0;animation:exin .2s ease-out}
.card.excard::before,.card.excard::after{content:none}
@keyframes exin{from{opacity:0;transform:translateY(4px)}}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.qmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.qno{font-family:var(--serif);font-size:30px;line-height:1;color:var(--zhu-ink);font-variant-numeric:lining-nums}
.qno em{font-style:italic;font-size:18px;color:var(--ink2);margin-right:1px}
.qpart{font-size:12.5px;line-height:1.4;color:var(--ink3)}
.qgrp{white-space:nowrap}
.seal.qseal{width:30px;height:30px;font-size:20px;margin-top:2px}
/* công cụ nghe: loa tròn + nút chữ (chữ ink2, icon son, không viền — như "+ Cấp khác"); không đệm ngang để xuống dòng vẫn thẳng mép trái */
.qtools{display:flex;align-items:center;flex-wrap:wrap;gap:2px 20px;margin:12px 0 0}
.qtools .small-btn{border-color:transparent;padding:6px 0;font-size:14px;color:var(--ink2);gap:6px}
.qtools .small-btn .ic{color:var(--zhu-ink)}
.qtools .small-btn:hover{background:none;border-color:transparent;color:var(--ink)}
.qtools > .muted{flex:1 1 100%}
.excard > p.muted{margin:12px 0 0}
.qstar{display:inline-flex;vertical-align:-.1em;color:var(--zhu-ink)}
.qstar .ic{width:16px;height:16px}
/* chữ đề */
.excard .qtext{margin:14px 0 0;font-size:21px;line-height:1.65;color:var(--ink-zh)}
.excard .qtext.qstate{position:relative;padding:14px 0 0 28px;border-top:1px solid var(--rule)}
.qstate .qstar{position:absolute;left:0;top:22px}
.qstate .qstar .ic{width:18px;height:18px}
.qtext .fillin{font-weight:inherit;color:var(--green-ink);background:var(--green-soft);border-radius:2px}
.qlab{display:block;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2)}
.vi-line{margin:4px 0 0;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.55;color:var(--ink2)}
.excard .passage{margin:14px 0 0;font-size:19px;line-height:1.85;color:var(--ink-zh)}
.excard .passage .lab{margin:0 0 2px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.4;color:var(--zhu-ink)}
.excard .passage .ex-py{margin-top:2px;font-family:var(--py);font-size:16px;line-height:1.5;color:var(--ink2)}
.excard .passage .ex-vi{margin-top:2px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.5;color:var(--ink2)}
.excard .passage .spk{vertical-align:middle}
/* lời thoại: trích dẫn kẻ son bên trái, dịch serif nghiêng */
.script{margin:14px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--zhu-line);font-size:18px;line-height:1.7;color:var(--ink-zh)}
.script .sq{margin-top:6px}
.script .sq b{font-weight:400;color:var(--zhu-ink)}
.script .vi{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.55;color:var(--ink2)}
.script .vi b{font-family:var(--sans);font-style:normal;font-weight:500;font-size:13px}

/* --- phương án: hàng kẻ mảnh, chữ cái serif nghiêng son; đúng = xanh + ✓, sai = hồng + ✕, còn lại mờ nhẹ --- */
.opts{display:grid;margin:16px 0 0}
.opt{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-height:54px;padding:10px 6px 10px 2px;
  border:0;border-bottom:1px solid var(--rule);border-radius:0;background:none;text-align:left;color:var(--ink);font-size:16px;line-height:1.4}
.opts > .opt:first-child{border-top:1px solid var(--rule)}
.opt:hover{background:var(--hover);border-color:var(--rule)}
.opt:disabled{cursor:default}
.opt:disabled:hover{background:none;border-color:var(--rule)}
.opt b{flex:none;width:22px;text-align:center;font-family:var(--serif);font-style:italic;font-weight:400;font-size:20px;line-height:1;color:var(--zhu-ink)}
.opt .ot{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .zh{font-size:19px;line-height:1.45;color:var(--ink-zh)}
.opt .ovi{margin-top:1px;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.opt.right,.opt.right:hover{background:var(--green-soft);color:var(--green-ink)}
.opt.right b,.opt.right .zh,.opt.right .ovi{color:var(--green-ink)}
.opt.wrong,.opt.wrong:hover{background:var(--red-soft);color:var(--red-ink)}
.opt.wrong b,.opt.wrong .zh,.opt.wrong .ovi{color:var(--red-ink)}
.opt.picked,.opt.picked:hover{background:var(--zhu-soft)}
.opt.right::after,.opt.wrong::after{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:600;line-height:1}
.opt.right::after{content:"✓"}
.opt.wrong::after{content:"✕"}
.opts:not(.two):not(.cloze):not(.ords) .opt.right,.opts:not(.two):not(.cloze):not(.ords) .opt.wrong{padding-right:34px}
/* phương án không chọn: đổi màu chữ (không làm mờ cả nút) để nghĩa tiếng Việt vẫn ≥ 4.5:1 ở cả 2 bộ màu */
.opt.dim b,.opt.dim .ovi{color:var(--ink3)}
.opt.dim .zh{color:var(--ink2)}
/* Đúng / Sai: 2 cột kẻ mảnh như hàng chấm điểm của thẻ */
.opts.two{grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.opts.two .opt{justify-content:center;text-align:center;min-height:60px;padding:10px 6px;border:0;font-family:var(--serif);font-size:20px;font-weight:500}
.opts.two > .opt:first-child{border-top:0}
.opts.two .opt + .opt{border-left:1px solid var(--rule)}
.opts.two .opt .ot{flex:none}
.opts.two .opt .zh{font-family:inherit;font-size:inherit;color:inherit}
.opts.two .opt.right::after,.opts.two .opt.wrong::after,.opts.cloze .opt.right::after,.opts.cloze .opt.wrong::after{content:none}
/* Đọc 1 (chọn từ điền): bảng từ + lưới 3 cột kẻ mảnh */
.bank{display:flex;flex-wrap:wrap;gap:2px 18px;margin:14px 0 0;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:17px;line-height:1.7;color:var(--ink2)}
.bank div b{margin-right:3px;font-family:var(--serif);font-style:italic;font-weight:400;color:var(--zhu-ink)}
.bank div.used{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--rule2)}
.bank small{font-family:var(--sans);font-size:12px}
.opts.cloze{grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.opts.cloze .opt{justify-content:center;gap:8px;min-height:56px;padding:10px 4px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.opts.cloze > .opt:first-child{border-top:0}
.opts.cloze .opt b{width:auto;font-size:17px}
.opts.cloze .opt .ot{flex:none;min-width:0}
.opts.cloze .opt .zh{white-space:nowrap}
/* Đọc 2 (sắp xếp): đoạn A/B/C kẻ mảnh, dãy đang xếp serif lớn, 3 nút chữ cái */
.segs{margin:14px 0 0;border-top:1px solid var(--rule)}
.seg{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:18px;line-height:1.6;color:var(--ink-zh)}
.seg b{flex:none;width:22px;text-align:center;font-family:var(--serif);font-style:italic;font-weight:400;font-size:20px;color:var(--zhu-ink)}
.seq{margin:16px 0 0;text-align:center;font-family:var(--serif);font-size:26px;line-height:1.3;color:var(--ink);font-variant-numeric:lining-nums}
.seq .sar{font-family:var(--sans);font-size:18px;color:var(--ink3);vertical-align:.12em}
.seq em{margin-right:6px;font-size:16px;color:var(--ink2)}
.opts.ords{gap:8px;margin-top:12px}
.opts.ords .opt.ord{justify-content:center;min-height:56px;border:1px solid var(--rule2);border-radius:var(--r)}
.opts.ords .opt.ord:hover{border-color:var(--ink3)}
.opts.ords .opt.ord b{width:auto;font-size:26px}
.opts.ords .opt.ord.dim{opacity:.35;border-style:dashed}
/* Viết 1 (ghép câu): dòng kẻ son để ghép, mảnh chữ Khải */
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.chips button{min-height:46px;padding:6px 14px;font-family:var(--kai);font-size:20px;font-synthesis:none;color:var(--ink-zh);border-color:var(--rule2)}
.chips button.used{opacity:.3;border-style:dashed}
.chips.ans{min-height:64px;padding:8px 0;border-bottom:1px solid var(--zhu-line)}
.chips.ans button{background:var(--zhu-soft);border-color:var(--zhu-line)}
.chips .muted{font-family:var(--sans)}
.chips.done .tag{font-family:var(--kai);font-size:16px;color:var(--ink2)}
.excard .qact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
/* Viết 2 (đặt câu): chữ đề trong ô 田字格 son, ô gõ câu, bảng viết rộng */
.wword{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 4px}
.wcells{display:flex}
.wcells .tz{display:grid;place-items:center;width:68px;height:68px;font-size:50px;line-height:1;color:var(--ink-zh);border:1px solid var(--tian);
  background:repeating-linear-gradient(to bottom,var(--tian-dash) 0 3px,transparent 3px 6px) center/1px 100% no-repeat,repeating-linear-gradient(to right,var(--tian-dash) 0 3px,transparent 3px 6px) center/100% 1px no-repeat,
    linear-gradient(to top right,transparent calc(50% - .5px),var(--tian-dash) 50%,transparent calc(50% + .5px)),
    linear-gradient(to bottom right,transparent calc(50% - .5px),var(--tian-dash) 50%,transparent calc(50% + .5px))}
.wcells .tz + .tz{margin-left:-1px}
.excard textarea{display:block;width:100%;min-height:88px;margin:12px 0 0;font-family:var(--kai);font-size:20px;line-height:1.5;resize:vertical}
.excard textarea::placeholder{font-family:var(--sans);font-size:15px}
/* bảng viết: khung + vạch chia ô (::before) và lưới 米 nét đứt (::after) do nền vẽ, căn giữa theo canvas — ở đây chỉ bo góc khung, nút "Xóa bảng" sát phải */
.excard .pad-wrap{position:relative;margin:12px 0 0}
.excard .pad.wide{display:block;width:100%;max-width:640px;height:auto;margin:0;border:0;border-radius:var(--r);box-shadow:none;touch-action:none;cursor:crosshair;
  filter:var(--pad-filter);mix-blend-mode:var(--pad-blend)}
.excard .pad-wrap::before{border-radius:var(--r)}
.excard .pad-wrap .small-btn{align-self:flex-end;margin-top:4px;margin-right:-12px;border-color:transparent;color:var(--ink2);gap:6px}
.excard .pad-wrap .small-btn:hover{border-color:transparent}
.excard .actions{margin-top:16px}
.excard .grades.exself{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:8px 0 0;padding:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);position:static;background:none}
.excard .grades.exself button{display:flex;flex-direction:column;gap:3px;min-height:66px;padding:8px 4px;border:0;border-radius:0;background:none;box-shadow:none;
  font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.1;color:var(--ink)}
.excard .grades.exself button + button{border-left:1px solid var(--rule)}
.excard .grades.exself button:hover{background:var(--hover)}
.excard .grades.exself .g1{color:var(--zhu-ink)}
.excard .grades.exself button small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--ink3)}

/* --- kết quả, giải thích, từ đáng học --- */
.result{margin:16px 0 0;padding:10px 12px;border-left:2px solid var(--rule2);border-radius:0;font-size:15.5px;line-height:1.5;color:var(--ink2)}
.result b{font-weight:600}
.result.ok{border-left-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.result.bad{border-left-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.result.na{border-left-color:var(--rule2);color:var(--ink2)}
.result .zh{font-size:18px}
.result small{font-size:13px;font-weight:400;color:var(--ink2)}
.exexp{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.exexp .lab{margin:0 0 4px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--zhu-ink)}
.exexp p{margin:0;font-size:15.5px;line-height:1.6}
.vocab{margin-top:22px}
.vocab h2{margin-bottom:2px}
/* hàng từ theo mẫu danh sách từ của bài học (.wlist): Hán Khải 30px · nghĩa serif / pinyin + HV · loa + "+ Ôn" bên phải.
   Cột chữ Hán rộng bằng từ dài nhất của danh sách (--vhw do vocabHtml đặt: 2 hoặc 3 chữ) để cột nghĩa thẳng hàng. */
.vrow{display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 0;border-bottom:1px solid var(--rule)}
.vrow .vh{flex:none;width:var(--vhw,60px);font-family:var(--kai);font-size:30px;line-height:1.15;color:var(--ink-zh);font-synthesis:none;overflow-wrap:anywhere}
.vrow .vh.long{font-size:22px;line-height:1.3}
.vrow .vt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vrow .vm{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.3;color:var(--ink);text-wrap:pretty}
.vrow .vsub{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;font-size:12.5px;line-height:1.5;color:var(--ink3)}
.vrow .vsub .py{font-size:15px;letter-spacing:.02em;color:var(--ink2)}
.vrow .vsub b{font-weight:500;color:var(--ink2)}
.vrow > .spk{flex:none}
.vrow .small-btn{flex:none;min-width:44px;padding:6px 0 6px 2px;margin-left:-4px;border-color:transparent;font-size:14px;color:var(--ink2);gap:5px;white-space:nowrap}
.vrow .small-btn:hover{background:none;border-color:transparent;color:var(--ink)}
.vrow .small-btn .ic{width:15px;height:15px;color:var(--zhu-ink)}
.vrow .small-btn:disabled{opacity:1;border-color:transparent;color:var(--green-ink)}
.vrow .small-btn:disabled .ic{color:inherit}
.exredo{margin-top:12px;text-align:center}
.exredo .link{gap:6px}
.exredo .link .ic{width:16px;height:16px}

/* --- điều hướng câu: Trước / Sau; mỗi màn 1 nút son đặc (trong thẻ có nút chính thì "Sau" thành nút viền) --- */
.exnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.exnav button{min-height:52px}
.exnav button .ic{width:18px;height:18px}
.exam:has(.excard button.primary:not(.small-btn)) .exnav button.primary{background:transparent;color:var(--ink);border-color:var(--rule2);font-weight:500}
.exam:has(.excard button.primary:not(.small-btn)) .exnav button.primary:hover{background:var(--hover);border-color:var(--ink3)}
.exreset{display:flex;justify-content:center;flex-wrap:wrap;gap:0 18px;margin-top:8px}
.exreset button.link{font-size:13.5px;font-weight:400;color:var(--ink3);text-decoration-color:var(--rule2)}
.exreset button.link:hover{color:var(--ink2)}

/* màn ngang thấp: thanh đề + trình phát gọn 1 hàng */
@media (max-height:500px){
  .bar.exbar{display:flex;align-items:center;gap:6px;padding-top:2px;padding-bottom:2px}
  .exbar .bar-top{flex:none;min-height:44px}
  .exbar:has(.audio-ctl) .bar-top b,.exbar:has(.audio-ctl) .exdone{display:none}
  .exbar:not(:has(.audio-ctl)) .bar-top{flex:1}
  .exbar .audio-ctl{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
  .exbar .au-main{flex:1;min-width:0;gap:8px}
  .exbar .au-sub{flex:none;margin-left:0}
  .exbar .au-rates{margin-right:0}
}
/* ==== [/S3] ==== */
/* ==== [S4] giáo trình, bài học, nhại bài khóa ==== */
/* --- #lessons: đầu báo 课本 · tiêu đề lớn · tab cấp chữ + gạch son · khối đầu cấp (số Hán mờ, % từ đã học) · mục lục bài --- */
.pagehead.lshd{margin-top:0}
.lshd h1.hl{margin-top:8px}
/* tab cấp = hàng tab chung .ptabs của S3 (kẻ tràn mép, gạch son); chỉ chỉnh khoảng cách để đủ 6 cấp trên 360–390px */
.lvbar{margin-top:16px}
.ptabs.lvtabs{margin-top:0;overscroll-behavior-x:contain}
button.lvmore{flex:none;min-height:44px;padding:0 0 0 8px;margin-bottom:-4px;border:0;border-radius:0;background:none;gap:5px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
button.lvmore .ic{width:15px;height:15px;color:var(--zhu-ink)}
button.lvmore:hover{background:none;color:var(--ink)}
.lshero{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:22px 0 16px;border-bottom:1px solid var(--rule);overflow:hidden}
.lshero .ghost{position:absolute;right:76px;top:50%;transform:translateY(-46%);font-family:var(--kai);font-size:140px;line-height:1;color:var(--zhu-soft2);pointer-events:none;font-synthesis:none}
.lsht,.lshero .big{position:relative}
.lsht b{display:block;font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.12;font-variant-numeric:lining-nums}
.lsht small{display:block;margin-top:8px;font-size:12.5px;color:var(--ink3)}
.lshero .big{flex:none;font-family:var(--serif);font-size:62px;line-height:.85;font-variant-numeric:lining-nums tabular-nums}
.lshero .big small{font-size:20px;color:var(--ink3);margin-left:1px}
.lslist .lsitem{position:relative;align-items:center}
.lslist .lsitem .it b.zh{font-family:var(--kai);font-weight:400;font-size:20px;line-height:1.3;color:var(--ink-zh);font-synthesis:none;letter-spacing:.02em;
  white-space:normal;overflow:visible;text-overflow:clip;text-wrap:balance}
.lslist .lsitem .it small.lsvi{margin-top:1px;font-size:13.5px;color:var(--ink2)}
.lslist .lsitem .it small + small{margin-top:2px}
.lslist .lson{font-style:normal;font-weight:500;color:var(--zhu-ink)}
.lslist .lsitem .pct small{margin-left:0}
.lsl .nowrap{white-space:nowrap}
.lsitem .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --- #lesson/<id>: hàng quay lại · đầu bài (chữ Hán đầu mờ lớn, tên Khải to, tên Việt serif nghiêng) · mục tiêu · nút vào phiên · tab dính --- */
.lstop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 0 6px;border-bottom:1px solid var(--rule)}
.lstop button.lsback{border:0;padding:6px 10px 6px 0;gap:6px;font-size:15px;color:var(--ink2);background:none}
.lstop button.lsback:hover{background:none;color:var(--ink)}
.lstop button.lshome{font-size:14px;color:var(--ink3);text-decoration-color:var(--rule2)}
.lstop button.lshome:hover{color:var(--ink2)}
.lsn .lshead{position:relative;padding:20px 0 18px;overflow:hidden}
.lsn .lshead .ghost{position:absolute;right:-8px;top:-10px;font-family:var(--kai);font-size:172px;line-height:1;color:var(--zhu-soft2);pointer-events:none;font-synthesis:none}
.lsn .lskick{position:relative;margin:0;font-size:12.5px;line-height:1.5;color:var(--ink3)}
.lsn .lshead h1.tzh{position:relative;margin:10px 0 0;font-family:var(--kai);font-weight:400;font-size:34px;line-height:1.28;letter-spacing:.02em;color:var(--ink-zh);font-synthesis:none;text-wrap:balance}
.lsn .lshead h1.tzh .spk{vertical-align:.2em;margin-left:2px}
@media (max-width:380px){.lsn .lshead h1.tzh{font-size:30px}}
/* chữ cuối + nút loa không tách dòng (loa không rớt xuống một dòng riêng) */
.zhend{white-space:nowrap}
.lsn .lshead .tvi{position:relative;margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.3;color:var(--ink2)}
.lsn .lab,.wlist .chiettu .label{margin:0 0 4px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:15px;line-height:1.4;color:var(--zhu-ink)}
.lsgoals{padding:14px 0 2px;border-top:1px solid var(--rule)}
.lsn .goals{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.lsn .goals li{position:relative;padding:2px 0 2px 20px}
.lsn .goals li::before{content:"—";position:absolute;left:0;top:2px;color:var(--zhu-ink)}
.lsn button.lstoggle{width:100%;min-height:52px;margin:16px 0 0;font-size:15.5px}
.lsn button.lstoggle .ic{width:18px;height:18px}
.lsn button.lstoggle.on{justify-content:flex-start;gap:10px;padding:10px 14px;background:transparent;border-color:var(--green-line);color:var(--green-ink);font-weight:500;text-align:left}
.lsn button.lstoggle.on:hover{background:var(--green-soft);border-color:var(--green)}
.lsn button.lstoggle.on > span{flex:1;min-width:0}
.lsn button.lstoggle.on small{flex:none;font-size:13px;font-weight:400;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:3px}
/* tab phần của bài = hàng tab chung .ptabs (S3); riêng ở đây: dính mép trên, 4 tab dàn đều */
.ptabs.lstabs{position:sticky;top:0;z-index:5;justify-content:space-between;gap:8px;margin-top:18px;overflow:visible;
  background:var(--bg-glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ptabs.lstabs button{min-width:44px}
html.insess .ptabs.lstabs{top:var(--smh)}
@media (max-width:420px){.ptabs.lvtabs{gap:16px}}
@media (max-width:380px){.ptabs.lvtabs{gap:12px}}
.lsbody{padding-top:4px}

/* --- Từ mới (dùng chung cho cấp bản đồ, pre "mp"): hàng mục lục — Hán Khải to · nghĩa serif · pinyin + Hán Việt + loại từ --- */
.wlhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);border-bottom:1px solid var(--rule)}
.wlhead button.link{flex:none;font-size:14px}
.wlist .wrow{border-bottom:1px solid var(--rule);cursor:pointer}
.wlist .wrow:hover{background:var(--hover)}
.wlist .wtop{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 0}
/* cột chữ Hán rộng cố định 64px để cột nghĩa thẳng hàng: 1–2 chữ 30px · 3 chữ 21px · 4 chữ xếp 2×2 · từ 5 chữ trở lên 16px, chia dòng cân */
.wlist .wh{flex:0 0 64px;width:64px;font-family:var(--kai);font-size:30px;line-height:1.15;color:var(--ink-zh);font-synthesis:none}
.wlist .wh.long{font-size:21px}
.wlist .wh.xlong{font-size:26px;line-height:1.1;word-break:break-all}
.wlist .wh.xxlong{font-size:16px;line-height:1.3;text-wrap:balance}
.wlist .wt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wlist .mn{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.3;color:var(--ink)}
.wlist .wsub{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;font-size:12.5px;line-height:1.5;color:var(--ink3)}
.wlist .wsub .py{font-size:15px;letter-spacing:.02em;color:var(--ink2)}
.wlist .wsub b{font-weight:500;color:var(--ink2)}
.wlist .wsub .tag{align-self:center}
.wlist .wtop > .spk{flex:none}
.wlist .wchev{flex:none;display:grid;place-items:center;width:18px;color:var(--ink3)}
.wlist .wrow.open .wh{color:var(--zhu-ink)}
.wlist .wrow.open .wchev{color:var(--zhu-ink)}
.wlist .wmore{cursor:auto;padding:0 0 18px 76px}
@media (max-width:480px){.wlist .wmore{padding-left:0}}
.wlist .chiettu{margin:2px 0 0}
.wlist .chiettu > div:last-child{font-size:14.5px;line-height:1.6;color:var(--ink2)}

/* --- ví dụ dạng trích dẫn (dấu “ son), ghi chú có icon: trong hàng từ + ngữ pháp + kiểm tra --- */
.wlist .examples,.lsbody .examples{margin-top:10px}
/* cùng số đo với câu ví dụ của thẻ học (.card .ex): dấu “ 46px, thụt 30px, Hán 21 · pinyin 14.5 · Việt 15.5 */
.wlist .ex,.lsbody .ex{position:relative;padding:8px 0 8px 30px}
.wlist .ex::before,.lsbody .ex::before{content:"\201C";position:absolute;left:-2px;top:7px;font-family:var(--serif);font-size:46px;line-height:1;color:var(--zhu-ink)}
.wlist .ex .ex-zh,.lsbody .ex .ex-zh{padding-right:36px;font-family:var(--kai);font-size:21px;line-height:1.5;letter-spacing:.02em;color:var(--ink-zh);font-synthesis:none;text-wrap:balance}
/* loa cuối câu: lề phải âm bằng đúng bề rộng của nó → không bao giờ bị đẩy xuống một dòng riêng (nằm vào phần padding-right) */
.wlist .ex .ex-zh button.spk.sm,.lsbody .ex .ex-zh button.spk.sm{margin-left:4px;margin-right:-36px;vertical-align:-5px}
.wlist .ex .ex-py,.lsbody .ex .ex-py{font-size:14.5px;line-height:1.45;color:var(--ink3)}
.wlist .ex .ex-vi,.lsbody .ex .ex-vi{margin-top:1px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.45;color:var(--ink2)}
.wlist .note,.lsbody .note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;line-height:1.6;color:var(--ink2)}
.wlist .note .ic,.lsbody .note .ic{margin-top:.2em;color:var(--zhu-ink)}

/* --- Ngữ pháp --- */
.lsbody .gp{padding:20px 0 22px;border-bottom:1px solid var(--rule)}
.gphead{display:flex;gap:14px;align-items:baseline}
.gpno{flex:none;width:34px;font-family:var(--serif);font-size:24px;line-height:1;color:var(--zhu-ink);font-variant-numeric:lining-nums}
.gpti{flex:1;min-width:0}
.lsbody .gpt{font-family:var(--kai);font-size:23px;line-height:1.35;color:var(--ink-zh);font-synthesis:none}
.lsbody .gpt .tag{vertical-align:.25em;font-family:var(--sans)}
.lsbody .gpn{margin-top:3px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.35;color:var(--ink2)}
/* công thức: --sans (Be Vietnam Pro) cho chữ Việt/ký hiệu, chữ Hán tự rơi về WenKai trong stack --sans */
.lsbody .struct{margin:14px 0 12px;padding:3px 0 3px 14px;border-left:2px solid var(--zhu-ink);font-family:var(--sans);font-size:17px;line-height:1.6;color:var(--ink-zh);font-synthesis:none}
.gpx{font-size:15px;line-height:1.65}
.gpx > div + div{margin-top:6px}
.lsbody .mistake{margin-top:14px;padding:2px 0 2px 14px;border-left:2px solid var(--orange);font-size:14.5px;line-height:1.6;color:var(--ink2)}
.lsbody .mistake b{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-weight:500;color:var(--orange-ink)}

/* --- Bài khóa: như trang sách — tên người nói nhỏ son · câu Khải to · pinyin · dịch serif nghiêng --- */
.lstools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 0 0}
.lslab{margin-right:2px;font-size:12.5px;color:var(--ink3)}
.lstools button.small-btn{padding:4px 14px;gap:6px;font-size:14px}
.lstools button.small-btn .ic{width:15px;height:15px;color:var(--zhu-ink)}
.lstools button.small-btn{color:var(--ink3)}
/* đang bật = nền son nhạt + viền son (SPEC 5), giống nút "Tắt nhại theo" ngay dưới; tắt = viền mảnh, chữ nhạt, không ✓ */
.lstools button.small-btn.primary{background:var(--zhu-soft);border-color:var(--zhu-line);color:var(--zhu-ink)}
.lstools button.small-btn.primary:hover{background:var(--zhu-soft2);border-color:var(--zhu-ink)}
.shbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px 0 0;padding:0 0 12px;border-bottom:1px solid var(--rule)}
.shbar button.shtoggle{gap:7px}
.shbar button.shtoggle .ic{width:17px;height:17px;color:var(--zhu-ink)}
.shbar .muted{flex:1;min-width:12em;font-size:13px;line-height:1.45;color:var(--ink3)}
.lsbody .gp.tx{padding:22px 0 14px}
.lsbody .gp.tx:last-child{border-bottom:0}
.txhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.txno{flex:none;min-width:24px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:21px;line-height:1.25;color:var(--zhu-ink)}
.txti{flex:1;min-width:0}
.txt{font-family:var(--kai);font-size:21px;line-height:1.3;color:var(--ink-zh);font-synthesis:none;text-wrap:balance}
.txv{margin-top:2px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.35;color:var(--ink2);text-wrap:pretty}
.txhead button.lsread{flex:none;padding:4px 12px;gap:6px;font-size:13.5px}
.txhead button.lsread .ic{width:15px;height:15px}
.tline{display:flex;gap:12px;align-items:flex-start;margin:0 -8px 0 -12px;padding:9px 8px 11px 10px;border-left:2px solid transparent;scroll-margin-top:68px}
html.insess .tline{scroll-margin-top:0}
.tline .spkr{flex:none;width:3.2em;padding-top:7px;font-family:var(--kai);font-size:14.5px;line-height:1.3;color:var(--zhu-ink);font-synthesis:none;overflow-wrap:anywhere}
.tline .tb{flex:1;min-width:0}
.tline .tzh{font-family:var(--kai);font-size:23px;line-height:1.5;letter-spacing:.02em;color:var(--ink-zh);font-synthesis:none;text-wrap:balance}
.tline .tzh .spk{vertical-align:.15em}
.tline .ex-py{margin-top:1px;font-size:14.5px;line-height:1.45;letter-spacing:.01em;color:var(--ink2)}
.tline .ex-vi{margin-top:2px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.45;color:var(--ink2)}
.tline.reading,.tline.shcur{border-left-color:var(--zhu-ink);background:var(--zhu-soft)}
.tline.shpick{cursor:pointer}
.tline.shpick .tzh{color:var(--ink2)}
.tline.shpick .ex-py,.tline.shpick .ex-vi{color:var(--ink3)}
.tline.shpick:hover{background:var(--hover)}
.tline.shpick:hover .tzh{color:var(--ink-zh)}
/* nhại: khung điều khiển dưới câu đang luyện (nút mic / .vstat / .vcmp kiểu ở S1 — ở đây chỉ bố cục) */
.vbox.shctl{margin-top:10px;padding-top:10px;border-top:1px solid var(--zhu-line);text-align:left}
.vbox.shctl .vctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;align-items:center;margin-top:0}
.vbox.shctl .vstat,.vbox.shctl .vcmp{text-align:left}
/* câu mẫu tô đúng/sai sau khi nói (màu .vok/.vmiss của S1): cỡ ngang câu bài khóa, tách khỏi hàng nút */
.vbox.shctl .vzh{margin-top:12px;font-family:var(--kai);font-size:22px;line-height:1.5;letter-spacing:.02em;color:var(--ink-zh);font-synthesis:none}
.vbox.shctl button.spk.vref{min-width:0;padding:6px 14px;gap:6px;border-radius:var(--r);font-size:14px;color:var(--ink)}
.vbox.shctl button.spk.vref .ic{width:16px;height:16px;color:var(--zhu-ink)}
.vbox.shctl .vnext{display:flex;justify-content:flex-end;margin-top:10px}
.vbox.shctl .vnext .ic{width:17px;height:17px}

/* --- Kiểm tra: số serif son + nhãn kiểu câu nghiêng · câu Khải · hàng Đúng | Sai sát mép kẻ dọc --- */
.qzintro{margin:12px 0 4px;font-size:13.5px;line-height:1.55;color:var(--ink3)}
.qzintro b{font-weight:500;color:var(--ink2)}
.qzintro em{font-family:var(--serif);color:var(--ink2)}
.qzsum{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;font-size:13px;color:var(--ink3);border-bottom:1px solid var(--rule)}
.qzsum b{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);font-variant-numeric:lining-nums}
.qzsum button.link{gap:5px;font-size:14px}
.qzsum button.link .ic{width:15px;height:15px}
.lsbody .qz{padding:26px 0 4px}
/* chỉ trong bài học: .qhead/.qno cũng là tên lớp của câu đề (S3) — không để hai bên đè nhau */
.lsbody .qhead{display:flex;align-items:baseline;justify-content:flex-start;gap:10px}
.lsbody .qno{font-family:var(--serif);font-size:20px;line-height:1;color:var(--zhu-ink);font-variant-numeric:lining-nums}
.lsbody .qkind{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink2)}
.lsbody .qtext{margin-top:8px;font-family:var(--kai);font-size:22px;line-height:1.5;letter-spacing:.02em;color:var(--ink-zh);font-synthesis:none;text-wrap:balance}
.lsbody .qtext .spk{vertical-align:.15em}
.lsbody .opts.two{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.lsbody .opt{min-height:54px;border:0;border-left:1px solid var(--rule);border-radius:0;background:none;font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink)}
.lsbody .opt:first-child{border-left:0}
.lsbody .opt:hover{background:var(--hover);border-color:var(--rule)}
.lsbody .opt:disabled:hover{background:none}
.lsbody .opt.right,.lsbody .opt.right:hover{background:var(--green-soft);color:var(--green-ink)}
.lsbody .opt.wrong,.lsbody .opt.wrong:hover{background:var(--red-soft);color:var(--red-ink)}
.lsbody .opt.dim{color:var(--ink3)}
.lsbody .result{margin-top:12px;font-size:14.5px;font-weight:500}
.lsbody .result.ok{color:var(--green-ink)}
.lsbody .result.bad{color:var(--red-ink)}
.lsbody .vi-line{margin-top:4px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.45;color:var(--ink2)}
@media (max-height:500px){.lsn .lshead{padding:12px 0}.lsn .lshead .ghost{font-size:120px}.ptabs.lstabs button{min-height:44px}}
/* ==== [/S4] ==== */
/* ==== [S5] đóng vai AI, AI chấm bài, cài đặt AI ==== */
/* ---------- AI chấm (thẻ dịch / thẻ nói / bài cũ): không khung — đường kẻ trên tô màu kết quả, chữ kết quả serif kèm dấu ✓ ≈ ✕ ---------- */
.aibox{margin-top:18px;padding:12px 0 0;border-top:2px solid var(--rule2);text-align:left}
.aibox.v-dung{border-top-color:var(--green-line)}
.aibox.v-gan-dung{border-top-color:var(--orange-line)}
.aibox.v-sai{border-top-color:var(--red-line)}
.aibox.wait{border-top:1px dashed var(--rule2)}
.aihead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px}
.aiverd{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;color:var(--ink)}
.aimk{flex:none;font-family:var(--sans);font-weight:600;font-size:17px}
.v-dung .aiverd{color:var(--green-ink)}
.v-gan-dung .aiverd{color:var(--orange-ink)}
.v-sai .aiverd{color:var(--red-ink)}
.aiscore{margin-left:auto;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.aiscore::after{content:"/100";margin-left:2px;font-size:12px;color:var(--ink3)}
.aitag{flex:1 0 100%;order:3;margin-top:2px;font-size:12px;line-height:1.4;color:var(--ink3)}
.aibox.wait .aitag{flex:0 1 auto;order:0;margin:0}
.aiwait{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink2);animation:breathe 1.6s ease-in-out infinite}
.aichk{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:8px;font-size:13.5px;line-height:1.5}
.aichk .ok{color:var(--green-ink)}
.aichk .no{color:var(--red-ink)}
.aiiss{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.aiiss li{display:flex;align-items:baseline;gap:10px;padding-left:12px;border-left:2px solid var(--red-line);font-size:14.5px;line-height:1.5;color:var(--ink)}
.aiiss b.zh{flex:none;font-weight:400;font-size:20px;line-height:1.3;color:var(--red-ink)}
.airow{margin-top:12px}
.ailab{margin-bottom:1px;font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.4;color:var(--zhu-ink)}
.aizh{display:flex;align-items:center;gap:6px;padding:1px 0}
.aizh .zh{flex:1;min-width:0;font-size:21px;line-height:1.45;color:var(--ink-zh);overflow-wrap:anywhere}
.aibox .aivi{font-size:15px;line-height:1.5;color:var(--ink)}
.ainote{margin-top:10px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.aisugtxt{margin-top:12px;padding-top:9px;border-top:1px solid var(--rule);font-size:13px;line-height:1.45;color:var(--ink3)}
.aisugtxt b{font-weight:600;color:var(--zhu-ink)}
.ailine{display:flex;align-items:baseline;gap:8px;margin-top:14px;font-size:14px;line-height:1.45;text-align:left}
.ailine .ic{flex:none;transform:translateY(2px)}
.ailine.warn{border-top:0;padding:0;color:var(--orange-ink)} /* .warn của nền kẻ vạch đỏ 2px + đệm 14px: AI lỗi không phải "sai" */
/* nút chấm AI gợi ý: chỉ vạch son trên đỉnh ô (.grades button.aisug::before ở [S1]) — không thêm viền trong */
/* đang chờ AI chấm: nút "Đang chấm…" + "Bỏ qua AI" cùng hàng (dock) */
.actions.aiwaitrow{display:flex;align-items:center;gap:10px}
.actions.aiwaitrow button.big{flex:1;min-width:0;padding-left:12px;padding-right:12px}
.actions.aiwaitrow button.big:disabled{opacity:.8}
.actions.aiwaitrow button.small-btn{flex:none;min-height:56px}

/* ---------- Tôi → AI: các hàng cài đặt ngăn bằng đường kẻ, như các mục cài đặt khác ---------- */
.setting.aiset{flex-direction:column;align-items:stretch;gap:10px}
.setting.aiset > span.aititle{flex:none}
.aikeylab{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;margin-top:6px;font-size:14px;color:var(--ink2)}
.aimask{display:inline-flex;align-items:baseline;gap:5px;font-size:12.5px;color:var(--green-ink)}
.aimask .ic{align-self:center;width:14px;height:14px}
.aimask .aimkey{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.aimask.none{color:var(--ink3)}
.aikey{display:flex;gap:8px}
.aikey input{flex:1;min-width:0}
.aikey input::placeholder{font-size:14.5px}
.aikey button{flex:none;min-width:72px}
.aikey input:focus{border-color:var(--zhu-line)}
.aibtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.aitest{display:inline-flex;align-items:baseline;gap:6px;font-size:13.5px;line-height:1.4}
.aitest .ic{flex:none;transform:translateY(2px)}
.aitest.ok{color:var(--green-ink)}
.aitest.err{color:var(--orange-ink)}
.aitest.wait{color:var(--ink2)}
.aisub{display:flex;align-items:center;gap:12px;min-height:56px;padding-top:8px;border-top:1px solid var(--rule)}
.setting.aiset .aisub > span{flex:1;min-width:0}
.aisub select{max-width:64%;min-width:0;text-overflow:ellipsis}
@media (max-width:520px){.aimodel{flex-wrap:wrap;gap:6px 12px;padding-bottom:4px}.aimodel select{flex:1 1 100%;max-width:none}}
.aicost{padding-top:10px;border-top:1px solid var(--rule);font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}

/* ---------- ĐÓNG VAI: như trang phỏng vấn — người nói ở lề trái (甲 nhân vật AI / 乙 bạn), không bong bóng ---------- */
.wrap.rpwrap,html.tabbed .wrap.rpwrap{padding-bottom:0} /* html.tabbed có thể còn sót khi vào đóng vai (render() trả về sớm, không gọi addTabBar) */
.rptop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
button.rpbackb{gap:6px;padding:6px 12px 6px 0;border-color:transparent;color:var(--ink2)}
button.rpbackb:hover{background:none;border-color:transparent;color:var(--ink)}
.rpturn{font-size:14px;color:var(--ink2);font-variant-numeric:lining-nums tabular-nums}
.rphead{position:relative;margin-top:20px;padding-bottom:4px}
.rphead .rpseal{position:absolute;right:0;top:2px;display:block;width:auto;height:auto;padding:6px 4px;writing-mode:vertical-rl;font-size:16px;line-height:1.1;letter-spacing:.1em}
.rpkick{padding-right:44px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.4;color:var(--zhu-ink)}
.rpkick span{margin-left:8px;font-family:var(--sans);font-style:normal;font-size:12.5px;color:var(--ink3)}
.rphead h1.rpt{margin:8px 44px 0 0;font-size:34px;line-height:1.12}
.rpset{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--ink2)}
.rpwho{font-family:var(--kai);font-synthesis:none;font-style:normal;font-weight:400;line-height:1;text-align:center}
.rproles{margin:14px 0 0;border-top:1px solid var(--rule)}
.rproles > div{display:grid;grid-template-columns:24px 58px minmax(0,1fr);align-items:baseline;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.45}
.rproles .rpwho{font-size:20px;color:var(--zhu-ink)}
.rproles > div + div .rpwho{color:var(--ink2)}
.rproles b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:14px;color:var(--ink3)}
.rpgh{margin-top:16px;font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--zhu-ink)}
.rpgoals{list-style:none;margin:4px 0 0;padding:0}
.rpgoals li{display:flex;align-items:baseline;gap:10px;padding:4px 0;font-size:15px;line-height:1.45;color:var(--ink)}
.rpgoals .rpck{flex:none;width:24px;text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink3);font-variant-numeric:lining-nums}
.rpgoals .rpgt{flex:1;min-width:0}
.rpgoals li.ok{color:var(--ink2)}
.rpgoals li.ok .rpck{font-family:var(--sans);font-style:normal;font-weight:600;color:var(--green-ink)}
.rpgd{flex:none;font-size:12px;color:var(--green-ink)}
/* lời thoại */
.rpchat{display:flex;flex-direction:column;margin:14px 0 8px;border-top:1px solid var(--rule)}
.rpmsg{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;padding:14px 0 12px}
.rpmsg.ai + .rpmsg.me{padding-top:2px}
.rpmsg.me + .rpmsg.ai,.rpmsg.ai + .rpmsg.ai{border-top:1px solid var(--rule)}
.rpmsg > .rpwho{grid-row:1 / span 2;padding-top:6px;font-size:21px;color:var(--zhu-ink)}
.rpmsg.me > .rpwho{color:var(--ink3)}
.rpbub,.rpcorr{grid-column:2;min-width:0}
.rpzh{font-size:23px;line-height:1.5;letter-spacing:.02em;color:var(--ink-zh);overflow-wrap:anywhere}
.rpmsg.me .rpzh{font-size:20px;color:var(--ink)}
.rppy{margin-top:1px;font-size:16px;line-height:1.45;color:var(--ink2)}
.rpvi{margin-top:3px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.45;color:var(--ink2)}
.rptools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px;margin:8px 0 0 -6px}
.rptools button.spk.sm{margin-right:2px}
/* nút bật Pinyin / Dịch: small-btn của nền (bật = .primary), gọn 34px nhưng vùng chạm vẫn 44px */
.rptools button.small-btn.rptg{position:relative;min-height:34px;padding:4px 12px;font-size:13.5px}
.rptools button.small-btn.rptg::before{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.rpsrc{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:12px;color:var(--ink3)}
.rpsrc .ic{width:14px;height:14px}
/* nhận xét câu mình nói: lề trái tô màu kết quả, nhãn serif nghiêng */
.rpcorr{margin-top:8px;padding:1px 0 1px 12px;border-left:2px solid var(--rule2);font-size:14px;line-height:1.5}
.rpcorr.fix{border-left-color:var(--orange-line)}
.rpcorr.ok{border-left-color:var(--green-line)}
.rpcorr.err{display:flex;align-items:baseline;gap:8px;border-left-color:var(--red-line);color:var(--red-ink)}
.rpcorr.err .ic{flex:none;transform:translateY(2px)}
.rpclab{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.45}
.rpcorr.fix .rpclab,.rpfix .rpclab{color:var(--orange-ink)}
.rpcorr.ok .rpclab,.rpfix.ok .rpclab{color:var(--green-ink)}
.rpcorr .aizh .zh,.rpsug .aizh .zh,.rpfix .aizh .zh{font-size:20px}
.rpalt{flex:none;font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink3)}
.rpcvi{font-size:14.5px;line-height:1.5;color:var(--ink)}
.rpnote{margin-top:2px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.rpdots{display:inline-flex;gap:6px;padding:14px 0 8px}
.rpdots i{width:6px;height:6px;border-radius:50%;background:var(--zhu-ink);animation:rpdot 1.2s ease-in-out infinite}
.rpdots i:nth-child(2){animation-delay:.15s}
.rpdots i:nth-child(3){animation-delay:.3s}
@keyframes rpdot{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* dock dính đáy: ô gõ + nút (luôn thấy khi cuộn hội thoại) */
.rpdock{position:sticky;bottom:0;z-index:4;margin:8px -20px 0;padding:10px 20px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule)}
html:has(.rpdock){scroll-padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.rpwrap > .hint{margin-top:0;padding:10px 0 24px}
body:has(.rpdock) #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.rpform{margin:0}
.rpdock input.rpin{display:block;width:100%;min-height:52px;padding:8px 14px;font-family:var(--kai);font-synthesis:none;font-size:22px;line-height:1.3;color:var(--ink-zh);
  background:var(--raise);border:1px solid var(--rule2);border-radius:var(--r)}
.rpdock input.rpin:focus{border-color:var(--zhu-line)}
.rpdock input.rpin::placeholder{font-family:var(--sans);font-size:15px}
.rpdock input.rpin[readonly]{opacity:.55}
.rpbtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.rpbtns button.small-btn{min-height:44px}
.rpbtns button.primary{min-height:48px;margin-left:auto;padding:6px 22px}
.rpbtns button.primary.rpgo{flex:1;margin-left:0}
.rpbtns button.mic{width:auto;min-width:0;min-height:44px;padding:6px 14px;border-radius:var(--r);font-size:14.5px;font-weight:500}
.rpbtns button.mic.on{background:var(--zhu-soft);border-color:var(--zhu-line);color:var(--zhu-ink)}
.rpbtns button.mic.wait{border-style:dashed}
.rpvst:empty{display:none}
.rpvst .vstat{margin-top:6px;text-align:left;font-size:13px;line-height:1.45;color:var(--ink3)}
.rpvst .vstat.warn{color:var(--orange-ink)}
.rpvst .vstat.live{color:var(--zhu-ink)}
.rpvst .vdot{display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:var(--zhu-ink);vertical-align:1px}
/* gợi ý câu (AI): lề tím, thu gọn còn 1 dòng khi đã đưa vào ô */
.rpsug{max-height:32vh;overflow:auto;margin-bottom:10px;padding:1px 0 1px 12px;border-left:2px solid var(--plum-line);font-size:14px;line-height:1.5}
.rpsug .rpclab{display:flex;align-items:center;gap:6px;color:var(--plum-ink)}
.rpsug.wait,.rpsug.err{display:flex;align-items:baseline;gap:8px;color:var(--ink2)}
.rpsug.wait .ic{flex:none;color:var(--plum-ink);transform:translateY(2px)}
.rpsug.err{border-left-color:var(--orange-line);color:var(--orange-ink)}
.rpsug.err .ic{flex:none;transform:translateY(2px)}
.rpsugb{display:flex;align-items:center;gap:6px;margin-top:6px}
.rpsugb button.link{min-width:44px;margin-left:auto}
.rpsug.mini .rpsugb{margin-top:0}
.rpsug.mini .rpsugb > .ic{flex:none;color:var(--plum-ink)}
.rpsug.mini .rpsugb > span{flex:1;min-width:0}
.rpdock:focus-within .rpsug .rpnote{display:none}
html.insess body:has(#rpIn:focus) .smini{display:none}
html.insess body:has(#rpIn:focus){padding-top:env(safe-area-inset-top)}
.rpnoai{font-size:14.5px;line-height:1.55;color:var(--ink)}
.rpnoai b{display:block;margin-bottom:2px;font-family:var(--serif);font-weight:500;font-size:18px}
.rpnoai small{display:block;margin-top:4px;font-size:12.5px;color:var(--ink3)}
.rpover{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.4;color:var(--ink);text-align:center}
.rpover .ic{flex:none;color:var(--zhu-ink)}
/* màn ngang thấp: ô gõ + nút cùng hàng để còn chỗ cho hội thoại */
@media (max-height:500px){
  .rpdock[data-mode="chat"]{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .rpdock[data-mode="chat"] > #rpSug,.rpdock[data-mode="chat"] > .rpvst{grid-column:1 / -1}
  .rpdock[data-mode="chat"] > #rpCtl{margin-top:0;flex-wrap:nowrap}
  .rpdock input.rpin{min-height:44px;font-size:20px;padding-top:6px;padding-bottom:6px}
  .rpbtns button.primary{min-height:44px}
  .rpsug{max-height:26vh;margin-bottom:6px}
  .rpsug:not(.mini):not(.wait):not(.err){display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;column-gap:14px}
  .rpsug:not(.mini):not(.wait):not(.err) > *{grid-column:2;min-width:0}
  .rpsug:not(.mini):not(.wait):not(.err) > .rpclab{grid-column:1;grid-row:1}
  .rpsug:not(.mini):not(.wait):not(.err) > .aizh{grid-row:1}
  .rpsug:not(.mini):not(.wait):not(.err) > .rpsugb{grid-column:3;grid-row:1 / span 3;align-self:start;margin-top:0}
  .rpsug .rpnote{display:none}
}
/* tổng kết: số mục tiêu serif lớn + con dấu 完, các câu sửa / từ khóa là hàng mục lục */
.rpsum{margin-top:22px}
.rpscore{display:flex;align-items:flex-end;gap:14px;padding:6px 0 16px;border-bottom:1px solid var(--rule)}
.rpsn{flex:none;font-family:var(--serif);font-weight:400;font-size:64px;line-height:.85;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.rpsn small{margin-left:2px;font-size:22px;color:var(--ink3)}
.rpsl{flex:1;min-width:0;display:flex;flex-direction:column;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.25;color:var(--ink)}
.rpsl small{margin-top:5px;font-family:var(--sans);font-style:normal;font-size:12.5px;line-height:1.4;color:var(--ink3)}
.rpscore .rpstamp{align-self:flex-start;width:40px;height:40px;font-size:27px;transform:rotate(-6deg)}
.rpsum h2{margin-top:26px}
.rpfix{padding:10px 0 12px;border-bottom:1px solid var(--rule)}
.rpyou{font-size:12.5px;color:var(--ink3)}
.rpyou .zh{margin-left:6px;font-size:17px;color:var(--ink2)}
.rpfix:not(.ok) .rpyou .zh{text-decoration:line-through;text-decoration-color:var(--orange-line);text-decoration-thickness:1px}
.rpfix .rpclab{margin-top:6px}
.rpaddrow{display:flex;justify-content:flex-end;margin-top:4px}
.rpkw{display:grid;grid-template-columns:80px minmax(0,1fr) auto auto;grid-template-areas:"h m s b";align-items:center;gap:0 10px;min-height:64px;padding:8px 0;border-bottom:1px solid var(--rule)}
.rpkh{grid-area:h;min-width:0;font-size:30px;line-height:1.1;text-align:left;color:var(--zhu-ink);overflow-wrap:anywhere}
.rpkh.l3{font-size:25px}
.rpkh.l4{font-size:19px}
.rpkw > .spk{grid-area:s}
.rpkw > .rpadd{grid-area:b;justify-self:end}
.rpkw > .rpadded{grid-column:2 / -1;grid-row:2;justify-self:start;max-width:none;margin-top:2px;text-align:left}
.rpkm{grid-area:m;min-width:0;font-size:14px;line-height:1.4;color:var(--ink2)}
.rpkm .py{display:block;font-size:16px;color:var(--ink)}
button.rpadd{flex:none;min-height:44px;padding:4px 14px;font-size:14px}
.rpadded{font-size:12.5px;line-height:1.35;color:var(--green-ink)}
.rpadded.note{color:var(--ink3)}
.rpaddall{margin:14px 0 4px}
.rpaddnote{margin:12px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink3)}
.rpaddnote b{font-weight:500;color:var(--ink2)}
.rpnone{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2)}
.rpend{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:26px}
.rpend button.rpbackb{align-self:center;padding:6px 12px}
.rplog{margin-top:26px;border-top:1px solid var(--rule)}
.rplog summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink)}
.rplog summary::-webkit-details-marker{display:none}
.rplog summary .ic{color:var(--ink3);transition:transform .2s}
.rplog[open] summary .ic{transform:rotate(180deg)}
.rplog .rpchat{margin:0 0 12px}
@media (max-width:360px){.rphead h1.rpt{font-size:27px}.rpzh{font-size:21px}.rpsn{font-size:56px}.rpkw{grid-template-columns:72px minmax(0,1fr) auto auto;gap:0 8px}.rpkh{font-size:27px}.rpkh.l3{font-size:22px}.rpkh.l4{font-size:17px}}
/* ==== [/S5] ==== */
/* ==== [S6] dịch tin nhắn ==== */
/* thanh tab 6 mục: chữ 10px, không xuống dòng (vừa 360px) */
.tabbar .tab span{font-size:10px}
/* ô nhập: khối nổi duy nhất của màn; tự giãn bằng JS */
.dichform{margin-top:18px}
textarea.dichin{display:block;width:100%;min-height:120px;resize:none;padding:12px 14px;font-size:16.5px;line-height:1.55;overflow-y:auto}
textarea.dichin[readonly]{color:var(--ink2)}
.dichbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.dichdir{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.4;color:var(--ink3)}
.dichdir .ic{flex:none;color:var(--zhu-ink)}
button.dichgo{flex:none;min-width:120px;padding:10px 26px}
.dichpriv{display:flex;align-items:flex-start;gap:7px;margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink3)}
.dichpriv .ic{flex:none;width:14px;height:14px;margin-top:2px}
.dichform .hint{margin-top:6px;text-align:left}
.dnoai{margin-top:12px;font-size:14.5px;line-height:1.55;color:var(--ink)}
.dnoai b{display:block;margin-bottom:2px;font-family:var(--serif);font-weight:500;font-size:18px}
.dbtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px}
.dicherr{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:2px 0 2px 12px;border-left:2px solid var(--orange-line);font-size:14px;line-height:1.5;color:var(--orange-ink)}
.dicherr .ic{flex:none;margin-top:2px}
.dwait{display:flex;align-items:center;gap:8px;margin-top:22px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink2);animation:breathe 1.6s ease-in-out infinite}
.dwait .ic{color:var(--zhu-ink)}
/* kết quả: chữ Hán to + pinyin từ điển + loa / Chép; tiếng Việt serif */
.dichres{margin-top:28px}
.dlab{margin:14px 0 4px;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--zhu-ink)}
.dichres h2 + .dlab{margin-top:4px}
.dsrc{margin:4px 0 12px;padding:0 0 0 12px;border-left:2px solid var(--rule2);font-size:14.5px;line-height:1.5;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.dzh{font-size:30px;line-height:1.35;color:var(--ink-zh);white-space:pre-wrap;overflow-wrap:anywhere}
.dzh.l2{font-size:24px}
.dzh.l3{font-size:20px;line-height:1.5}
.dpy{margin-top:4px;font-size:16px;line-height:1.45;color:var(--ink2);overflow-wrap:anywhere}
.dpy.faint{font-family:var(--sans);font-size:12.5px;color:var(--ink3)}
.dact{display:flex;align-items:center;gap:10px;margin-top:8px}
button.dcopy{gap:6px}
button.dcopy .ic{width:16px;height:16px;color:var(--zhu-ink)}
.dvi{font-family:var(--serif);font-size:21px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.dalt{margin-top:16px;padding-top:2px;border-top:1px solid var(--rule)}
.dalt .dzh{font-size:22px}
.dalt .dzh.l3{font-size:18px}
.dnote{margin-top:16px;padding-top:2px;border-top:1px solid var(--rule)}
.dnote p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.dnone{margin:14px 0 0;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2)}
/* từ mới: hàng mục lục — chữ Hán son | pinyin + nghĩa + vì sao | loa | nút */
.dwh{margin-top:26px}
.dkw{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;grid-template-areas:"h m s b";align-items:center;gap:0 10px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--rule)}
.dkh{grid-area:h;min-width:0;font-size:30px;line-height:1.1;color:var(--zhu-ink);overflow-wrap:anywhere}
.dkh.l3{font-size:24px}
.dkh.l4{font-size:18px}
.dkh.l5{font-size:14px} /* 5 chữ trở lên: vẫn 1 dòng trong cột 76px */
.dkm{grid-area:m;min-width:0;display:flex;flex-direction:column;font-size:14px;line-height:1.4;color:var(--ink2)}
.dkm .py{font-size:16px;color:var(--ink)}
.dmean{color:var(--ink)}
.dmean i{font-style:normal;color:var(--ink3);font-size:12.5px}
.dkm small{margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--ink3)}
.dst{margin-top:3px;font-style:normal;font-size:12.5px;color:var(--ink3)}
.dst.ok{color:var(--green-ink)}
.dkw > .spk{grid-area:s}
button.dadd{grid-area:b;min-width:56px;padding:4px 10px;font-size:14px}
.dwnote{margin:12px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink3)}
.dwnote b{font-weight:500;color:var(--ink2)}
/* lịch sử: hàng gọn 1 dòng, bấm mở bản dịch */
.dhist{list-style:none;margin:0;padding:0}
.dhi{border-bottom:1px solid var(--rule)}
button.dhb{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"s i" "t i";align-items:center;gap:2px 10px;width:100%;min-height:60px;padding:10px 0;
  border:0;border-radius:0;background:none;text-align:left;color:var(--ink)}
button.dhb:hover{background:none}
.dhs{grid-area:s;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;line-height:1.4}
.dhs.zh{font-size:17px}
.dhb small{grid-area:t;font-size:12px;color:var(--ink3)}
.dhb .ic{grid-area:i;color:var(--ink3)}
.dho{padding:0 0 14px}
.dho .dzh{font-size:22px}
.dho .dzh.l3{font-size:18px}
.dho .dvi{font-size:18px}
.dhnote{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--ink3)}
/* nhập đoạn chat cũ */
.dimp .hl{font-size:36px}
.dimptx{min-height:160px}
.dsteps{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--ink2)}
.dconvq{display:block;width:100%;margin:16px 0 4px}
.dconv.off .it b{color:var(--ink2)}
.dstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule)}

.dstat > div + div{padding-left:12px;border-left:1px solid var(--rule)}

(function () {

  var BLOCKS = [["Thẻ", "Thẻ từ: từ mới + ôn", "词"], ["Nói & dịch", "Thẻ nói xen thẻ dịch câu", "说"], ["Nghe & đọc", "Nhại 1 bài khóa hoặc làm tiếp 1 phần đề", "读"]];
  var TALK_RELEARN_GAP = 3; // khúc 2: thẻ nói vừa Quên quay lại sau ~3 thẻ nói (xen thẻ dịch → ~6 thẻ)
  var HSK_ALL = [0, 1, 2, 3, 4, 5, 6]; // cấp HSK của từ mới (settings.hskLevels); 0 = ngoài HSK (khẩu ngữ)
  // Kiểm tra bài cũ đầu buổi (settings.warmup): số câu, 0 = tắt. Mặc định 8.
  var WARM_OPTIONS = [0, 5, 8, 10];

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var BASE_DECKS = Array.isArray(window.DECKS) ? window.DECKS.filter(function (d) { return d && d.id; }) : [];
  var DECKS = BASE_DECKS.slice(); // + deck ảo "Từ trong đề" khi có từ (xem rebuildItems)

  // ---------- tiện ích ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function fmtClock(sec) { return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60); }
  function dateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function fmtDate(key) { var p = String(key).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : key; }
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function byId(id) { return document.getElementById(id); }

  var toastTimer = null;
  // Icon SVG nét mảnh từ sprite #i-* (thay emoji). Tên: spk mic stop play pause rew ffw lock unlock check x arrow back chev-d chev-u chev-r
  // plus minus spark link bulb doc book chat voice pen ear warn star target retry clock flag gear chart down up swap map eye trash key
  function ico(name, cls) { return '<svg class="ic' + (cls ? " " + cls : "") + '" aria-hidden="true" focusable="false"><use href="#i-' + name + '"></use></svg>'; }
  // Chữ Hán đại diện cho mỗi chủ đề (thay emoji của bộ thẻ): Trang Học, chọn chủ đề, bản đồ, thống kê, thẻ học.
  var TOPIC_GLYPH = { "chao-hoi": "你", "an-uong": "吃", "di-lai": "车", "hoi-duong": "路", "mua-sam": "买", "khach-san": "住",
    "san-bay-du-lich": "机", "thoi-tiet-thoi-gian": "天", "tam-chuyen": "聊", "suc-khoe": "药", "dien-thoai-thanh-toan": "钱", "nha-cua-sinh-hoat": "家" };
  function topicGlyph(id) { return TOPIC_GLYPH[id] || "学"; }
  function deckGlyph(d) {
    if (!d) return "学";
    if (d.map && MAP_LV[d.map]) return topicGlyph(MAP_LV[d.map].topic.id);
    if (d.lesson) return "课";
    if (d.id === CUSTOM_DECK_ID) return "考";
    if (d.id === EXP_DECK_ID) return "扩";
    if (d.id === MSG_DECK_ID) return "信"; // [F4] Từ tin nhắn
    return topicGlyph(d.id);
  }
  function deckTitle(d) { return String((d && (d.title || d.id)) || "").replace(/\s*\u2728/g, ""); } // \u2728 = dấu lấp lánh của bộ AI soạn, không hiện
  // Đầu trang kiểu báo: con dấu 学 + 学中文, góc phải 1 dòng phụ (HTML đã escape).
  function mastHtml(meta) {
    return '<div class="mast"><span class="logo"><span class="seal" aria-hidden="true">学</span><span lang="zh-CN">学中文</span></span>' +
      (meta ? '<span class="mmeta">' + meta + '</span>' : "") + '</div>';
  }
  // Màn chờ tải (đề / bài / chủ đề / tình huống): con dấu thở nhẹ + nút quay lại.
  function loadingHtml(text, act, label) {
    return '<div class="wrap"><div class="loading"><span class="seal" aria-hidden="true">学</span><p class="muted">' + text + '</p>' +
      (act ? '<button class="small-btn" data-action="' + act + '">' + ico("back") + ' ' + label + '</button>' : "") + '</div></div>';
  }
  // Thanh tab dưới đáy (màn cấp 1): chữ Hán làm biểu tượng. Ẩn trong phiên 45 phút (html.insess) và ở màn sâu (thẻ, đề, bài, cấp, đóng vai).
  var TAB_OF = { home: "home", dich: "dich", map: "map", exams: "exams", lessons: "lessons", me: "me", stats: "me" };
  function tabBarHtml(cur) {
    var tabs = [["home", "学", "Học"]];
    tabs.push(["dich", "译", "Dịch"]); // [F4] tab Dịch tin nhắn
    if (MAP_INDEX.length) tabs.push(["map", "图", "Bản đồ"]);
    if (EXAM_INDEX.length) tabs.push(["exams", "考", "Luyện đề"]);
    if (LESSON_INDEX.length) tabs.push(["lessons", "书", "Giáo trình"]);
    tabs.push(["me", "我", "Tôi"]);
    return '<nav class="tabbar" aria-label="Chuyển mục">' + tabs.map(function (t) {
      var on = t[0] === cur;
      return '<button class="tab' + (on ? " on" : "") + '" data-action="' + t[0] + '"' + (on ? ' aria-current="page"' : "") + '>' +
        '<i aria-hidden="true">' + t[1] + '</i><span>' + t[2] + '</span></button>';
    }).join("") + '</nav>';
  }
  function addTabBar() {
    var cur = TAB_OF[view] || "";
    document.documentElement.classList.toggle("tabbed", !!cur && !session);
    if (cur) app.insertAdjacentHTML("beforeend", tabBarHtml(cur));
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2600);
  }

  // ---------- từ lưu từ đề thi (bộ "Từ trong đề", chữ đại diện 考) ----------
  var CUSTOM_KEY = "hoctrung.custom.v1";
  var CUSTOM_DECK_ID = "tu-de-thi";
  function normalizeCustom(arr) {
    var out = [], seen = {};
    (Array.isArray(arr) ? arr : []).forEach(function (w) {
      if (!w || typeof w !== "object" || !w.hanzi || seen[w.hanzi]) return;
      seen[w.hanzi] = true;
      out.push({ hanzi: String(w.hanzi), pinyin: String(w.pinyin || ""), hanviet: String(w.hanviet || ""), vi: String(w.vi || ""), from: String(w.from || "") });
    });
    return out;
  }
  function loadCustom() {
    try { return normalizeCustom(JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]")); } catch (e) { return []; }
  }
  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(CUSTOM)); return true; }
    catch (e) { toast("Không lưu được từ (trình duyệt chặn localStorage?)"); return false; }
  }
  var CUSTOM = loadCustom();
  function customHas(hanzi) { return CUSTOM.some(function (w) { return w.hanzi === hanzi; }); }
  function customDeck() {
    return {
      id: CUSTOM_DECK_ID, title: "Từ trong đề", emoji: "", phrases: [], // không emoji: chữ đại diện = 考 (deckGlyph)

        var m = /^(.*)#(\d+)$/.exec(w.from);
        return {
          hanzi: w.hanzi, pinyin: w.pinyin, hanviet: w.hanviet, meaning: w.vi, chiettu: "", examples: [],

      })

  // Giao diện: "dem" Đỏ thẫm (mặc định, tối), "giay" Giấy ngà (sáng), "system" theo máy. Cùng 1 giao diện tạp chí (<style id="ui">), chỉ khác bộ biến màu.
  // Bật đúng 1 khối <style id="theme-…"> bằng thuộc tính media (script trong <head> đã làm lần đầu, trước khi vẽ).

  // { n: số từ nhớ, total, pct (làm tròn xuống — so ≥ 80 đúng bằng so tỉ lệ thật) }

  function computeGrade(card, grade, now) {

  // ---------- luyện đề: điều hướng & chấm ----------
  function curRef() { return exam.flat[exam.pos]; }

  function curAns() { return exProg(exam.id).ans[curItem().n]; }
  function resetQuestionUi() { exam.showScript = false; exam.order = ""; exam.build = []; }
  function examGoPos(pos) {

  function examGoN(n, seek) {
    for (var k = 0; k < exam.flat.length; k++) {

    }
  }

  // Mốc giây đầu đoạn hội thoại của câu đang mở (it.t). Câu 36-45 đi theo cặp chung một đoạn nên
  // câu thứ hai không có t → lùi về câu gần nhất có t trong cùng phần.
  function itemAudioT() {
    if (!exam) return null;
    var p = exam.flat[exam.pos].p;
    for (var k = exam.pos; k >= 0 && exam.flat[k].p === p; k--) {
      var f = exam.flat[k], t = exam.parts[f.p].items[f.i].t;
      if (t != null && Number(t) >= 0) return Number(t);
    }
    return null;
  }

  function normSent(s) { return String(s == null ? "" : s).replace(/[\s，。！？、；：,.!?;:“”‘’"'（）()《》〈〉【】…—\-·~～]/g, ""); }
  // Viết 1: đáp án gốc đôi khi chấp nhận cả câu đảo ("Đáp án gốc cũng chấp nhận 对这个城市我很熟悉。").
  // Nhận: answer + mảng alt (nếu dữ liệu có) + câu chữ Hán đứng sau chữ "chấp nhận" trong explain,
  // nhưng chỉ khi câu đó dùng đúng y các mảnh đề cho (tránh nhận nhầm câu ví dụ khác).
  function buildAnswers(it) {
    var out = [normSent(it.answer)];
    var bag = function (s) { return normSent(s).split("").sort().join(""); };
    var want = bag((Array.isArray(it.words) ? it.words : []).join(""));
    var cands = Array.isArray(it.alt) ? it.alt.slice() : [];
    var ex = String(it.explain || ""), k = ex.search(/chấp nhận/i);
    if (k >= 0) cands = cands.concat(ex.slice(k).match(/[㐀-鿿0-9０-９A-Za-z，、“”]+[。！？]/g) || []);

    return out;

  function examLabels(e) {

  function audioCtlHtml() {

  // ---- nhập đoạn chat cũ: DICH.imp = { step: src | convs | ready | run | pick | done, … } ----

  // Chữ của 1 tin hiện trong khung chat: chỉ tin người dùng / ChatGPT gửi cho người đọc (content_type text / multimodal_text,

  // Đổi id thẻ câu "tu-tin-nhan:p|tp:<i>" của file về chỉ số câu ở máy này (gọi TRƯỚC khi gộp thẻ). → chuỗi tóm tắt cho toast.
  function dichImport(obj) {
    var had = msgAny(), mAdd = 0, wAdd = 0, pAdd = 0;
    if (Array.isArray(obj.msgs)) {
      var keys = {};
      MSGS.forEach(function (m) { keys[msgKey(m)] = true; });
      normalizeMsgs(obj.msgs).forEach(function (m) { if (!keys[msgKey(m)]) { keys[msgKey(m)] = true; MSGS.push(m); mAdd++; } });
      if (mAdd) { MSGS = normalizeMsgs(MSGS); saveMsgs(); }
    }
    var D = obj.msgDeck && typeof obj.msgDeck === "object" ? obj.msgDeck : null;
    if (D && Array.isArray(D.phrases)) {
      var pm = {};
      normalizeExpP(D.phrases).forEach(function (p, i) {
        var j = msgPIndex(p.zh);
        if (j < 0) { MSGD.phrases.push(p); j = MSGD.phrases.length - 1; pAdd++; }
        pm[i] = j;
      });
      if (obj.cards && typeof obj.cards === "object") {
        var rc = {};
        Object.keys(obj.cards).forEach(function (id) {
          var mm = /^tu-tin-nhan:(tp|p):(\d+)$/.exec(id);
          if (!mm) rc[id] = obj.cards[id];
          else if (pm[mm[2]] != null) rc[MSG_DECK_ID + ":" + mm[1] + ":" + pm[mm[2]]] = obj.cards[id];
        });
        obj.cards = rc;
      }
    }
    if (D && Array.isArray(D.words)) normalizeMsgW(D.words).forEach(function (w) { if (!msgWHas(w.hanzi)) { MSGD.words.push(w); wAdd++; } });
    var sk = D ? normalizeMsgSkip(D.skip) : {}, sAdd = 0; // từ đã Bỏ trong file: gộp (trừ từ đang học)
    Object.keys(sk).forEach(function (h) { if (!(h in MSGD.skip) && !msgWHas(h)) { MSGD.skip[h] = sk[h]; sAdd++; } });
    if (sAdd) MSGD.skip = normalizeMsgSkip(MSGD.skip);
    if (wAdd || pAdd) { saveMsgW(); dichDeckChanged(had); }
    else if (sAdd) saveMsgW();
    var out = [];
    if (mAdd) out.push("+" + mAdd + " tin nhắn");
    if (wAdd) out.push("+" + wAdd + " từ tin nhắn");
    if (pAdd) out.push("+" + pAdd + " câu tin nhắn");
    return out.join(", ");
  }

  // Cỡ ô theo số ký tự (--n): 1–2 chữ ô 150px, từ dài thu nhỏ để vẫn nằm trên một hàng ở điện thoại.

  // Hết bài: dấu son 完 + 3 số liệu serif kẻ dọc (lượt · thẻ · phút).

  // Mỗi lựa chọn = 1 hàng mục lục (chữ Hán son · tiêu đề serif + dòng phụ · mũi tên).

  // Dòng dưới thanh phiên: tên khúc (serif nghiêng) + số đếm ngắn.
  function updateCounts() {
    var el = byId("counts");
    if (!el || !session) return;
    var lab, txt;
    if (session.cram) { // ôn dồn: vạch tiến độ theo số thẻ còn lại (không theo 45 phút)
      var left = cramLeft(), prog = byId("prog");
      if (prog) prog.style.width = Math.round(100 * (1 - left / Math.max(session.cram.total, left, 1))) + "%";
      lab = "Ôn dồn";
      txt = session.cram.n + " từ cứng đầu · đã làm " + session.doneCount + " · còn " + left;
    } else if (warmActive()) {
      var w = session.warm;
      lab = "Bài cũ";
      txt = w.phase === "sum" ? "xong" : "câu " + (w.i + 1) + "/" + w.qs.length + (w.graded ? " · đúng " + w.ok + "/" + w.graded : "");
    } else if (session.blocks && session.block > 0) {
      var nl = Object.keys(session.lines || {}).length;
      lab = BLOCKS[session.block][0];
      txt = session.block === 1
        ? [session.talk.length ? "nói " + session.talk.length : "", "dịch " + session.transShown, session.sentN ? "đặt " + session.sentN : "", session.hearShown ? "nghe " + session.hearShown : ""].filter(Boolean).join(" · ") // gọn cho màn 360px: không cắt mất "nghe" / "đặt"
        : "đã làm " + Object.keys(session.touched).length + " thẻ" + (nl ? " · " + nl + " câu nhại/đề" : "");
    } else {
      var due = 0, fresh = 0;
      session.queue.forEach(function (it) { if (isNewItem(it)) fresh++; else due++; });
      lab = BLOCKS[0][0];
      txt = "đã làm " + session.doneCount + " · còn ôn " + due + " · mới " + fresh + (session.sentN ? " · đặt " + session.sentN + " câu" : "");
    }
    el.innerHTML = '<em>' + esc(lab) + '</em><span>' + esc(txt) + '</span>';
  }
  // Cuộn vừa đủ để el nằm trên thanh nút dính đáy (scroll-padding-bottom chừa chỗ dock); đã thấy thì thôi.
  function revealAboveDock(el) {
    var dk = document.querySelector("#cardArea .dock");
    if (dk && el && el.getBoundingClientRect().bottom > dockTop(dk)) { try { el.scrollIntoView({ block: "nearest" }); } catch (e) { /* bỏ qua */ } }

  function renderCard() {
    var area = byId("cardArea");
    if (!area || !session) return;
    var snap = session.keepPad ? snapshotPad() : null;
    PAD.drawing = false; PAD.pointerId = null; PAD.canvas = null;
    var it = session.current;
    var html;
    if (warmActive()) html = warmHtml(); // kiểm tra bài cũ đầu buổi (trước khúc 1)
    else if (!it) {
      syncElapsed();
      if (session.cram) html = cramDoneHtml();
      else if (session.blocks) html = session.gate != null ? gateHtml() : readHtml();
      else html = session.elapsed >= TARGET_SEC || capReached() ? doneHtml() : emptyHtml();
    } else {
      var mode = modeOf(it);
      html = mode === "new" ? newWordHtml(it)
        : mode === "recog" ? recogHtml(it)
        : mode === "recall" ? recallHtml(it)
        : mode === "listen" ? lsWordHtml(it)
        : mode === "hear" ? hearHtml(it)
        : mode === "trans" ? transHtml(it)
        : mode === "sent" ? sentHtml(it)

      if (it.kind === "word" && mode !== "new") mnemoKick(it); // từ cứng đầu: nhờ AI soạn mẹo nhớ sẵn (1 lần / chữ, hiện ở mặt sau)
    }

    var pad = byId("pad");

    var ti = byId("trInput") || byId("wuInput") || byId("rcSen");
    var low = window.matchMedia && window.matchMedia("(max-height:500px)").matches;
    if (!session.keepPad) {
      window.scrollTo(0, 0);
      // Màn ngang (thấp): ô gõ (bài cũ: cả nút Nói ngay dưới) thường nằm dưới thanh nút dính đáy → cuộn vừa đủ để thấy.
      if (low) revealAboveDock(byId("wvbox") || ti || byId("rcVi"));
    }
    // Màn ngang: đáp án (nghĩa ở thẻ Từ mới / mặt sau Nhận mặt chữ; chữ + pinyin ở mặt sau Nghĩa → chữ) nằm dưới dock → cuộn vừa đủ.
    if (low && (session.flipped || !session.keepPad)) {
      revealAboveDock(document.querySelector("#cardArea .meaning:not(.front)") || (session.flipped ? document.querySelector("#cardArea .hanzi + .pyrow") : null));
    }
    // Thẻ dịch trên máy có chuột: con trỏ vào ô gõ luôn (điện thoại thì không — để chọn gõ hay viết tay).
    if (ti && !ti.readOnly && window.matchMedia && window.matchMedia("(pointer: fine)").matches) {
      try { ti.focus({ preventScroll: true }); var L = ti.value.length; ti.setSelectionRange(L, L); } catch (e) { /* bỏ qua */ }
    }
    if (warmActive()) { warmAutoSpeak(); return; }
    autoSpeak(it);

  }
  function autoSpeak(it) {
    if (!it) return;
    var mode = modeOf(it);
    if ((mode === "listen" || mode === "hear") && !session.flipped) { // thẻ Nghe: mặt trước luôn tự đọc (đề là tiếng), có dò bị chặn
      var lk = it.id + ":front";
      if (session.spokenFor !== lk) { session.spokenFor = lk; lsSay(lsText(it), LS_RATE, true); }
      return;
    }
    if (!db.settings.autoSpeak) return;
    var shouldSpeak = mode === "new" || session.flipped;
    if (!shouldSpeak) return;
    var key = it.id + ":" + (session.flipped ? "back" : "front");
