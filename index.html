button.spk.sm{min-height:34px;min-width:34px;font-size:15px;padding:2px 8px;vertical-align:middle}
/* nút loa nhỏ nằm trong dòng chữ: nhìn 34px nhưng vùng chạm mở rộng ra 44px */
button.spk.sm{position:relative}
button.spk.sm::before{content:"";position:absolute;inset:-5px}
button.small-btn{min-height:44px;padding:6px 14px;font-size:15px;border-radius:10px}
/* nút nhỏ "đang bật"/gợi ý (Mở, Pinyin, Dịch, Dừng đọc): đỏ nhạt, không tô đặc */
button.small-btn.primary{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent-soft-line);box-shadow:0 1px 0 rgba(140,27,20,.12)}
button.small-btn.primary:hover{background:var(--accent-soft-h);border-color:var(--accent);color:var(--accent-soft-ink)}
select,input[type=file]{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
select:hover{border-color:var(--gold)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
input[type=range]{accent-color:var(--accent)}

/* ---------- khối ---------- */
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row-between h2{margin:0}
.box > .row-between:first-child{margin-bottom:8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 6px 12px;text-align:center;box-shadow:var(--shadow);overflow:hidden}
.stat::before{content:"";position:absolute;left:50%;top:0;width:28px;height:3px;margin-left:-14px;background:var(--accent);border-radius:0 0 3px 3px}
.stat b{display:block;font-family:var(--serif);font-size:32px;line-height:1.1;color:var(--accent-ink);font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.decks{list-style:none;margin:0;padding:0}
.decks li{border-top:1px dashed var(--border)}
.decks li:first-child{border-top:none}
.decks label{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;border-radius:8px}
.decks label:hover{background:var(--hover-tint)}
.decks .emoji{font-size:24px;width:32px;text-align:center;flex:none}
.decks input[type=checkbox]{margin:0}
.decks .dtitle{flex:1;font-weight:600}
.decks .counts{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.setting{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--border);min-height:52px}
.setting:first-of-type{border-top:none}
.setting span{flex:1}
.actions-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.actions-row button{padding:12px 6px;font-size:15px}

/* ---------- thanh đầu màn (phiên học / màn đề): khối đỏ son duy nhất của màn ---------- */
.bar{position:sticky;top:0;z-index:5;margin:-16px -16px 14px;padding:10px 16px 10px;color:var(--bar-ink);
  background:linear-gradient(180deg,var(--bar-top),var(--bar-bot));border-radius:0 0 14px 14px;
  box-shadow:inset 0 -1px 0 rgba(255,214,190,.18),0 10px 20px -14px rgba(90,15,10,.7)}
.bar.nostick{position:static}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar-top b{font-family:var(--serif);font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bar-ink)}
.clock{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-size:24px;font-weight:700;color:var(--bar-ink);letter-spacing:.01em}
.track{height:8px;background:rgba(255,240,228,.22);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#E2B04A,#FFE39A);border-radius:999px;box-shadow:0 0 8px rgba(255,214,110,.5);transition:width .5s linear}
.bar .muted{color:var(--bar-muted)}
/* nút trong thanh đỏ: trong suốt, viền trắng mờ */
.bar button{background:transparent;color:var(--bar-ink);border-color:var(--bar-line);box-shadow:none}
.bar button:hover{background:rgba(255,240,228,.14);border-color:rgba(255,240,228,.8)}
.banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold-ink);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:700;text-align:center}
/* điện thoại: banner 45 phút gọn 1 dòng, thanh đỏ không phình */
@media (max-width:600px){.banner{font-size:14px;padding:4px 10px;margin-top:6px;line-height:1.35}}
/* khổ ngang thấp (điện thoại xoay ngang): thanh audio phần Nghe gộp 1 hàng (bỏ tên đề, giữ nút Danh sách đề) */
@media (max-height:500px){.bar{padding:6px 16px 4px;margin-bottom:8px}.bar.exbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.bar.exbar .bar-top b{display:none}.bar.exbar .audio-ctl{flex:1;margin-top:0}.bar.exbar .audio-ctl input[type=range]{min-width:70px}}

/* ---------- thẻ học ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px 14px;
  box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--gold-ring),var(--shadow);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-weight:600;white-space:nowrap}
.tag.new,.tag.on{background:var(--green-soft);border-color:var(--green-line);color:var(--green-ink)}
.tag.recog{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}
.tag.recall{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange-ink)}
.tag.phrase,.tag.ai{background:var(--plum-soft);border-color:var(--plum-line);color:var(--plum-ink)}
/* số câu trong màn đề: đỏ son nhạt (hợp tông, không dùng xanh của "Nhận mặt chữ") */
.tag.qn{background:var(--accent-soft);border-color:var(--accent-soft-line);color:var(--accent-soft-ink)}
/* nhãn cảnh báo của đề (thiếu đáp án / thiếu audio): hổ phách */
.tag.warn-tag{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange-ink);white-space:normal}
/* chữ Hán to: font Khải (楷) cho rõ nét viết, màu mực; ô 田 vàng kim nét đứt rất mờ phía sau (cả từ, không đóng khung từng chữ) */
.hanzi{font-size:clamp(68px,18vw,112px);line-height:1.15;text-align:center;margin:10px 0 4px;letter-spacing:.04em;color:var(--zh-ink)}
.zh.hanzi,.hanzi{font-family:var(--kai);font-weight:400;font-synthesis:none}
.hanzi:not(.mid){letter-spacing:0;margin:12px auto 6px}
/* mỗi chữ một ô 田: khung nét đứt + chữ thập qua tâm chữ (như vở tập viết) */
.hanzi .tz{display:inline-block;width:1.08em;height:1.08em;line-height:1.08em;margin:0 .02em;vertical-align:top;text-align:center;
  border:1px dashed var(--tian);border-radius:3px;
  background-image:repeating-linear-gradient(90deg,var(--tian) 0 5px,transparent 5px 10px),repeating-linear-gradient(180deg,var(--tian) 0 5px,transparent 5px 10px);
  background-size:100% 1px,1px 100%;background-position:center,center;background-repeat:no-repeat}
.hanzi.mid{font-size:clamp(36px,9vw,52px);line-height:1.3}
.hanzi.long{font-size:clamp(40px,10vw,80px)}
/* xoay ngang (màn thấp): chữ Hán theo chiều cao màn, thanh đồng hồ phiên học không dính để chừa chỗ cho thẻ */
@media (max-height:500px){.hanzi{font-size:clamp(56px,20vh,88px)}.hanzi.long{font-size:clamp(40px,13vh,64px)}.bar:not(.exbar){position:static}}
.pinyin{text-align:center;font-size:24px;color:var(--pinyin);margin-top:6px;font-weight:500;letter-spacing:.02em}
.hanviet{text-align:center;color:var(--muted);margin-top:4px}
.hanviet b{color:var(--text);font-family:var(--serif);letter-spacing:.04em}
.meaning{text-align:center;font-size:24px;font-weight:700;margin:10px 0 4px}
.meaning.front{font-family:var(--serif);font-size:30px;margin:28px 0 8px}
.pos{text-align:center;color:var(--muted);margin-bottom:8px;font-style:italic}
.chiettu{background:var(--green-soft);border:1px solid var(--green-line);border-left:4px solid var(--green);border-radius:10px;padding:10px 12px;margin:14px 0}
.chiettu .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--green-ink);margin-bottom:4px;font-weight:800}
.examples{margin-top:12px}
.ex{border-top:1px dashed var(--line);padding:10px 0}
.ex-zh{font-size:22px}
.zh.ex-zh{font-family:var(--kai)}
.ex-py{color:var(--pinyin);font-size:15px}
.ex-vi{color:var(--muted);font-size:15px}
.note{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.when{text-align:center;color:var(--muted);font-style:italic;margin-top:14px}
.actions{margin-top:16px}
/* nút chấm: tô nhạt + gạch màu trên đầu — khác hẳn nút chính đỏ son tô đặc */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades.two{grid-template-columns:repeat(2,1fr)}
.grades button{min-height:64px;font-weight:800;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-width:1px;border-top-width:4px}
.grades small{font-weight:600;font-size:12px;color:var(--muted)}
/* điện thoại (dọc lẫn xoay ngang): hàng nút Lật / Đã hiểu / chấm điểm dính đáy màn hình, khỏi phải cuộn (-16px = padding ngang của .card) */
@media (max-width:600px),(max-height:500px){.dock{position:sticky;bottom:0;z-index:4;background:var(--card);margin:16px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);box-shadow:0 -8px 14px -10px rgba(var(--sh),.3)} .hint{display:none}
  .card{box-shadow:var(--shadow);border-top:3px solid var(--accent)}
  html:has(.dock){scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
/* màn ngang: dock mỏng hơn để ô gõ / kết quả AI không nằm sau dock */
@media (max-height:500px) and (min-width:601px){.dock{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom));margin-top:10px}
  .dock button.primary.big{min-height:46px} .grades.dock button{min-height:52px}}
.g1{background:var(--red-soft);border-color:var(--red-line);border-top-color:var(--red);color:var(--red-ink)}
.g2{background:var(--orange-soft);border-color:var(--orange-line);border-top-color:var(--orange);color:var(--orange-ink)}
.g3{background:var(--green-soft);border-color:var(--green-line);border-top-color:var(--green);color:var(--green-ink)}
.g4{background:var(--blue-soft);border-color:var(--blue-line);border-top-color:var(--blue);color:var(--blue-ink)}
.g1 small{color:var(--red-ink)}.g2 small{color:var(--orange-ink)}.g3 small{color:var(--green-ink)}.g4 small{color:var(--blue-ink)}
.g1:hover{background:var(--red-h);border-color:var(--red)}
.g2:hover{background:var(--orange-h);border-color:var(--orange)}
.g3:hover{background:var(--green-h);border-color:var(--green)}
.g4:hover{background:var(--blue-h);border-color:var(--blue)}
.hint{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
/* bảng viết tay: canvas vẽ trắng — multiply cho hòa vào giấy ngà, khung đỏ son */
.pad-wrap{text-align:center;margin:12px 0 4px}
.pad{display:block;margin:0 auto 10px;width:240px;height:240px;max-width:100%;border-radius:4px;background:#fff;touch-action:none;cursor:crosshair;
  mix-blend-mode:var(--pad-blend);filter:var(--pad-filter);border:2px solid var(--pad-frame);box-shadow:0 0 0 4px var(--pad-gap),0 0 0 5px var(--pad-ring)}
.big-emoji{font-size:64px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px dashed var(--border)}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
tbody tr:last-child th{border-top:1px solid var(--line);border-bottom:none;color:var(--accent-ink)}
tbody tr:hover td{background:var(--hover-tint)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:11px 16px 11px 14px;border-radius:10px;font-size:15px;z-index:20;width:max-content;max-width:min(90vw,520px);
  border:1px solid var(--toast-line);border-left:4px solid var(--toast-bar);box-shadow:0 10px 26px -6px rgba(40,15,8,.5);animation:toastIn .22s ease-out}
/* điện thoại: toast nổi trên hàng nút dính đáy, không che nút Lật / chấm điểm */
@media (max-width:600px),(max-height:500px){body:has(.dock) #toast{bottom:calc(100px + env(safe-area-inset-bottom))}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.warn{background:var(--red-soft);border:1px solid var(--red-line);border-left:4px solid var(--red);border-radius:var(--radius);padding:16px}

/* ---------- luyện đề ---------- */
.pad.wide{width:100%;max-width:640px;height:auto}
.exlist{list-style:none;margin:0;padding:0}
.exlist li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px dashed var(--border)}
.exlist li:first-child{border-top:none}
.exlist li[data-action]:hover{background:var(--hover-tint)}
.exlist .info{flex:1;min-width:0}
.exlist .etitle{font-weight:700}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;margin-bottom:2px}
.audio-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.audio-ctl button{min-height:44px;min-width:44px;padding:4px 10px;font-size:15px}
.audio-ctl button.on{background:var(--bar-ink);border-color:var(--bar-ink);color:#8C1B14;font-weight:700}
.audio-ctl #auToggle{min-width:48px;font-size:17px;background:rgba(255,240,228,.16);border-color:rgba(255,240,228,.75)}
.audio-ctl input[type=range]{flex:1;min-width:120px;height:44px;margin:0;accent-color:#F2C264}
.audio-ctl .time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--bar-muted)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ptabs button{min-height:44px;padding:4px 14px;font-size:15px;white-space:nowrap;flex:none;border-radius:999px}
/* tab đang chọn: đỏ nhạt viền son (không tô đặc — màn đề đã có thanh đỏ và nút Sau đỏ) */
.ptabs button.on{background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent-soft-ink);font-weight:800;box-shadow:inset 0 -2px 0 var(--accent)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:14px}
.qgrid button{min-height:44px;padding:2px;font-size:14px;border-radius:8px;font-variant-numeric:tabular-nums}
.qgrid button.ok{background:var(--green-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
.qgrid button.bad{background:var(--red-soft);border-color:var(--red);color:var(--red-ink);font-weight:700}
.qgrid button.done{background:var(--card2);border-color:var(--muted)}
.qgrid button.cur{outline:3px solid var(--gold);outline-offset:1px;font-weight:800}
.opts{display:grid;gap:8px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:52px;width:100%}
.opt b{flex:none;width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;
  background:var(--card2);border:1px solid var(--line);color:var(--accent-ink);margin-top:1px}
.opt .ovi{display:block;color:var(--muted);font-size:14px}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green-ink);box-shadow:inset 0 0 0 1px var(--green)}
.opt.right b{background:var(--green);border-color:var(--green);color:var(--on-status)}
.opt.right .ovi{color:var(--green-ink)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red-ink);box-shadow:inset 0 0 0 1px var(--red)}
.opt.wrong b{background:var(--red);border-color:var(--red);color:var(--on-status)}
.opt.wrong .ovi{color:var(--red-ink)}
/* dấu ✓ / ✕ bên phải: không phải chỉ dựa vào màu để biết đúng sai */
.opt.right::after,.opt.wrong::after{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:900;font-size:17px;line-height:1}
.opt.right::after{content:"✓";color:var(--green)}
.opt.wrong::after{content:"✕";color:var(--red)}
.opts:not(.two):not(.cloze) .opt.right,.opts:not(.two):not(.cloze) .opt.wrong{padding-right:36px}
.opt.dim{opacity:.7}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
/* nút xếp câu (Đọc 2): chữ cái to giữa nút; đã chọn thì mờ hẳn + viền đứt để khác rõ nút còn chọn được */
.opt.ord{justify-content:center;align-items:center}
.opt.ord b{width:34px;height:34px;font-size:19px;border-radius:8px;margin:0;background:var(--accent-soft);border-color:var(--accent-soft-line);color:var(--accent-soft-ink)}
.opt.ord.dim{opacity:.4;border-style:dashed;box-shadow:none}
.opts.two .opt{justify-content:center;text-align:center;font-weight:700}
.opts.cloze{grid-template-columns:repeat(3,1fr)}
.opts.cloze .opt{padding:12px 8px;gap:6px;align-items:center}
.opts.cloze .opt b{width:24px}
.opts.cloze .opt .zh{white-space:nowrap}
/* ô chọn từ (cloze) và Đúng/Sai (nhãn đã có √ ×): bỏ dấu để khỏi rối */
.opts.cloze .opt.right::after,.opts.cloze .opt.wrong::after,.opts.two .opt.right::after,.opts.two .opt.wrong::after{content:none}
.qtext{font-size:22px;margin:8px 0}
.qtext b[style]{color:var(--green-ink) !important;background:var(--green-soft);border-radius:4px}
.passage{font-size:19px;line-height:1.75;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0}
.script{background:var(--card2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:18px;line-height:1.6}
.script .vi,.vi-line{color:var(--muted);font-size:15px;margin-top:4px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0;font-size:18px}
.bank div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.bank div b{color:var(--accent-ink)}
.bank div.used{opacity:.5;text-decoration:line-through}
.seg{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:18px}
.seg b{flex:none;color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:1px dashed var(--line);border-radius:10px;margin:8px 0}
.chips button{min-height:44px;padding:6px 12px;font-size:20px}
.chips button.used{opacity:.3}
.chips.ans{border-color:var(--accent);background:var(--accent-soft)}
.seq{font-size:24px;letter-spacing:.04em;word-spacing:.12em;text-align:center;margin:8px 0;font-weight:700;color:var(--accent-ink)}
textarea{width:100%;min-height:80px;font:inherit;font-size:20px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;
  box-shadow:inset 0 1px 3px rgba(var(--sh),.08)}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(179,38,30,.18)}
textarea::placeholder{color:var(--placeholder)}
/* gợi ý tiếng Việt nằm trong ô chữ Hán (ô gõ câu, hàng ghép mảnh): chữ Việt → BeVN, không để WenKai */
textarea::placeholder,.chips .muted{font-family:var(--sans)}
.result{border-radius:10px;padding:10px 12px;margin-top:14px;font-weight:700}
.result.ok{background:var(--green-soft);border:1px solid var(--green);border-left-width:4px;color:var(--green-ink)}
.result.bad{background:var(--red-soft);border:1px solid var(--red);border-left-width:4px;color:var(--red-ink)}
.result.na{background:var(--card2);border:1px solid var(--border);border-left-width:4px}
.result small{font-weight:400;color:var(--muted)}
.vocab{margin-top:14px}
.vrow{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding:8px 0;flex-wrap:wrap}
.vrow .vh{font-size:24px;color:var(--zh-ink)}
.zh.vh{font-family:var(--kai)}
.vrow .vt{flex:1;min-width:110px;font-size:15px}
.vrow .small-btn{flex:none}
.vrow .vt .py{color:var(--pinyin)}
/* màn hẹp: chữ Hán + loa + nút "+ Ôn" một hàng; pinyin, Hán Việt, nghĩa xuống hàng dưới */
@media (max-width:480px){.vrow .vt{order:3;flex:1 1 100%;min-width:0}.vrow .small-btn{margin-left:auto}}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* câu đang có nút chính riêng (Kiểm tra, Xem câu mẫu): nút Sau → chỉ viền đỏ, để màn chỉ có một nút đỏ đặc */
.wrap:has(.card button.primary:not(.small-btn)) > .navrow button.primary{background:var(--outline-bg);color:var(--outline-ink);border:1.5px solid var(--outline-line);box-shadow:0 2px 0 rgba(140,27,20,.18)}
.wrap:has(.card button.primary:not(.small-btn)) > .navrow button.primary:hover{background:var(--accent-soft-h)}

/* ---------- giáo trình ---------- */
.decks li.lsdeck{display:flex;align-items:center;gap:12px}
.decks li.lsdeck label{flex:1;min-width:0}
.decks li.lsdeck button.link{flex:none;min-width:44px;min-height:44px;padding:0 10px;border-left:1px solid var(--border);border-radius:0}
/* màn hẹp: số đếm xuống dòng dưới tên (78px = checkbox 22 + gap 12 + emoji 32 + gap 12) để tên không bị ép thành cột */
@media (max-width:480px){
  .decks label{flex-wrap:wrap;row-gap:2px}
  .decks .dtitle{flex:1 1 0;min-width:0}
  .decks .counts{flex-basis:100%;text-align:left;padding-left:78px}
}
.lshead{text-align:center;margin:10px 0 4px}
.lshead .em{font-size:44px}
.lshead .tzh{font-size:34px;font-weight:400;margin:2px 0;color:var(--zh-ink)}
.lshead .zh.tzh{font-family:var(--kai)}
.goals{margin:8px 0 0;padding-left:20px;font-size:15px;color:var(--muted)}
.goals li::marker{color:var(--accent)}
button.lstoggle{width:100%;min-height:58px;font-size:18px;font-weight:700;margin:12px 0 10px}
button.lstoggle.on{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.wrow{border-top:1px dashed var(--line);padding:10px 6px;cursor:pointer}
.wrow:first-child{border-top:none}
.wrow:hover{background:var(--hover-tint)}
.wrow .wtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrow .wh{font-size:32px;line-height:1.2;color:var(--zh-ink)}
.zh.wh{font-family:var(--kai)}
.wrow .wt{flex:1;min-width:150px;font-size:15px}
.wrow .wt .py{color:var(--pinyin);font-size:17px}
.wrow .wt .mn{color:var(--text);font-weight:700}
.wrow.open{background:var(--gold-soft);border-radius:10px;border-top-color:transparent;box-shadow:inset 3px 0 0 var(--gold)}
.wrow.open + .wrow{border-top-color:transparent}
.wmore{cursor:auto;margin-top:6px}
.gp{border-top:1px dashed var(--line);padding:16px 0}
.gp:first-child{border-top:none;padding-top:0}
.gp .gpt{font-size:26px;font-weight:700;color:var(--zh-ink)}
.gp .zh.gpt{font-family:var(--kai)}
.gp .gpn{color:var(--muted);margin-bottom:8px}
.struct{background:var(--accent-soft);border:1px solid var(--accent-soft-line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:19px;font-weight:700;color:var(--accent-soft-ink)}
.mistake{background:var(--orange-soft);border:1px solid var(--orange-line);border-left:4px solid var(--orange);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.mistake b{color:var(--orange-ink)}
.tline{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-top:1px dashed var(--border);border-radius:8px}
.tline:first-child{border-top:none}
.tline.reading{background:var(--gold-soft);outline:1px solid var(--gold)}
/* người nói: con dấu đỏ nhỏ */
.tline .spkr{flex:none;font-weight:700;color:var(--seal-ink);background:var(--seal-bg);min-width:30px;font-size:15px;line-height:1.2;padding:4px 5px;margin-top:4px;
  text-align:center;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--seal-bg),inset 0 0 0 2.5px rgba(255,236,214,.7)}
.tline .zh.spkr{font-family:var(--kai)}
.tline .tb{flex:1;min-width:0}
.tline .tzh{font-size:23px;line-height:1.5}
.tline .zh.tzh{font-family:var(--kai)}
.qz{border-top:1px dashed var(--line);padding:12px 0}
.qz:first-child{border-top:none;padding-top:0}
.qz .qtext .tag{vertical-align:middle;font-family:var(--sans)}
.ptabs.lstabs{overflow-x:visible;position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px}
.ptabs.lstabs button{flex:1 1 0;min-width:0;padding:4px 2px}
@media (max-width:400px){.ptabs.lstabs button{font-size:14px}}
/* trần ôn: dòng nhỏ dưới số "đến hạn" (phần dư để mấy hôm tới) */
.stat .smore{margin-top:3px;padding:0 4px;font-size:12px;line-height:1.3;color:var(--muted)}
/* giáo trình: nút "Hiện cấp khác" cuối hàng tab cấp — viên viền đứt nét màu mực nhạt */
button.lvmore{min-height:44px;padding:4px 14px;border-radius:999px;white-space:nowrap;background:transparent;border:1.5px dashed var(--line);box-shadow:none;color:var(--muted);font-size:14px;font-weight:600}
.lvrow{display:flex;justify-content:flex-end;margin:-2px 0 8px}
button.lvmore:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--hover-bg)}
/* thống kê: lượt ôn mỗi ngày — thanh son trên nền giấy, ngày chạm trần tô vàng kim */
.rvtable td{padding:7px 6px}
.rvtable td.rvcell{width:58%}
.rvbar{display:block;height:8px;border-radius:4px;background:var(--card2);border:1px solid var(--border);overflow:hidden}
.rvbar i{display:block;height:100%;background:var(--accent)}
.rvbar i.full{background:var(--gold)}
.capdone{max-width:32em;margin:4px auto 0}
/* ---------- nói: thẻ nói + nhại bài khóa — nút mic viền son trên nền giấy, đang ghi = son đặc + chấm đỏ nhấp nháy ---------- */
.say{text-align:center;margin:12px 0 4px;font-size:15px;font-weight:700;color:var(--accent-ink)}
.vbox{margin-top:10px;text-align:center}
.vbox.back{margin-top:4px}
.vctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:10px}
button.mic{min-height:52px;min-width:170px;padding:8px 20px;border-radius:14px;font-size:17px;font-weight:700;
  background:var(--outline-bg);color:var(--outline-ink);border:1.5px solid var(--outline-line);box-shadow:0 2px 0 rgba(140,27,20,.18)}
button.mic:hover{background:var(--accent-soft-h);border-color:var(--accent)}
button.mic.sm{min-height:44px;min-width:0;padding:6px 14px;font-size:15px;border-radius:10px}
button.mic.on{background:linear-gradient(180deg,var(--btn-top) 0%,var(--btn-mid) 55%,var(--btn-bot) 100%);border-color:var(--btn-line);color:var(--btn-ink);box-shadow:0 2px 0 var(--accent-dark)}
button.mic.wait{opacity:.7;border-style:dashed;box-shadow:none}
.vtime{display:inline-block;margin-left:6px;font-variant-numeric:tabular-nums;font-weight:600}
button.spk.vref{font-size:15px;padding:6px 14px;min-height:44px;font-weight:600}
button.small-btn.vplay{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.vstat{margin-top:10px;font-size:14px;line-height:1.45;color:var(--muted)}
.vstat.warn{color:var(--orange-ink)}
.vstat.live{color:var(--accent-ink);font-weight:600}
.vdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:0;animation:micBlink 1s steps(2,start) infinite}
@keyframes micBlink{to{visibility:hidden}}
.vcmp{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--card2)}
.vheard{font-size:14px;color:var(--muted)}
.vheard .zh{font-family:var(--kai);font-size:20px;color:var(--zh-ink);margin-left:4px}
.vpct{margin-top:4px;font-size:15px;font-weight:800}
.vpct.good{color:var(--green-ink)}
.vpct.mid{color:var(--orange-ink)}
.vpct.low{color:var(--red-ink)}
.vok{color:var(--green)}
.vmiss{color:var(--red);background:var(--red-soft);border-radius:4px;text-decoration:underline wavy var(--red-line);text-underline-offset:.18em}
.vzh{margin-top:10px;font-size:22px;line-height:1.5;font-family:var(--kai)}
.vnext{margin-top:12px;display:flex;justify-content:flex-end}
/* ---------- thẻ Dịch câu (Việt → Trung): ô gõ giấy viền mực, chip từ khóa vàng kim nét đứt, nhãn đậm ---------- */
.tag.trans{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.meaning.front.trvi{font-size:25px;line-height:1.4;margin:22px 0 6px}
.trkeys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0 4px}
.trklab{width:100%;text-align:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-ink)}
.trk{display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border-radius:8px;border:1px dashed var(--gold);background:var(--gold-soft);font-size:14px;line-height:1.5;font-weight:600;color:var(--text)}
.trk b{font-family:var(--kai);font-weight:400;font-size:20px;color:var(--accent-ink)}
.trkeys button.trhint{min-height:44px;padding:4px 12px;font-size:14px;font-weight:700}
.trform{margin:14px 0 4px}
.trin{display:block;width:100%;min-height:54px;font-family:var(--kai);font-size:24px;line-height:1.3;color:var(--text);background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:inset 0 1px 3px rgba(var(--sh),.08)}
.trin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(179,38,30,.18)}
.trin::placeholder{font-family:var(--sans);font-size:15px;color:var(--placeholder)}
.trres{text-align:left;margin-top:14px}
.trrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:4px 0}
.trlab{flex:none;width:5.8em;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.trzh{flex:1;min-width:0;font-family:var(--kai);font-size:24px;line-height:1.45;color:var(--zh-ink);word-break:break-all}
.trpy{color:var(--pinyin);font-size:15px;margin-top:2px}
.trnote{margin-top:8px;font-size:13.5px;line-height:1.45;font-style:italic;color:var(--muted)}
@media (max-width:400px){.trlab{width:100%}}
/* nhại bài khóa */
.shbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px;padding:8px 0 10px;border-bottom:1px dashed var(--line)}
.shbar .muted{flex:1;min-width:12em}
.tline.shpick{cursor:pointer;opacity:.7}
.tline.shpick:hover{opacity:1;background:var(--hover-bg)}
.tline.shcur{background:var(--gold-soft);outline:1.5px solid var(--gold)}
.tline{scroll-margin-top:66px}html.insess .tline{scroll-margin-top:0}
.vbox.shctl{text-align:left;margin-top:8px}
.vbox.shctl .vctl{justify-content:flex-start;gap:8px}
.vbox.shctl .vstat,.vbox.shctl .vcmp{text-align:left}
.setting .snote{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--muted);font-weight:400}
@media (max-width:400px){button.mic{min-width:0;width:100%}.vctl button.mic.sm{width:auto}}
/* ---------- phiên chia 3 khúc: 3 đoạn thanh vàng kim trên dải đỏ son, nhãn đậm; khúc đang học sáng + viền vàng ---------- */
.blks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 6px}
.blk{min-width:0;display:flex;flex-direction:column;gap:3px}
.blk .bl{font-size:12.5px;line-height:1.6;font-weight:700;color:var(--bar-muted);opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bt{display:block;height:8px;border-radius:999px;background:rgba(255,240,228,.22);overflow:hidden}
.blk .bf{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#E2B04A,#FFE39A);transition:width .5s linear}
.blk.done .bl{opacity:1}
.blk.done .bl::before{content:"✓ "}
.blk.done .bf{background:rgba(255,240,228,.55)}
.blk.on .bl{opacity:1;color:var(--bar-ink);font-weight:800}
.blk.on .bt{box-shadow:0 0 0 1.5px rgba(255,227,154,.85)}
.blk.next .bl{opacity:1;color:#FFE39A;animation:blkBlink 1.2s ease-in-out infinite}
@keyframes blkBlink{50%{opacity:.4}}
.bar-sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar-sub #counts{flex:1;min-width:0}
.bar button.blknext{flex:none;min-height:44px;padding:4px 12px;font-size:14px;font-weight:700}
/* thẻ chuyển khúc + màn chọn khúc 3: 3 chấm (đỏ son = đang ở, vàng kim = xong), lựa chọn là thẻ giấy viền mực */
.blkdots{display:flex;justify-content:center;gap:10px;margin:6px 0 12px}
.blkdots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);background:var(--card)}
.blkdots i.done{background:var(--gold);border-color:var(--gold)}
.blkdots i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.blkno{text-align:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-ink)}
.blkgate{padding-top:22px}
.blkgate h1{margin:10px 0 4px;font-size:28px}
.blkgate .blkdesc{font-size:16.5px;margin:6px 0 2px}
.blkopts{display:grid;gap:10px;margin:14px 0 8px}
button.blkopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:78px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:0 2px 0 rgba(var(--sh),.12)}
button.blkopt:hover{border-color:var(--accent);background:var(--hover-bg)}
.blkopt .boi{flex:none;font-size:22px;width:44px;height:44px;display:grid;place-content:center;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold)}
.blkopt .bot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.blkopt b{font-size:17px;font-weight:800;color:var(--accent-ink)}
.blkopt small{font-size:14px;line-height:1.4;color:var(--muted)}
.blkopt small .zh{font-size:17px;color:var(--zh-ink)}
.blkopt kbd{flex:none}
.blkdone{margin-top:8px}
@media (max-width:600px){.blkopt kbd{display:none}}
/* thanh nhỏ dính trên màn bài/đề khi phiên đang chạy (khúc 3): dải đỏ son như thanh phiên, đồng hồ đậm, vạch vàng kim */
.smini{position:fixed;top:0;left:0;right:0;z-index:8;padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,var(--bar-top),var(--bar-bot));
  box-shadow:inset 0 -1px 0 rgba(255,214,190,.18),0 8px 16px -12px rgba(90,15,10,.7)}
.smin{max-width:720px;margin:0 auto;padding:3px 16px;min-height:50px;display:flex;align-items:center;gap:10px}
.smlab{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--bar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smclock{flex:none;font-family:var(--serif);font-weight:700;font-size:19px;font-variant-numeric:lining-nums tabular-nums;color:var(--bar-ink)}
.smini button.smback{flex:none;min-height:44px;padding:4px 14px;font-size:14px;font-weight:800;background:var(--card);color:var(--accent-ink);border:1px solid transparent;box-shadow:0 2px 0 rgba(90,15,10,.35)}
.smini button.smback:hover{background:var(--gold-soft);border-color:var(--gold)}
.smtrack{height:3px;background:rgba(255,240,228,.22)}
.smtrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E2B04A,#FFE39A);transition:width .5s linear}
.smini.done .smlab{color:#FFE39A}
html.insess{scroll-padding-top:130px}
html.insess body{padding-top:calc(53px + env(safe-area-inset-top))}
html.insess .bar,html.insess .ptabs.lstabs{top:calc(53px + env(safe-area-inset-top))}
@media (max-width:420px){.smname{display:none}.smlab{letter-spacing:.06em}}
/* ---------- cài đặt "Cấp HSK của từ mới": ô tick dạng thẻ giấy viền mực, đang chọn = nền son nhạt viền son ---------- */
.setting.hskset{flex-direction:column;align-items:stretch;gap:10px;border-top:1px dashed var(--border)}
.hskhead{display:flex;align-items:baseline;gap:12px}
.hskhead button.link{flex:none}
.hskhead button.link:disabled:hover{background:none}
.hskgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hskchip{display:flex;align-items:center;gap:9px;min-width:0;min-height:46px;padding:6px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.hskchip:hover{background:var(--hover-bg);border-color:var(--line)}
.hskchip.on{background:var(--accent-soft);border-color:var(--accent-soft-line)}
.hskchip.wide{grid-column:1/-1}
.hskchip .hl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hskchip .hn{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hskchip.on .hn{color:var(--accent-soft-ink)}
.decks .counts .hskoff{display:block;margin-top:1px;font-size:12px;line-height:1.35;color:var(--muted)}
@media (max-width:560px){.hskgrid{grid-template-columns:repeat(2,minmax(0,1fr))}} /* chữ Giấy to hơn: 3 cột ở 521–550px cắt "HSK 2–5" */
@media (max-width:400px){.hskchip{padding:6px 9px;gap:7px}.hskchip .hl{font-size:14px}.hskchip .hn{font-size:12px}}
@media (max-width:350px){.hskgrid{grid-template-columns:1fr}}
/* ---------- AI chấm bài: khung giấy nét đứt, vạch trái theo kết quả, nhãn đậm ---------- */
.aibox{margin-top:12px;padding:12px 14px;border:1px dashed var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--card2);text-align:left}
.aibox.v-dung{border-left-color:var(--green)}
.aibox.v-gan-dung{border-left-color:var(--orange)}
.aibox.v-sai{border-left-color:var(--red)}
.aibox.wait{border-left-width:1px;border-left-style:dashed}
.aihead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.aiverd{display:inline-flex;align-items:baseline;gap:10px;font-size:17px;font-weight:800}
.v-dung .aiverd{color:var(--green-ink)}.v-gan-dung .aiverd{color:var(--orange-ink)}.v-sai .aiverd{color:var(--red-ink)}
.aiscore{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

   giá trị cũ: "dark"/"auto" → dem, "light" → giay */(function(){var t;try{var s=JSON.parse(localStorage.getItem("hoctrung.v1")||"{}").settings;t=s&&s.theme}catch(e){}
if(t==="light")t="giay";else if(t==="system")t=window.matchMedia&&!matchMedia("(prefers-color-scheme: dark)").matches?"giay":"dem";else if(t!=="giay")t="dem";
var g=t==="giay";document.getElementById("theme-dem").media=g?"not all":"all";document.getElementById("theme-giay").media=g?"all":"not all";

<script>
(function () {
  "use strict";

  // ---------- hằng số ----------
  var STORE_KEY = "hoctrung.v1";
  var DAY_MS = 86400000;
  var TARGET_SEC = 45 * 60;
  var RELEARN_GAP = 8;
  var REFILL_NEW = 5;
  var REFILL_EARLY = 10;
  var MIN_CARDS_FOR_STREAK = 5;
  var NEW_OPTIONS = [5, 10, 15, 20];
  // Trần lượt ôn mỗi ngày (settings.reviewCap): 0 = không giới hạn. Mặc định 60.
  var REVIEW_CAP_OPTIONS = [30, 60, 100, 0];
  var REVIEW_CAP_DEFAULT = 60;
  var DAILY_KEEP = 120; // giữ số lượt ôn của ~120 ngày gần nhất (db.daily)
  // Thẻ "Dịch câu" (Việt → Trung): chen 1 thẻ sau mỗi TRANS_EVERY thẻ thường, tối đa TRANS_MAX thẻ khác nhau / phiên.
  var TRANS_EVERY = 6;
  var TRANS_MAX = 8;
  var TRANS_KEYS = 4; // số từ khóa gợi ý tối đa trên thẻ dịch
  // Phiên chia 3 khúc (settings.sessionBlocks, mặc định bật; tắt = phiên trộn như cũ). Mỗi khúc 15 phút:
  // 0 "Thẻ" (thẻ từ) · 1 "Nói & dịch" (thẻ nói xen thẻ dịch) · 2 "Nghe & đọc" (nhại 1 bài khóa / làm tiếp 1 phần đề).
  var BLOCK_SEC = 15 * 60;
  var BLOCKS = [["Thẻ", "Thẻ từ: từ mới + ôn"], ["Nói & dịch", "🗣 Thẻ nói xen ✍ dịch câu"], ["Nghe & đọc", "🎙 Nhại 1 bài khóa hoặc 📝 làm tiếp 1 phần đề"]];
  var TALK_RELEARN_GAP = 3; // khúc 2: thẻ nói vừa Quên quay lại sau ~3 thẻ nói (xen thẻ dịch → ~6 thẻ)
  var HSK_ALL = [0, 1, 2, 3, 4, 5, 6]; // cấp HSK của từ mới (settings.hskLevels); 0 = ngoài HSK (khẩu ngữ)
  // Kiểm tra bài cũ đầu buổi (settings.warmup): số câu, 0 = tắt. Mặc định 8.
  var WARM_OPTIONS = [0, 5, 8, 10];
  var WARM_DEFAULT = 8;

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var BASE_DECKS = Array.isArray(window.DECKS) ? window.DECKS.filter(function (d) { return d && d.id; }) : [];
  var DECKS = BASE_DECKS.slice(); // + deck ảo "Từ trong đề" khi có từ (xem rebuildItems)

  // ---------- tiện ích ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function fmtClock(sec) { return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60); }
  function dateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function fmtDate(key) { var p = String(key).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : key; }
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function byId(id) { return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2600);
  }

  // ---------- từ lưu từ đề thi (bộ "📝 Từ trong đề") ----------
  var CUSTOM_KEY = "hoctrung.custom.v1";
  var CUSTOM_DECK_ID = "tu-de-thi";
  function normalizeCustom(arr) {
    var out = [], seen = {};
    (Array.isArray(arr) ? arr : []).forEach(function (w) {
      if (!w || typeof w !== "object" || !w.hanzi || seen[w.hanzi]) return;
      seen[w.hanzi] = true;
      out.push({ hanzi: String(w.hanzi), pinyin: String(w.pinyin || ""), hanviet: String(w.hanviet || ""), vi: String(w.vi || ""), from: String(w.from || "") });
    });
    return out;
  }
  function loadCustom() {
    try { return normalizeCustom(JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]")); } catch (e) { return []; }
  }
  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(CUSTOM)); return true; }
    catch (e) { toast("Không lưu được từ (trình duyệt chặn localStorage?)"); return false; }
  }
  var CUSTOM = loadCustom();
  function customHas(hanzi) { return CUSTOM.some(function (w) { return w.hanzi === hanzi; }); }
  function customDeck() {
    return {
      id: CUSTOM_DECK_ID, title: "Từ trong đề", emoji: "📝", phrases: [],
      words: CUSTOM.map(function (w) {
        var m = /^(.*)#(\d+)$/.exec(w.from);
        return {
          hanzi: w.hanzi, pinyin: w.pinyin, hanviet: w.hanviet, meaning: w.vi, chiettu: "", examples: [],
          note: m ? "Gặp trong đề " + m[1] + ", câu " + m[2] + "." : ""
        };
      })
    };
  }

  // ---------- từ thêm từ nút "🔗 Mở rộng" trên thẻ (bộ "🔗 Từ mở rộng") ----------
  // localStorage "hoctrung.expand.v1" = [{ hanzi, pinyin, hanviet, meaning, pos, hsk, chiettu, examples: [{ zh, pinyin, vi }], from, src? }]
  // from = id thẻ gốc "<deckId>:<hanzi>"; src "ai" = từ AI soạn. Đi theo backup; không trùng hanzi. Từ mới ưu tiên ngang bộ 📝.
  var EXPW_KEY = "hoctrung.expand.v1";
  var EXP_DECK_ID = "tu-mo-rong";
  function normalizeExpW(arr) {
    var out = [], seen = {};
    (Array.isArray(arr) ? arr : []).forEach(function (w) {
      var v = aiWordVal(w);
      if (!v || seen[v.hanzi]) return;
      seen[v.hanzi] = true;
      v.from = aiS(w.from, 80);
      if (w.src !== "ai") delete v.src;
      delete v.note;
      out.push(v);
    });
    return out;
  }
  function loadExpW() { try { return normalizeExpW(JSON.parse(localStorage.getItem(EXPW_KEY) || "[]")); } catch (e) { return []; } }
  function saveExpW() {
    try { localStorage.setItem(EXPW_KEY, JSON.stringify(EXPW)); return true; }
    catch (e) { toast("Không lưu được từ (trình duyệt chặn localStorage?)"); return false; }
  }
  var EXPW = loadExpW();
  function expWHas(hanzi) { return EXPW.some(function (w) { return w.hanzi === hanzi; }); }
  function expDeck() {
    return {
      id: EXP_DECK_ID, title: "Từ mở rộng", emoji: "🔗", phrases: [],
      words: EXPW.map(function (w) {
        var o = {}; Object.keys(w).forEach(function (k) { o[k] = w[k]; });
        var src = String(w.from || "").split(":");
        o.note = src[0] === "rp" ? "🎭 Từ khóa của tình huống đóng vai." : src.length >= 2 && src[1] ? "🔗 Mở rộng từ " + src.slice(1).join(":") + "." : "";
        return o;
      }),
      phrases: EXPP.map(function (p) { return { zh: p.zh, pinyin: p.pinyin, vi: p.vi, when: p.when }; })
    };
  }
  // Câu "+ Ôn" từ tổng kết 🎭 Đóng vai = mẫu câu (thẻ nói + thẻ dịch) của bộ 🔗 Từ mở rộng.
  // localStorage "hoctrung.expand.p.v1" = [{ zh, pinyin, vi, when, from: "rp:<khóa cấp>" }] — CHỈ NỐI THÊM, không xóa / đổi thứ tự
  // (id thẻ "tu-mo-rong:p:<i>" theo chỉ số). Đi theo backup (expandPhrases); lúc nhập, id thẻ được đổi về chỉ số của máy này.
  var EXPP_KEY = "hoctrung.expand.p.v1";
  function normalizeExpP(arr) {
    var out = [], seen = {};
    (Array.isArray(arr) ? arr : []).forEach(function (p) {
      if (!p || typeof p !== "object" || !p.zh) return;
      var zh = aiS(p.zh, 200), k = normSent(zh);
      if (!k || seen[k]) return;
      seen[k] = true;
      out.push({ zh: zh, pinyin: aiS(p.pinyin, 400), vi: aiS(p.vi, 300), when: aiS(p.when, 200), from: aiS(p.from, 80) });
    });
    return out;
  }
  function loadExpP() { try { return normalizeExpP(JSON.parse(localStorage.getItem(EXPP_KEY) || "[]")); } catch (e) { return []; } }
  function saveExpP() {
    try { localStorage.setItem(EXPP_KEY, JSON.stringify(EXPP)); return true; }
    catch (e) { toast("Không lưu được câu (trình duyệt chặn localStorage?)"); return false; }
  }
  var EXPP = loadExpP();
  function expPIndex(zh) { var k = normSent(zh); for (var i = 0; i < EXPP.length; i++) if (normSent(EXPP[i].zh) === k) return i; return -1; }
  function expAny() { return EXPW.length + EXPP.length > 0; }

  // ---------- giáo trình HSK chuẩn: chỉ mục + nạp lười ----------
  var LESSON_ID_RE = /^[A-Za-z0-9_.-]+$/;
  var LESSON_INDEX = Array.isArray(window.LESSON_INDEX) ? window.LESSON_INDEX.filter(function (l) { return l && l.id && LESSON_ID_RE.test(l.id); }) : [];
  var LESSON_META = {};
  LESSON_INDEX.forEach(function (l) { LESSON_META[l.id] = l; });
  function lessonData(id) { var L = window.LESSONS && window.LESSONS[id]; return L && typeof L === "object" ? L : null; }
  var lessonWaiters = {}; // id -> [callback(ok)] khi đang tải
  function loadLesson(id, cb) {
    if (!LESSON_META[id]) { cb(false); return; }
    if (lessonData(id)) { cb(true); return; }
    if (lessonWaiters[id]) { lessonWaiters[id].push(cb); return; }
    lessonWaiters[id] = [cb];
    var s = document.createElement("script"), done = false;
    var finish = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (s.parentNode) s.parentNode.removeChild(s);
      var ok = !!lessonData(id), cbs = lessonWaiters[id] || [];
      delete lessonWaiters[id];
      cbs.forEach(function (f) { try { f(ok); } catch (e) { /* bỏ qua */ } });
    };
    var timer = setTimeout(finish, 10000);
    s.onload = finish; s.onerror = finish;
    s.src = "lessons/" + id + ".js";
    document.body.appendChild(s);
  }
  // Nạp nhiều bài; gọi cb đúng 1 lần khi tất cả xong/lỗi hoặc quá timeout.
  function loadLessons(ids, cb, timeoutMs) {
    var left = ids.length, called = false;
    var end = function () { if (called) return; called = true; clearTimeout(t); cb(); };
    var t = setTimeout(end, timeoutMs || 8000);
    if (!left) { end(); return; }
    ids.forEach(function (id) { loadLesson(id, function () { if (--left <= 0) end(); }); });
  }
  function lessonDeck(id) {
    var L = lessonData(id), m = LESSON_META[id] || {};
    if (!L) return null;
    var level = L.level || m.level || "", no = L.lesson || m.lesson || "";
    return {
      id: id, lesson: true, emoji: L.emoji || m.emoji || "📘",
      title: "HSK" + level + " · B" + no + " " + (L.title_zh || m.title_zh || ""),
      words: Array.isArray(L.words) ? L.words : [], phrases: Array.isArray(L.phrases) ? L.phrases : []
    };
  }
  function lessonDecks() {
    var ids = db && db.settings && Array.isArray(db.settings.enabledLessons) ? db.settings.enabledLessons : [];
    return LESSON_INDEX.filter(function (l) { return ids.indexOf(l.id) >= 0; })
      .map(function (l) { return lessonDeck(l.id); }).filter(Boolean);
  }

  // ---------- bản đồ chủ đề: chỉ mục (map/index.js) + nạp lười map/<topic>.js ----------
  // Mỗi chủ đề = Cốt lõi (32 từ của deck chủ đề) + nhánh × cấp. Khóa cấp "topic/branch/lv".
  // Cấp đang học (settings.enabledMapLevels) = deck SRS "map-<topic>-<branch>-<lv>" (thẻ "<deckId>:<hanzi>", "<deckId>:p:<i>").
  // Mở cấp: cấp 1 khi Cốt lõi ≥ 80% nhớ, cấp n khi cấp n-1 ≥ 80% nhớ; "Mở sớm" lưu settings.mapUnlocked.
  // Cấp đang học đạt 80% → cấp kế tự mở + tự vào phiên đúng 1 lần (settings.mapAdvanced nhớ cấp đã tự thêm, bỏ ra không bị thêm lại).
  var MAP_KEY_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/[1-9]\d?$/; // cấp 1-99 (cấp AI soạn thêm: 4, 5…)
  var MAP_PCT = 80;     // % nhớ để mở cấp kế
  var MAP_MEM_DAYS = 3; // "nhớ" = thẻ state review và interval ≥ 3 ngày
  var MAP_INDEX = (Array.isArray(window.MAP_INDEX) ? window.MAP_INDEX : []).filter(function (t) {
    return t && t.id && LESSON_ID_RE.test(t.id) && Array.isArray(t.branches);
  });
  (function () { // xếp theo thứ tự 12 chủ đề; chủ đề không có deck đứng cuối
    var ord = {}; BASE_DECKS.forEach(function (d, i) { ord[d.id] = i; });
    MAP_INDEX.sort(function (a, b) { return (a.id in ord ? ord[a.id] : 999) - (b.id in ord ? ord[b.id] : 999); });
  })();
  // ---------- gói cấp AI soạn (localStorage "hoctrung.aipacks.v1", ĐI THEO backup) ----------
  // { "<topic>/<branch>": [level…]  — cấp soạn thêm (4, 5…) cho nhánh có sẵn,
  //   "<topic>/new:<slug>": { id: "new-<slug>", title, emoji, desc, levels: [level…], src: "ai", at } — nhánh người học tự đặt }
  // level = { lv, title, goal, words: [{ hanzi, pinyin, hanviet, meaning, pos, hsk, chiettu: "", examples: [{ zh, pinyin, vi }], note, src: "ai" }],
  //           phrases: [{ zh, pinyin, vi, when }], roleplay: {…} | null, src: "ai", at }. Pinyin / Hán Việt đã chuẩn hóa bằng từ điển lúc soạn.
  // Hiện trong bản đồ như cấp thường (khóa "topic/branch/lv", deck "map-…"); file chủ đề không cần nạp.
  var AIPACK_KEY = "hoctrung.aipacks.v1";
  var SLUG_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;
  function aiS(x, max) { return String(x == null ? "" : x).trim().slice(0, max || 300); }
  function aiExVal(e) {
    if (!e || typeof e !== "object" || !e.zh) return null;
    return { zh: aiS(e.zh, 200), pinyin: aiS(e.pinyin, 400), vi: aiS(e.vi, 300) };
  }
  function aiWordVal(w) {
    if (!w || typeof w !== "object" || !w.hanzi) return null;
    var hsk = Math.floor(Number(w.hsk));
    return { hanzi: aiS(w.hanzi, 16), pinyin: aiS(w.pinyin, 80), hanviet: aiS(w.hanviet, 80), meaning: aiS(w.meaning, 200), pos: aiS(w.pos, 20),
      hsk: hsk >= 1 && hsk <= 6 ? hsk : 0, chiettu: aiS(w.chiettu, 400),
      examples: (Array.isArray(w.examples) ? w.examples : []).map(aiExVal).filter(Boolean).slice(0, 3), note: aiS(w.note, 300), src: "ai" };
  }
  function aiLevelVal(L) {
    if (!L || typeof L !== "object") return null;
    var lv = Number(L.lv);
    if (!(lv >= 1 && lv <= 99) || Math.floor(lv) !== lv) return null;
    var seen = {}, words = (Array.isArray(L.words) ? L.words : []).map(aiWordVal).filter(function (w) {
      if (!w || seen[w.hanzi]) return false; seen[w.hanzi] = true; return true;
    });
    if (!words.length) return null;
    var rp = L.roleplay && typeof L.roleplay === "object" && L.roleplay.opening_zh ? L.roleplay : null;
    var strs = function (a, n, m) { return (Array.isArray(a) ? a : []).map(function (x) { return aiS(x, m); }).filter(Boolean).slice(0, n); };
    return {
      lv: lv, title: aiS(L.title, 80), goal: aiS(L.goal, 200), words: words,
      phrases: (Array.isArray(L.phrases) ? L.phrases : []).filter(function (p) { return p && p.zh; }).slice(0, 8).map(function (p) {
        return { zh: aiS(p.zh, 200), pinyin: aiS(p.pinyin, 400), vi: aiS(p.vi, 300), when: aiS(p.when, 200) };
      }),
      roleplay: rp ? { title: aiS(rp.title, 80), setting_vi: aiS(rp.setting_vi, 400), ai_role: aiS(rp.ai_role, 120), user_role: aiS(rp.user_role, 120),
        goals_vi: strs(rp.goals_vi, 5, 200), opening_zh: aiS(rp.opening_zh, 200), opening_vi: aiS(rp.opening_vi, 300), key_words: strs(rp.key_words, 12, 16) } : null,
      src: "ai", at: num(L.at, 0)
    };
  }
  function aiLevelsVal(a) {
    var seen = {};
    return (Array.isArray(a) ? a : []).map(aiLevelVal).filter(function (L) { if (!L || seen[L.lv]) return false; seen[L.lv] = true; return true; })
      .sort(function (x, y) { return x.lv - y.lv; });
  }
  function aiPacksVal(o) {
    var out = {};

  }
  // Cấp đang học đạt 80% → cấp kế của nhánh tự mở + vào phiên (mỗi cấp kế chỉ tự thêm 1 lần).

    var s = db.settings, added = [];
    (keys || mapOnKeys()).forEach(function (key) {
      if (!MAP_LV[key] || !mapIsOn(key) || mapLvStat(key).pct < MAP_PCT) return;
      var nx = mapSib(key, 1);
      if (!nx) { aiAutoNext(key); return; } // cấp cuối của nhánh đạt 80% → nhờ AI soạn cấp tiếp (nếu bật)
      if (mapIsOn(nx) || s.mapAdvanced.indexOf(nx) >= 0) return;
      s.mapAdvanced.push(nx);

  // ---------- lọc cấp HSK của từ mới (settings.hskLevels) ----------
  // Chỉ lọc TỪ MỚI (thẻ từ chưa học) của 12 chủ đề trong decks/. Thẻ đã học, bài giáo trình, bộ 📝, mẫu câu, thẻ dịch: không lọc.

  // Số từ chủ đề theo cấp (đếm từ dữ liệu): [cấp] -> { all, fresh }.
  function hskStats() {

    ITEMS.forEach(function (it) {

      var x = r[wordLevel(it.data)]; x.all++;

  }

  // ---------- SRS (SM-2 rút gọn) ----------
  // due của Khó/Nhớ/Dễ tính từ 0h hôm nay + interval ngày, để thẻ luôn tới hạn ngay từ sáng.
  function computeGrade(card, grade, now) {
    var c = {
      state: card.state, ease: card.ease, interval: card.interval,
      due: card.due, reps: card.reps, lapses: card.lapses, last: card.last
    };
    var today = startOfDay(now);
    if (grade === 1) {
      c.lapses += 1; c.interval = 0; c.ease = Math.max(1.3, round2(c.ease - 0.2));
      c.state = "learning"; c.due = now;
    } else if (grade === 2) {
      c.interval = c.interval === 0 ? 1 : Math.max(1, Math.round(c.interval * 1.2));
      c.ease = Math.max(1.3, round2(c.ease - 0.15));
      c.due = today + c.interval * DAY_MS; c.state = "review";
    } else if (grade === 3) {
      c.interval = c.interval === 0 ? 1 : c.interval === 1 ? 3 : Math.round(c.interval * c.ease);
      c.due = today + c.interval * DAY_MS; c.state = "review";
    } else {
      c.interval = c.interval === 0 ? 3 : Math.round(Math.max(c.interval * c.ease * 1.3, c.interval + 2));
      c.ease = round2(c.ease + 0.15);

  }

  }
  function applyGrade(id, grade) {
    db.cards[id] = computeGrade(cardOf(id), grade, Date.now());

  }

  // ---------- phát âm ----------

  function buildNewPool(decks, only) {
    var ord = function (d) { return deckNewOrder(d, only); };

    // Bài giáo trình đang học có lượt riêng, xen 1-1 với 12 chủ đề — nếu chỉ xếp chung vòng tròn

    // Từ người học tự bấm "+ Ôn" (bộ 📝) đi trước, xen kẽ 1-1 với phần còn lại — nếu chỉ

  // Thẻ đến hạn, xếp theo thứ tự tốt cho trí nhớ: interval ngắn (dễ quên nhất) trước, cùng interval thì hạn sớm trước.
  // Có trần ôn thì phiên chỉ lấy phần đầu danh sách; phần dư giữ nguyên due (để mấy hôm tới, không bị coi là quên).

    var ids = {}; decks.forEach(function (d) { ids[d.id] = true; });
    return ITEMS.filter(function (it) { return ids[it.deckId] && isDue(it.id, now); })
      .sort(function (a, b) {
        var ca = db.cards[a.id], cb = db.cards[b.id];

  // ---------- thẻ Dịch câu (Việt → Trung, tự chấm) ----------
  // Nguồn: câu ví dụ của từ đã học (thẻ từ state "review") + mẫu câu đã học, trong các bộ đang chọn.
  // Tiến độ lưu ở db.cards bằng id riêng, không đụng id cũ: "<deckId>:t:<hanzi>:<i>" (câu ví dụ thứ i của từ),
  // "<deckId>:tp:<i>" (mẫu câu thứ i). Không vào ITEMS (không thành "từ mới", không tính vào trần ôn).

  function transItems(decks) {
    var ids = {}, out = [];

    ITEMS.forEach(function (it) {
      if (!ids[it.deckId]) return;

        (Array.isArray(it.data.examples) ? it.data.examples : []).forEach(function (ex, i) {
          if (!ex || !ex.zh || !ex.vi) return;

  // Thẻ dịch kế tiếp: thẻ dịch đến hạn trước; không có thì câu mới của từ đã nhớ ≥ 1 ngày (ngẫu nhiên, mỗi từ 1 câu / phiên).
  function nextTrans() {
    var now = Date.now(), due = [], fresh = [];
    transItems(session.decks).forEach(function (t) {
      if (session.transSeen[t.id]) return;

      if (c && c.state !== "new") { if (c.due <= now) due.push(t); return; }
      var sc = db.cards[t.src.id];
      if (!sc || sc.state !== "review" || !(sc.interval >= 1) || session.transWords[t.src.id]) return;
      fresh.push(t);

    if (due.length) return due.sort(function (a, b) { return db.cards[a.id].due - db.cards[b.id].due; })[0];

  // Gọi ở nextCard khi còn thẻ thường phía sau: đủ TRANS_EVERY thẻ thường thì chen 1 thẻ dịch (lượt làm lại trước).

  // Từ khóa đã học có trong câu (để gợi ý: hiện nghĩa, chữ Hán ẩn tới khi bấm "Gợi ý").

  // ---------- phiên học ----------
  var view = "home";
  var session = null;

  function startSession() {
    var decks = selectedDecks();
    if (!decks.length) { toast("Chọn ít nhất 1 chủ đề đã"); return; }
    if (session && session.timerId) clearInterval(session.timerId);
    recRelease();

    var isWord = function (it) { return it.kind === "word"; };
    var notWord = function (it) { return it.kind !== "word"; };

    // Không vượt trần: lượt ôn chỉ đếm lúc chấm, chạm trần thì capHit tự bỏ lượt ôn còn lại ở queue lẫn talk.

      queue: interleave(dueW, firstNew), newPool: pool,
      current: null, flipped: false, hint: false, keepPad: false,
      shown45: false, doneCount: 0, touched: {}, spokenFor: "",
      relearn: {}, // thẻ đang quay lại trong phiên (từ mới vừa hiểu / thẻ vừa Quên) — lượt này không tính là lượt ôn
      // thẻ Dịch câu: đã ra (id), từ gốc đã dùng, lượt làm lại ("Chưa được"), số thẻ đã ra, số thẻ thường từ thẻ dịch trước

    var prog = byId("prog"); if (prog) prog.style.width = Math.min(100, session.elapsed / TARGET_SEC * 100) + "%";

    if (session.elapsed >= TARGET_SEC && !session.shown45) {
      session.shown45 = true;
      var b = byId("banner45"); if (b) b.hidden = false;
      // Đang đứng ở màn chọn khúc 3: vẽ lại 1 lần để hiện nút Kết thúc (màn này không có gì đang dở).

    }

  }
  function requeue(it) {

    else session.queue.splice(Math.min(RELEARN_GAP, session.queue.length), 0, it);
  }

  // ---------- phiên chia 3 khúc ----------
  // Khúc theo đồng hồ chỉ tăng, không lùi: bấm "Sang khúc sau" sớm thì tới mốc giờ cũng không kéo về.
  function timeBlock(sec) { return Math.min(BLOCKS.length - 1, Math.floor(sec / BLOCK_SEC)); }
  // Vào khúc b: hiện thẻ chuyển tiếp (gate) — thẻ đang dở đã xong trước đó (chỉ gọi lúc chọn thẻ kế tiếp).
  function blkEnter(b, why) {
    session.block = b; session.gate = b; session.gateWhy = why || ""; session.pendNote = false;
    session.current = null;
  }
  function blkGo() {
    if (!session || session.gate == null) return;

  }
  // Nút "Sang khúc sau": bỏ thẻ đang hiện (chưa chấm thì không đổi gì trong SRS), vào thẳng khúc sau.

    if (!session || !session.blocks || session.block >= BLOCKS.length - 1 || warmActive()) return;

    toast("Khúc " + (session.block + 1) + " · " + BLOCKS[session.block][0]);
    nextCard();
  }
  // Khúc 2: thẻ nói (đến hạn → vừa Quên → mẫu câu chưa học, nạp từng 5) xen kẽ 1-1 thẻ dịch câu.
  function talkPhrase() {
    if (!session.talk.length) {

        return it.kind !== "word" && !session.touched[it.id];

    return r.length ? r.shift().it : null;
  }
  function blkTalkNext() {
    var order = session.talkTurn % 2 ? [talkTrans, talkPhrase] : [talkPhrase, talkTrans];
    session.talkTurn++;
    return order[0]() || order[1]();
  }
  // Vị trí trong queue của từ bị kéo ôn vì Sai ở bài cũ mà chưa chấm trong phiên (chỉ khúc 1); -1 = không còn.
  function blkWarmLeft() {
    if (!session.blocks || session.block !== 0 || !session.warmPull) return -1;
    for (var i = 0; i < session.queue.length; i++) {
      var x = session.queue[i];
      if (session.warmPull[x.id] && !session.touched[x.id]) return i;
    }
    return -1;
  }
  function blkNext() {
    syncElapsed();
    session.current = null;
    if (session.gate != null) return;
    var tb = timeBlock(session.elapsed);
    if (tb > session.block) {
      // Bài cũ ăn hết giờ khúc 1: vẫn ôn nốt các từ vừa Sai (đã hứa "ôn lại ngay trong phiên này") rồi mới sang khúc sau
      var wi = blkWarmLeft();
      if (wi >= 0) { session.current = session.queue.splice(wi, 1)[0]; return; }
      blkEnter(tb, ""); return;
    }
    if (session.block === 0) {
      if (!session.queue.length) refillQueue();
      session.current = session.queue.shift() || null;
      if (!session.current) blkEnter(1, "Hết thẻ từ");
    } else if (session.block === 1) {
      session.current = blkTalkNext();
      if (!session.current) blkEnter(2, "Hết thẻ nói & dịch");
    }
  }
  function blkTick() {
    var tb = timeBlock(session.elapsed);

    if (tb > session.block && session.gate == null && session.current && !session.pendNote && view === "session") {
      session.pendNote = true;
      toast("Hết giờ khúc " + (session.block + 1) + " — xong thẻ này là sang khúc " + (tb + 1));
    }
    updateBlkBar();
  }
  // Có kiểm tra bài cũ: thêm 1 đoạn nhỏ "Bài cũ" đứng trước 3 khúc (thanh đầy theo số câu đã làm, không theo giờ).

    return (session && session.warm ? '<div class="blk warm"><span class="bl">Bài cũ</span><span class="bt"><i class="bf"></i></span></div>' : "") +
      BLOCKS.map(function (b, i) {

  }
  function updateBlkBar() {
    var el = byId("blks");
    if (!el || !session) return;
    var tb = timeBlock(session.elapsed), segs = el.querySelectorAll(".blk[data-b]"), wa = warmActive();
    for (var i = 0; i < segs.length; i++) {
      segs[i].className = "blk" + (i < session.block ? " done" : i === session.block && !wa ? " on" : "") + (i === tb && tb > session.block ? " next" : "");
      var f = segs[i].querySelector(".bf");
      if (f) f.style.width = Math.round(Math.max(0, Math.min(1, (session.elapsed - i * BLOCK_SEC) / BLOCK_SEC)) * 100) + "%";
    }
    var ws = el.querySelector(".blk.warm"), w = session.warm;
    if (ws && w) {
      ws.className = "blk warm" + (wa ? " on" : " done");
      var wf = ws.querySelector(".bf");
      if (wf) wf.style.width = Math.round((wa && w.phase !== "sum" ? w.i / Math.max(1, w.qs.length) : 1) * 100) + "%";

    var nb = byId("blkNext"); if (nb) nb.hidden = session.block >= BLOCKS.length - 1 || wa;
  }
  // Khúc 3: gợi ý 1 bài khóa để nhại — bài đang học (ưu tiên HSK 3-4), không có thì bài cấp 3-4 đang xem ở Giáo trình.
  // Mỗi lần mở đổi sang bài kế tiếp trong danh sách (UI.blkLesson = bài mở lần trước) cho đỡ lặp.
  function blkLessonPick() {
    var core = function (l) { return LS_CORE_LEVELS.indexOf(Number(l.level)) >= 0; };
    var has = function (l) { return l.texts == null || Number(l.texts) > 0; };
    var on = LESSON_INDEX.filter(function (l) { return lessonOn(l.id) && has(l); });
    var cands = on.filter(core).concat(on.filter(function (l) { return !core(l); })), studying = cands.length > 0;

      if (!cands.length) cands = LESSON_INDEX.filter(function (l) { return core(l) && has(l); });
      if (!cands.length) cands = LESSON_INDEX.filter(has);
    }
    if (!cands.length) return null;
    var i = cands.map(function (l) { return l.id; }).indexOf(UI.blkLesson);

  // ---------- luyện đề HSK4: dữ liệu & tiến độ ----------
  var EXAM_KEY = "hoctrung.exams.v1";
  var EXAM_ID_RE = /^[A-Za-z0-9_.-]+$/;
  var EXAM_INDEX = Array.isArray(window.EXAM_INDEX) ? window.EXAM_INDEX.filter(function (e) { return e && e.id && EXAM_ID_RE.test(e.id); }) : [];

  function normalizeExdb(obj) {
    var out = {};

    Object.keys(obj).forEach(function (id) {
      var e = obj[id];
      if (!e || typeof e !== "object") return;
      var ans = {};
      if (e.ans && typeof e.ans === "object") {
        Object.keys(e.ans).forEach(function (n) {
          var a = e.ans[n];
          if (!a || typeof a !== "object" || !/^\d+$/.test(n)) return;
          ans[n] = { pick: a.pick == null ? null : a.pick, ok: a.ok === true ? true : a.ok === false ? false : null };
        });
      }
      out[id] = { ans: ans, last: Number(e.last) > 0 ? Number(e.last) : null };
    });

  }

    try { return normalizeExdb(JSON.parse(localStorage.getItem(EXAM_KEY) || "{}")); } catch (e) { return {}; }
  }

    try { localStorage.setItem(EXAM_KEY, JSON.stringify(EXDB)); return true; }
    catch (e) { toast("Không lưu được tiến độ đề (trình duyệt chặn localStorage?)"); return false; }
  }
  var EXDB = loadExdb();
  function exProg(id) { return EXDB[id] || (EXDB[id] = { ans: {}, last: null }); }

    var r = { done: 0, ok: 0 }, e = EXDB[id];
    if (e) Object.keys(e.ans).forEach(function (n) { r.done++; if (e.ans[n].ok === true) r.ok++; });
    return r;
  }

  // Từ "+ Ôn" → bộ 📝; deck ảo dựng lại ngay, lần đầu xuất hiện thì tự tick chọn.
  function afterCustomChange(hadDeck) {
    rebuildItems();
    if (!hadDeck && CUSTOM.length && db.settings.selectedDecks.indexOf(CUSTOM_DECK_ID) < 0) {
      db.settings.selectedDecks.push(CUSTOM_DECK_ID); saveDb();
    }
  }
  function addCustomWord(v, from) {
    if (!v || !v.hanzi) return;
    if (customHas(v.hanzi)) { toast(v.hanzi + " đã có trong bộ 📝 Từ trong đề"); return; }
    var had = CUSTOM.length > 0;
    CUSTOM.push(normalizeCustom([{ hanzi: v.hanzi, pinyin: v.pinyin, hanviet: v.hanviet, vi: v.vi, from: from }])[0]);
    saveCustom(); afterCustomChange(had);

  // ---------- luyện đề: nạp đề lười + audio ----------
  var exam = null;        // đề đang mở
  var examPending = null; // id đang tải
  var audioEl = byId("examAudio");
  var audioBadSrc = null;
  var seekHold = false; // đang giữ thanh tua: timeupdate không kéo thanh về chỗ cũ

  function openExam(id) {
    if (!id || !EXAM_ID_RE.test(id)) return;
    var have = window.EXAMS && window.EXAMS[id];
    if (have) { startExam(id, have); return; }
    if (examPending === id) return;
    examPending = id;
    view = "exam-loading"; render();
    var s = document.createElement("script");
    var fail = function () {
      if (examPending !== id) return;
      examPending = null;
      if (view === "exam-loading") { view = "exams"; render(); }
      toast("Không tải được đề " + id);
    };
    s.onload = function () {
      if (s.parentNode) s.parentNode.removeChild(s);
      var ex = window.EXAMS && window.EXAMS[id];
      if (!ex) { fail(); return; }
      if (examPending !== id || view !== "exam-loading") return; // người dùng đã đi chỗ khác
      examPending = null;
      startExam(id, ex);
    };
    s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); fail(); };
    s.src = "exams/" + id + ".js";

  function partType(p) { return p.type || PART_TYPES[p.key] || "mc"; }

      if (!p || !Array.isArray(p.items)) return null;
      var items = p.items.filter(function (it) { return it && Number(it.n) > 0; });
      return items.length ? { key: p.key, name: p.name, type: p.type, banks: p.banks, items: items } : null;
    }).filter(Boolean);
    var flat = [];
    parts.forEach(function (p, pi) { p.items.forEach(function (it, ii) { flat.push({ p: pi, i: ii }); }); });
    if (!flat.length) { toast("Đề " + id + " không có câu nào"); view = "exams"; render(); return; }
    var prog = exProg(id), pos = 0;
    if (prog.last) flat.forEach(function (f, k) { if (parts[f.p].items[f.i].n === prog.last) pos = k; });
    // Mở từ khúc 3 của phiên: nhảy tới câu đầu tiên chưa làm (đúng phần chưa xong).
    var resume = examResume === id; examResume = null;
    if (resume) {
      for (var k = 0; k < flat.length; k++) { if (!prog.ans[parts[flat[k].p].items[flat[k].i].n]) { pos = k; break; } }
    }

    exam = { id: id, data: data, parts: parts, flat: flat, pos: pos, showScript: false, order: "", build: [], free: keepFree, freeShown: {}, padFor: null };
    var fresh = setupAudio();
    view = "exam"; render();
    // Làm tiếp đề (audio vừa nạp mới): tua tới đoạn của câu đang dở thay vì phát lại từ đầu file.
    if ((fresh || resume) && pos > 0) seekToItem(false);
  }
  // Trả về true khi vừa nạp file audio mới.
  function setupAudio() {
    if (!audioEl) return false;
    var src = exam && exam.data.audio;
    if (!src) { audioEl.pause(); return false; }
    if (audioEl.getAttribute("data-src") !== src) {
      audioEl.pause();
      audioEl.setAttribute("data-src", src);
      var rate = audioEl.playbackRate || 1;
      audioEl.src = src;
      try { audioEl.load(); } catch (e) { /* bỏ qua */ }
      audioEl.playbackRate = rate; audioEl.defaultPlaybackRate = rate;
      return true;
    }
    return false;
  }
  function hasAudio() { return !!(exam && exam.data.audio && audioEl && audioBadSrc !== exam.data.audio); }

    if (!hasAudio()) return;
    if (audioEl.paused) {
      var p = audioEl.play();
      if (p && p.catch) p.catch(function () { toast("Không phát được audio"); });
    } else audioEl.pause();
  }
  function skipAudio(sec) {
    if (!hasAudio()) return;
    var d = isFinite(audioEl.duration) ? audioEl.duration : Infinity;
    audioEl.currentTime = Math.max(0, Math.min(d, (audioEl.currentTime || 0) + sec));
  }
  function setRate(r) {
    if (!audioEl || !(r > 0)) return;
    audioEl.playbackRate = r; audioEl.defaultPlaybackRate = r;
    updateAudioUi();
  }
  function updateAudioUi() {
    if (view !== "exam" || !audioEl) return;
    var t = byId("auToggle"); if (t) t.textContent = audioEl.paused ? "▶" : "⏸";
    var d = audioEl.duration, c = audioEl.currentTime || 0;
    var tm = byId("auTime");
    if (tm) tm.textContent = fmtClock(Math.floor(c)) + " / " + (isFinite(d) ? fmtClock(Math.floor(d)) : "--:--");
    var sk = byId("auSeek");
    if (sk) { if (isFinite(d)) sk.max = String(Math.floor(d)); if (!seekHold) sk.value = String(Math.floor(c)); }
    var btns = app.querySelectorAll("[data-rate]");
    for (var i = 0; i < btns.length; i++) btns[i].className = Number(btns[i].getAttribute("data-rate")) === audioEl.playbackRate ? "on" : "";
  }

    ["timeupdate", "loadedmetadata", "play", "pause", "ratechange", "ended"].forEach(function (ev) { audioEl.addEventListener(ev, updateAudioUi); });

    });

  // ---------- luyện đề: điều hướng & chấm ----------

  function examGoPos(pos) {

    var prog = exProg(exam.id); prog.last = curItem().n; saveExdb();

  // Mốc giây đầu đoạn hội thoại của câu đang mở (it.t). Câu 36-45 đi theo cặp chung một đoạn nên
  // câu thứ hai không có t → lùi về câu gần nhất có t trong cùng phần.
  function itemAudioT() {
    if (!exam) return null;
    var p = exam.flat[exam.pos].p;
    for (var k = exam.pos; k >= 0 && exam.flat[k].p === p; k--) {
      var f = exam.flat[k], t = exam.parts[f.p].items[f.i].t;

    }
    var d = isFinite(audioEl.duration) ? audioEl.duration : Infinity;

  function normSent(s) { return String(s == null ? "" : s).replace(/[\s，。！？、；：,.!?;:“”‘’"'（）()《》〈〉【】…—\-·~～]/g, ""); }
  // Viết 1: đáp án gốc đôi khi chấp nhận cả câu đảo ("Đáp án gốc cũng chấp nhận 对这个城市我很熟悉。").

  // nhưng chỉ khi câu đó dùng đúng y các mảnh đề cho (tránh nhận nhầm câu ví dụ khác).
  function buildAnswers(it) {
    var out = [normSent(it.answer)];
    var bag = function (s) { return normSent(s).split("").sort().join(""); };
    var want = bag((Array.isArray(it.words) ? it.words : []).join(""));
    var cands = Array.isArray(it.alt) ? it.alt.slice() : [];
    var ex = String(it.explain || ""), k = ex.search(/chấp nhận/i);

      else if (type === "build") ok = buildAnswers(it).indexOf(normSent(pick)) >= 0;

    prog.ans[it.n] = { pick: pick, ok: ok }; prog.last = it.n; saveExdb();

  function examKey(e) {

    if (key === " " || key === "Spacebar") {
      if (!hasAudio()) return; // đề không audio: để Space cuộn trang như bình thường
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();

      return;
    }
    if (e.repeat) return;
    var it = curItem(), type = partType(curPart()), a = curAns();
    if (key === "Enter") {
      if (tag === "button") return; // Enter trên nút đang focus = bấm nút đó
      e.preventDefault();
      if (a) return;
      if (type === "order" || type === "build") examCheck();
      else if (type === "free" && !exam.freeShown[it.n]) { exam.freeShown[it.n] = true; renderExam(true); }
      return;
    }
    if (key === "Backspace") {
      if (a) return;
      if (type === "order" && exam.order) { e.preventDefault(); exam.order = exam.order.slice(0, -1); renderExam(true); }
      else if (type === "build" && exam.build.length) { e.preventDefault(); exam.build.pop(); renderExam(true); }
      return;
    }
    if (a || key.length !== 1) return;
    var up = key.toUpperCase();
    if (type === "tf") {

    } else if (type === "build") {
      if (/^[1-9]$/.test(key)) { e.preventDefault(); examBuildAdd(Number(key) - 1); }
    }

  function rpExpAdded(had) {

  }
  function rpAddWord(R, h) {
    var k = "w" + h;
    if (!h || R.added[k]) return 0;
    var its = ITEMS.filter(function (it) { return it.kind === "word" && it.data.hanzi === h; });
    var seen = its.filter(function (it) { return cardState(it.id) !== "new"; });
    if (seen.length) {
      var now = Date.now();
      seen.forEach(function (it) { var c = db.cards[it.id]; if (c && c.due > now) c.due = now; });
      saveDb();
      R.added[k] = "⏰ đến hạn ôn";
      return 1;
    }
    if (its.length) { R.added[k] = "📚 đang chờ học ở " + (its[0].deck.title || its[0].deckId); return 0; }
    var w = rpWord(R, h) || { hanzi: h }, py = w.pinyin || (dictOk() ? pickPinyin(h, "") : "");

      chiettu: w.chiettu, examples: w.examples, from: "rp:" + R.key, src: w.src }])[0];
