      id: CUSTOM_DECK_ID, title: "Từ trong đề", emoji: "📝", phrases: [],
      words: CUSTOM.map(function (w) {
        var m = /^(.*)#(\d+)$/.exec(w.from);
        return {
          hanzi: w.hanzi, pinyin: w.pinyin, hanviet: w.hanviet, meaning: w.vi, chiettu: "", examples: [],
          note: m ? "Gặp trong đề " + m[1] + ", câu " + m[2] + "." : ""
        };
      })
    };
  }

  // ---------- giáo trình HSK chuẩn: chỉ mục + nạp lười ----------
  var LESSON_ID_RE = /^[A-Za-z0-9_.-]+$/;
  var LESSON_INDEX = Array.isArray(window.LESSON_INDEX) ? window.LESSON_INDEX.filter(function (l) { return l && l.id && LESSON_ID_RE.test(l.id); }) : [];
  var LESSON_META = {};
  LESSON_INDEX.forEach(function (l) { LESSON_META[l.id] = l; });
  function lessonData(id) { var L = window.LESSONS && window.LESSONS[id]; return L && typeof L === "object" ? L : null; }
  var lessonWaiters = {}; // id -> [callback(ok)] khi đang tải
  function loadLesson(id, cb) {
    if (!LESSON_META[id]) { cb(false); return; }
    if (lessonData(id)) { cb(true); return; }
    if (lessonWaiters[id]) { lessonWaiters[id].push(cb); return; }
    lessonWaiters[id] = [cb];
    var s = document.createElement("script"), done = false;
    var finish = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (s.parentNode) s.parentNode.removeChild(s);
      var ok = !!lessonData(id), cbs = lessonWaiters[id] || [];
      delete lessonWaiters[id];
      cbs.forEach(function (f) { try { f(ok); } catch (e) { /* bỏ qua */ } });
    };
    var timer = setTimeout(finish, 10000);
    s.onload = finish; s.onerror = finish;
    s.src = "lessons/" + id + ".js";
    document.body.appendChild(s);
  }
  // Nạp nhiều bài; gọi cb đúng 1 lần khi tất cả xong/lỗi hoặc quá timeout.
  function loadLessons(ids, cb, timeoutMs) {
    var left = ids.length, called = false;
    var end = function () { if (called) return; called = true; clearTimeout(t); cb(); };
    var t = setTimeout(end, timeoutMs || 8000);
    if (!left) { end(); return; }
    ids.forEach(function (id) { loadLesson(id, function () { if (--left <= 0) end(); }); });
  }
  function lessonDeck(id) {
    var L = lessonData(id), m = LESSON_META[id] || {};
    if (!L) return null;
    var level = L.level || m.level || "", no = L.lesson || m.lesson || "";
    return {
      id: id, lesson: true, emoji: L.emoji || m.emoji || "📘",
      title: "HSK" + level + " · B" + no + " " + (L.title_zh || m.title_zh || ""),
      words: Array.isArray(L.words) ? L.words : [], phrases: Array.isArray(L.phrases) ? L.phrases : []
    };
  }
  function lessonDecks() {
    var ids = db && db.settings && Array.isArray(db.settings.enabledLessons) ? db.settings.enabledLessons : [];
    return LESSON_INDEX.filter(function (l) { return ids.indexOf(l.id) >= 0; })
      .map(function (l) { return lessonDeck(l.id); }).filter(Boolean);
  }

  // ---------- dữ liệu thẻ ----------
  var ITEMS = [];
  var ITEM_BY_ID = {};
  function rebuildItems() {
    DECKS = BASE_DECKS.concat(lessonDecks(), CUSTOM.length ? [customDeck()] : []);
    ITEMS = []; ITEM_BY_ID = {};
    DECKS.forEach(function (deck) {
      (Array.isArray(deck.words) ? deck.words : []).forEach(function (w) {
        if (!w || !w.hanzi) return;
        var id = deck.id + ":" + w.hanzi;
        if (ITEM_BY_ID[id]) return;
        var it = { id: id, deckId: deck.id, deck: deck, kind: "word", data: w };
        ITEMS.push(it); ITEM_BY_ID[id] = it;
      });
      (Array.isArray(deck.phrases) ? deck.phrases : []).forEach(function (p, i) {
        if (!p || !p.zh) return;
        var id = deck.id + ":p:" + i;
        var it = { id: id, deckId: deck.id, deck: deck, kind: "phrase", data: p, idx: i };
        ITEMS.push(it); ITEM_BY_ID[id] = it;
      });
    });
  }
  rebuildItems();

  // ---------- lưu trữ ----------
  function defaultDb() {
    return {
      cards: {},
      sessions: [],
      daily: {}, // { "YYYY-MM-DD": { reviews: n } } — số lượt ôn đã làm trong ngày (để áp trần ôn, reload không mất)
      settings: { newPerSession: 10, drawPad: true, autoSpeak: true, theme: "dem", selectedDecks: DECKS.map(function (d) { return d.id; }), enabledLessons: [], reviewCap: REVIEW_CAP_DEFAULT,
        speechScore: true, // chấm phát âm bằng nhận giọng nói (chỉ có tác dụng khi trình duyệt hỗ trợ)
        sessionBlocks: true } // phiên 45 phút chia 3 khúc (Thẻ · Nói & dịch · Nghe & đọc)
    };
  }
  function normalizeDaily(o) {
    var out = {};
    if (!o || typeof o !== "object") return out;
    Object.keys(o).filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }).sort().slice(-DAILY_KEEP).forEach(function (k) {
      var r = o[k] && typeof o[k] === "object" ? Math.max(0, Math.floor(num(o[k].reviews, 0))) : 0;
      if (r > 0) out[k] = { reviews: r };
    });
    return out;
  }
  function capVal(x) { x = Number(x); return REVIEW_CAP_OPTIONS.indexOf(x) >= 0 ? x : null; }
  function num(x, d) { x = Number(x); return isFinite(x) ? x : d; }
  function normalizeCard(c) {
    if (!c || typeof c !== "object") return null;
    var st = c.state === "learning" || c.state === "review" || c.state === "new" ? c.state : "new";
    return {
      state: st, ease: Math.max(1.3, num(c.ease, 2.5)), interval: Math.max(0, num(c.interval, 0)),
      due: num(c.due, 0), reps: Math.max(0, Math.floor(num(c.reps, 0))),
      lapses: Math.max(0, Math.floor(num(c.lapses, 0))), last: num(c.last, 0)
    };
  }
  function normalizeDb(obj) {
    var base = defaultDb();
    if (!obj || typeof obj !== "object") return base;
    if (obj.cards && typeof obj.cards === "object") {
      Object.keys(obj.cards).forEach(function (id) {
        var c = normalizeCard(obj.cards[id]);
        if (c) base.cards[id] = c;
      });
    }
    if (Array.isArray(obj.sessions)) base.sessions = obj.sessions.filter(function (s) { return s && typeof s === "object"; });
    base.daily = normalizeDaily(obj.daily);
    var s = obj.settings;
    if (s && typeof s === "object") {
      if (NEW_OPTIONS.indexOf(Number(s.newPerSession)) >= 0) base.settings.newPerSession = Number(s.newPerSession);
      if (capVal(s.reviewCap) != null) base.settings.reviewCap = capVal(s.reviewCap);
      if (typeof s.drawPad === "boolean") base.settings.drawPad = s.drawPad;
      if (typeof s.autoSpeak === "boolean") base.settings.autoSpeak = s.autoSpeak;
      if (typeof s.speechScore === "boolean") base.settings.speechScore = s.speechScore;
      if (typeof s.sessionBlocks === "boolean") base.settings.sessionBlocks = s.sessionBlocks;
      if (hskVal(s.hskLevels)) base.settings.hskLevels = hskVal(s.hskLevels); // thiếu / sai = mọi cấp (không ghi trường)
      if (themeVal(s.theme)) base.settings.theme = themeVal(s.theme);
      if (Array.isArray(s.selectedDecks)) base.settings.selectedDecks = s.selectedDecks.slice();
      if (Array.isArray(s.enabledLessons)) {
        // Bỏ id không có trong chỉ mục (không mở được để gỡ ra) — trừ khi chỉ mục không tải được.
        base.settings.enabledLessons = s.enabledLessons.filter(function (id, i, a) {
          return typeof id === "string" && LESSON_ID_RE.test(id) && a.indexOf(id) === i && (!LESSON_INDEX.length || !!LESSON_META[id]);
        });
      }
    }
    return base;
  }
  // Giao diện: "dem" Đêm đỏ (mặc định), "giay" Giấy đỏ, "system" theo máy (tối → Đêm đỏ, sáng → Giấy đỏ).
  // Bật đúng 1 khối <style id="theme-…"> bằng thuộc tính media (script trong <head> đã làm lần đầu, trước khi vẽ).
  var THEMES = ["dem", "giay", "system"];
  // Giá trị cũ (trước khi có Đêm đỏ): "dark"/"auto" → dem (mặc định mới), "light" → giay.
  function themeVal(t) {
    if (t === "dark" || t === "auto") return "dem";
    if (t === "light") return "giay";
    return THEMES.indexOf(t) >= 0 ? t : null;
  }
  var darkMq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function applyTheme() {
    var t = themeVal(db && db.settings && db.settings.theme) || "dem";
    var giay = t === "giay" || (t === "system" && !!darkMq && !darkMq.matches);
    var sd = document.getElementById("theme-dem"), sg = document.getElementById("theme-giay");
    if (sd) sd.media = giay ? "not all" : "all";
    if (sg) sg.media = giay ? "all" : "not all";
    var meta = document.querySelector("meta[name=theme-color]");
    if (meta) meta.setAttribute("content", giay ? "#B3261E" : "#070404");
  }
  if (darkMq) {
    if (darkMq.addEventListener) darkMq.addEventListener("change", applyTheme);
    else if (darkMq.addListener) darkMq.addListener(applyTheme);
  }
  function loadDb() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return defaultDb();
    try { return normalizeDb(JSON.parse(raw)); } catch (e) { return defaultDb(); }
  }
  function saveDb() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
    catch (e) { toast("Không lưu được tiến độ (trình duyệt chặn localStorage?)"); return false; }
  }
  var db = loadDb();
  applyTheme();

  function newCard() { return { state: "new", ease: 2.5, interval: 0, due: 0, reps: 0, lapses: 0, last: 0 }; }
  function cardOf(id) { return db.cards[id] || newCard(); }
  function cardState(id) { var c = db.cards[id]; return c && c.state ? c.state : "new"; }
  function isNewItem(it) { return cardState(it.id) === "new"; }
  function isDue(id, now) { var c = db.cards[id]; return !!c && c.state !== "new" && c.due <= now; }

  // ---------- trần ôn mỗi ngày ----------
  function reviewCap() { var c = capVal(db.settings.reviewCap); return c == null ? REVIEW_CAP_DEFAULT : c; }
  function reviewsOn(key) { var d = db.daily && db.daily[key]; return d ? Number(d.reviews) || 0 : 0; }
  function reviewsToday() { return reviewsOn(dateKey(new Date())); }
  // Số lượt ôn còn được làm hôm nay (Infinity = không giới hạn).
  function reviewRoom() { var c = reviewCap(); return c > 0 ? Math.max(0, c - reviewsToday()) : Infinity; }
  function capReached() { return reviewRoom() <= 0; }
  function countReview() {
    if (!db.daily || typeof db.daily !== "object") db.daily = {};
    var k = dateKey(new Date());
    db.daily[k] = { reviews: reviewsOn(k) + 1 };
    var keys = Object.keys(db.daily).sort();
    if (keys.length > DAILY_KEEP) keys.slice(0, keys.length - DAILY_KEEP).forEach(function (x) { delete db.daily[x]; });
  }

  function selectedDecks() {
    var sel = db.settings.selectedDecks;
    return DECKS.filter(function (d) { return sel.indexOf(d.id) >= 0; });
  }

  // ---------- lọc cấp HSK của từ mới (settings.hskLevels) ----------
  // Chỉ lọc TỪ MỚI (thẻ từ chưa học) của 12 chủ đề trong decks/. Thẻ đã học, bài giáo trình, bộ 📝, mẫu câu, thẻ dịch: không lọc.
  // Thiếu trường (dữ liệu / backup cũ) = mọi cấp. 0 = ngoài HSK (khẩu ngữ).
  // (HSK_ALL khai báo ở phần hằng số — normalizeDb dùng tới lúc nạp db)
  var BASE_DECK_IDS = {};
  BASE_DECKS.forEach(function (d) { BASE_DECK_IDS[d.id] = true; });
  function wordLevel(w) { var n = Math.floor(Number(w && w.hsk)); return n >= 1 && n <= 6 ? n : 0; }
  // Mảng cấp hợp lệ (không trùng, xếp tăng) hoặc null nếu không dùng được (rỗng / sai kiểu).
  function hskVal(a) {
    if (!Array.isArray(a)) return null;
    // Chỉ nhận số / chuỗi số không rỗng: null, "", false, " " bị bỏ qua (Number() của chúng = 0, sẽ thành "Ngoài HSK").
    var out = HSK_ALL.filter(function (n) { return a.some(function (x) { return (typeof x === "number" || (typeof x === "string" && x.trim() !== "")) && Number(x) === n; }); });
    return out.length ? out : null;
  }
  function hskLevels() { return hskVal(db.settings.hskLevels) || HSK_ALL; }
  function hskActive() { return hskLevels().length < HSK_ALL.length; }
  // Từ mới bị bộ lọc giấu (chỉ xét thẻ từ của 12 chủ đề; gọi kèm điều kiện "chưa học").
  function hskHidden(it) {
    return it.kind === "word" && !!BASE_DECK_IDS[it.deckId] && hskLevels().indexOf(wordLevel(it.data)) < 0;
  }
  // Số từ chủ đề theo cấp (đếm từ dữ liệu): [cấp] -> { all, fresh }.
  function hskStats() {
    var r = {}; HSK_ALL.forEach(function (n) { r[n] = { all: 0, fresh: 0 }; });
    ITEMS.forEach(function (it) {
      if (it.kind !== "word" || !BASE_DECK_IDS[it.deckId]) return;
      var x = r[wordLevel(it.data)]; x.all++;
      if (isNewItem(it)) x.fresh++;
    });
    return r;
  }

  // ---------- SRS (SM-2 rút gọn) ----------
  // due của Khó/Nhớ/Dễ tính từ 0h hôm nay + interval ngày, để thẻ luôn tới hạn ngay từ sáng.
  function computeGrade(card, grade, now) {
    var c = {
      state: card.state, ease: card.ease, interval: card.interval,
      due: card.due, reps: card.reps, lapses: card.lapses, last: card.last
    };
    var today = startOfDay(now);
    if (grade === 1) {
      c.lapses += 1; c.interval = 0; c.ease = Math.max(1.3, round2(c.ease - 0.2));
      c.state = "learning"; c.due = now;
    } else if (grade === 2) {
      c.interval = c.interval === 0 ? 1 : Math.max(1, Math.round(c.interval * 1.2));
      c.ease = Math.max(1.3, round2(c.ease - 0.15));
      c.due = today + c.interval * DAY_MS; c.state = "review";
    } else if (grade === 3) {
      c.interval = c.interval === 0 ? 1 : c.interval === 1 ? 3 : Math.round(c.interval * c.ease);
      c.due = today + c.interval * DAY_MS; c.state = "review";
    } else {
      c.interval = c.interval === 0 ? 3 : Math.round(Math.max(c.interval * c.ease * 1.3, c.interval + 2));
      c.ease = round2(c.ease + 0.15);
      c.due = today + c.interval * DAY_MS; c.state = "review";
    }
    c.reps += 1; c.last = now;
    return c;
  }
  function intervalLabel(card, grade) {
    var c = computeGrade(card, grade, Date.now());
    if (grade === 1) return "lát nữa";
    return c.interval + " ngày";
  }
  function applyGrade(id, grade) {
    db.cards[id] = computeGrade(cardOf(id), grade, Date.now());
    saveDb();
  }

  // ---------- phát âm ----------
  var zhVoice = null;
  function pickVoice() {
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      var best = null, any = null;
      for (var i = 0; i < vs.length; i++) {
        var lang = String(vs[i].lang || "").replace("_", "-");
        if (/^zh-CN/i.test(lang) || /^cmn/i.test(lang)) { best = vs[i]; break; }
        if (!any && /^zh/i.test(lang)) any = vs[i];
      }
      zhVoice = best || any;
    } catch (e) { zhVoice = null; }
  }
  if (window.speechSynthesis) {
    pickVoice();
    try {
      if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
      else window.speechSynthesis.onvoiceschanged = pickVoice;
    } catch (e) { /* bỏ qua */ }
  }
  function speak(text) {
    if (!text || !window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
    if (!zhVoice) pickVoice();
    recPlayerStop();
    if (reading) stopReading();
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = "zh-CN";
      u.rate = 0.9;
      if (zhVoice) u.voice = zhVoice;
      window.speechSynthesis.speak(u);
    } catch (e) { /* không có giọng thì thôi */ }
  }
  // Đọc cả bài khóa: đọc lần lượt từng dòng (nối onend), tô dòng đang đọc. Bấm lại / 🔊 khác / rời màn = dừng.
  var reading = null;   // { key, u } đang đọc
  var readToken = 0;
  function markReadLine(elId) {
    var olds = app.querySelectorAll(".tline.reading");
    for (var i = 0; i < olds.length; i++) olds[i].classList.remove("reading");
    var el = elId ? byId(elId) : null;
    if (el) {
      el.classList.add("reading");
      try { el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) { /* bỏ qua */ }
    }
  }
  function updateReadUi() {
    var btns = app.querySelectorAll('[data-action="ls-read"]');
    for (var i = 0; i < btns.length; i++) {
      var on = !!reading && reading.key === btns[i].getAttribute("data-t");
      btns[i].textContent = on ? "⏹ Dừng đọc" : "▶ Đọc cả bài";
      btns[i].className = "small-btn" + (on ? " primary" : "");
    }
  }
  function stopReading() {
    readToken++;
    var was = !!reading;
    reading = null;
    if (was) { try { window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } }
    markReadLine(null); updateReadUi();
  }
  function readAll(key, lines) {
    if (reading && reading.key === key) { stopReading(); return; }
    stopReading();
    recPlayerStop();
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") { toast("Trình duyệt không hỗ trợ đọc"); return; }
    if (!lines.length) return;
    if (!zhVoice) pickVoice();
    try { window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ }
    var token = ++readToken;
    reading = { key: key, u: null };
    var play = function (i) {
      if (token !== readToken) return;
      if (i >= lines.length) { stopReading(); return; }
      reading.elId = lines[i].elId;
      markReadLine(lines[i].elId);
      var u = new SpeechSynthesisUtterance(String(lines[i].text));
      u.lang = "zh-CN"; u.rate = 0.9;
      if (zhVoice) u.voice = zhVoice;
      u.onend = function () { if (token === readToken) setTimeout(function () { play(i + 1); }, 250); };
      u.onerror = u.onend;
      reading.u = u; // giữ tham chiếu để Chrome không thu gom mất onend
      try { window.speechSynthesis.speak(u); } catch (e) { stopReading(); }
    };
    updateReadUi();
    play(0);
  }

  // ---------- nói: ghi âm + nhận giọng (thẻ nói trong phiên, nhại bài khóa) ----------
  // Chỉ 1 bản ghi tại một thời điểm (REC). Bản ghi chỉ giữ trong bộ nhớ (blob URL), không lưu localStorage.
  // owner = "card:<id thẻ>" (phiên học) | "ln:<id bài>:<ti>-<li>" (nhại bài khóa). Đổi thẻ / đổi câu / rời màn = recRelease().
  var REC_MAX_MS = 30000;
  var REC = { token: 0, owner: "", state: "idle" }; // state: idle | starting | recording | stopping | done | error
  var micDenied = false; // người dùng đã từ chối quyền mic trong lần mở trang này
  function micSupported() {
    return !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function" && typeof window.MediaRecorder === "function");
  }
  function srCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  function scoringOn() { return !!srCtor() && db.settings.speechScore !== false; }
  function stopTracks(stream) {
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* bỏ qua */ }
  }
  function recIsLive() { return REC.state === "starting" || REC.state === "recording"; }
  function recRelease() {
    REC.token++;
    clearInterval(REC.tick);
    try { if (REC.recorder && REC.recorder.state !== "inactive") REC.recorder.stop(); } catch (e) { /* bỏ qua */ }
    stopTracks(REC.stream);
    try { if (REC.sr) REC.sr.abort(); } catch (e) { /* bỏ qua */ }
    if (REC.player) { try { REC.player.pause(); REC.player.removeAttribute("src"); REC.player.load(); } catch (e) { /* bỏ qua */ } }
    if (REC.url) { try { URL.revokeObjectURL(REC.url); } catch (e) { /* bỏ qua */ } }

  }
  // Dừng "Nghe lại mình" đang phát (giữ src để bấm lại vẫn phát được) — trước khi phát mẫu / đọc cả bài.
  function recPlayerStop() { if (typeof REC !== "undefined" && REC && REC.player) { try { REC.player.pause(); } catch (e) { /* bỏ qua */ } } }
  function micErrMsg(e) {
    var n = e && e.name;
    if (n === "NotAllowedError" || n === "SecurityError" || n === "PermissionDeniedError") { micDenied = true; return "Mic bị chặn (cho phép mic trong cài đặt trình duyệt)"; }
    if (n === "NotFoundError" || n === "DevicesNotFoundError" || n === "OverconstrainedError") return "Không thấy mic";
    if (n === "NotReadableError" || n === "TrackStartError") return "Mic đang bị app khác dùng";
    return "Không ghi âm được";

  function mergeDb(cur, inc) {
    var out = normalizeDb(cur);

    Object.keys(inc.cards).forEach(function (id) {
      var a = out.cards[id], b = inc.cards[id];
      if (!a) { out.cards[id] = b; added++; return; }
      if (b.last > a.last || (b.last === a.last && b.reps > a.reps)) { out.cards[id] = b; updated++; }
    });

    out.sessions = out.sessions.concat(inc.sessions).filter(function (s) {

    }).sort(function (x, y) { return String(x.date) < String(y.date) ? -1 : String(x.date) > String(y.date) ? 1 : 0; });

  function openExam(id) {

    if (examPending === id) return;

      return items.length ? { key: p.key, name: p.name, type: p.type, banks: p.banks, items: items } : null;
    }).filter(Boolean);

    parts.forEach(function (p, pi) { p.items.forEach(function (it, ii) { flat.push({ p: pi, i: ii }); }); });
    if (!flat.length) { toast("Đề " + id + " không có câu nào"); view = "exams"; render(); return; }
    var prog = exProg(id), pos = 0;
    if (prog.last) flat.forEach(function (f, k) { if (parts[f.p].items[f.i].n === prog.last) pos = k; });

  // ---------- luyện đề: điều hướng & chấm ----------
  function curRef() { return exam.flat[exam.pos]; }

    var prog = exProg(exam.id); prog.last = curItem().n; saveExdb();

  // seek: nhảy từ tab phần / ô số câu → tua audio tới đoạn của câu (bấm Trước/Sau thì không tua,
  // để audio đang phát không bị kéo lùi).

    for (var k = 0; k < exam.flat.length; k++) {

  }
  // Mốc giây đầu đoạn hội thoại của câu đang mở (it.t). Câu 36-45 đi theo cặp chung một đoạn nên
  // câu thứ hai không có t → lùi về câu gần nhất có t trong cùng phần.
  function itemAudioT() {
    if (!exam) return null;
    var p = exam.flat[exam.pos].p;
    for (var k = exam.pos; k >= 0 && exam.flat[k].p === p; k--) {
      var f = exam.flat[k], t = exam.parts[f.p].items[f.i].t;

      audioEl.addEventListener("loadedmetadata", function () {
        if (view === "exam" && exam && exam.id === id && exam.pos === pos) seekToItem(play);

      return;
    }
    var d = isFinite(audioEl.duration) ? audioEl.duration : Infinity;

  function normSent(s) { return String(s == null ? "" : s).replace(/[\s，。！？、；：,.!?;:“”‘’"'（）()《》〈〉【】…—\-·~～]/g, ""); }
  // Viết 1: đáp án gốc đôi khi chấp nhận cả câu đảo ("Đáp án gốc cũng chấp nhận 对这个城市我很熟悉。").
  // Nhận: answer + mảng alt (nếu dữ liệu có) + câu chữ Hán đứng sau chữ "chấp nhận" trong explain,
  // nhưng chỉ khi câu đó dùng đúng y các mảnh đề cho (tránh nhận nhầm câu ví dụ khác).
  function buildAnswers(it) {
    var out = [normSent(it.answer)];

    var want = bag((Array.isArray(it.words) ? it.words : []).join(""));
    var cands = Array.isArray(it.alt) ? it.alt.slice() : [];
    var ex = String(it.explain || ""), k = ex.search(/chấp nhận/i);

    prog.ans[it.n] = { pick: pick, ok: ok }; prog.last = it.n; saveExdb();

  // Màn hẹp: hàng tab (.ptabs) cuộn ngang — kéo tab đang chọn vào giữa tầm nhìn (màn đề, màn giáo trình).

  function examKey(e) {
    if (e.defaultPrevented) return; // phím đã được listener trước (phiên) xử lý, có thể vừa đổi màn
    var t = e.target;
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    // Đang trong phiên 45 phút (khúc 3): Esc = Về phiên (đồng hồ vẫn chạy).
    if (session && key === "Escape" && !e.repeat && (view === "exams" || view === "exam-loading" || view === "exam")) {
      e.preventDefault(); sessBack(); return;
    }
    // Danh sách đề / đang tải: Esc về trang chủ (giống màn Giáo trình).
    if ((view === "exams" || view === "exam-loading") && key === "Escape" && !e.repeat) {
      e.preventDefault(); examPending = null; view = "home"; render(); return;
    }
    if (view !== "exam" || !exam) return;
    if (key === "ArrowLeft") { e.preventDefault(); examMove(-1); return; }
    if (key === "ArrowRight") { e.preventDefault(); examMove(1); return; }
    if (key === "Escape") { e.preventDefault(); leaveExam(); return; }
    if (key === " " || key === "Spacebar") {
      if (!hasAudio()) return; // đề không audio: để Space cuộn trang như bình thường
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
      if (!e.repeat) toggleAudio();
      return;
    }
    if (e.repeat) return;
    var it = curItem(), type = partType(curPart()), a = curAns();
    if (key === "Enter") {
      if (tag === "button") return; // Enter trên nút đang focus = bấm nút đó
      e.preventDefault();
      if (a) return;
      if (type === "order" || type === "build") examCheck();
      else if (type === "free" && !exam.freeShown[it.n]) { exam.freeShown[it.n] = true; renderExam(true); }
      return;
    }
    if (key === "Backspace") {
      if (a) return;
      if (type === "order" && exam.order) { e.preventDefault(); exam.order = exam.order.slice(0, -1); renderExam(true); }
      else if (type === "build" && exam.build.length) { e.preventDefault(); exam.build.pop(); renderExam(true); }
      return;
    }
    if (a || key.length !== 1) return;
    var up = key.toUpperCase();
    if (type === "tf") {
      if (key === "1") examPick(true); else if (key === "2") examPick(false);
    } else if (type === "mc" || type === "cloze") {
      var ks = optionKeys(it, type);
      var pick = /^[1-9]$/.test(key) ? ks[Number(key) - 1] : ks.indexOf(up) >= 0 ? up : null;
      if (pick && type === "cloze") { var bk = bankFor(curPart(), it); if (bk && bk.example === pick) pick = null; }
      if (pick) { e.preventDefault(); examPick(pick); }
    } else if (type === "order") {
      if (it.segments && it.segments[up]) { e.preventDefault(); examOrderAdd(up); }
    } else if (type === "build") {
      if (/^[1-9]$/.test(key)) { e.preventDefault(); examBuildAdd(Number(key) - 1); }
    }
  }

      '</div>';

  // ---------- HTML: thống kê ----------
  function statsHtml() {
    var totals = { "new": 0, learning: 0, review: 0 };
    var rows = DECKS.map(function (d) {
      var c = { "new": 0, learning: 0, review: 0 };
      ITEMS.forEach(function (it) {
        if (it.deckId !== d.id) return;
        var s = cardState(it.id);
        if (!(s in c)) s = "new";
        c[s]++;
      });
      totals["new"] += c["new"]; totals.learning += c.learning; totals.review += c.review;
      return '<tr><td>' + esc(d.emoji || "📘") + ' ' + esc(d.title || d.id) + '</td>' +
        '<td class="num">' + c["new"] + '</td><td class="num">' + c.learning + '</td><td class="num">' + c.review + '</td></tr>';
    }).join("");
    var sess = db.sessions.slice(-14).reverse();
    var sessRows = sess.length ? sess.map(function (s) {
      return '<tr><td>' + esc(fmtDate(s.date)) + '</td><td class="num">' + esc(s.minutes) + ' phút</td><td class="num">' + esc(s.cards) + ' thẻ' + (Number(s.lines) > 0 ? ' · ' + esc(s.lines) + ' câu' : "") + '</td></tr>';
    }).join("") : '<tr><td colspan="3" class="muted">Chưa có phiên nào. Bấm Học 45 phút đi.</td></tr>';
    // Lượt ôn 14 ngày gần nhất (db.daily), thanh ngắn tỉ lệ theo trần ôn / ngày nhiều nhất.
    var cap = reviewCap(), days = [], dd = new Date(), mx = 0;
    for (var di = 0; di < 14; di++) {
      var k = dateKey(dd), v = reviewsOn(k);
      days.push({ k: k, v: v }); if (v > mx) mx = v;
      dd.setDate(dd.getDate() - 1);
    }
    var scale = Math.max(mx, cap || 0, 1);
    var dayRows = mx ? days.map(function (d, i) {
      var full = cap > 0 && d.v >= cap;
      return '<tr><td>' + (i === 0 ? "Hôm nay" : esc(fmtDate(d.k))) + '</td>' +
        '<td class="rvcell"><span class="rvbar"><i' + (full ? ' class="full"' : "") + ' style="width:' + Math.round(d.v / scale * 100) + '%"></i></span></td>' +
        '<td class="num">' + d.v + '</td></tr>';
    }).join("") : '<tr><td colspan="3" class="muted">Chưa có lượt ôn nào.</td></tr>';
    return '<div class="wrap">' +
      '<div class="row-between"><h1>Thống kê</h1><button class="small-btn" data-action="home">← Trang chủ</button></div>' +
      '<section class="stats3">' +
        '<div class="stat"><b>' + streak() + '</b><span>ngày liên tiếp</span></div>' +
        '<div class="stat"><b>' + totals.learning + '</b><span>đang học</span></div>' +
        '<div class="stat"><b>' + totals.review + '</b><span>đã thuộc (ôn)</span></div>' +
      '</section>' +
      '<section class="box"><h2>Theo chủ đề</h2><table><thead><tr><th>Chủ đề</th><th class="num">Mới</th><th class="num">Đang học</th><th class="num">Ôn</th></tr></thead>' +
        '<tbody>' + rows + '<tr><th>Tổng</th><th class="num">' + totals["new"] + '</th><th class="num">' + totals.learning + '</th><th class="num">' + totals.review + '</th></tr></tbody></table></section>' +
      '<section class="box"><div class="row-between"><h2>Lượt ôn mỗi ngày</h2><span class="muted small">' + (cap ? "trần " + cap + "/ngày" : "không giới hạn") + '</span></div>' +
        '<table class="rvtable"><tbody>' + dayRows + '</tbody></table></section>' +
      '<section class="box"><h2>14 phiên gần nhất</h2><table><tbody>' + sessRows + '</tbody></table></section>' +
      '</div>';
  }

  // ---------- HTML: phiên học ----------
  function sessionShellHtml() {
    var blk = !!(session && session.blocks);
    return '<div class="wrap">' +
      '<div class="bar' + (blk ? " blkbar" : "") + '">' +
        '<div class="bar-top"><span id="clock" class="clock">00:00 / 45:00</span><button class="small-btn" data-action="end">Kết thúc</button></div>' +
        (blk ? '<div id="blks" class="blks">' + blkSegsHtml() + '</div>' +
            '<div class="bar-sub"><div id="counts" class="muted small"></div>' +
            '<button id="blkNext" class="small-btn blknext" data-action="blk-next"' + (session.block >= BLOCKS.length - 1 ? " hidden" : "") + '>Sang khúc sau ›</button></div>'
          : '<div class="track"><div id="prog" class="fill"></div></div>' +
            '<div id="counts" class="muted small"></div>') +
        '<div id="banner45" class="banner"' + (session && session.shown45 ? "" : " hidden") + '>Đủ 45 phút rồi 🎉 muốn chơi tiếp thì cứ tiếp</div>' +
      '</div>' +
      '<div id="cardArea"></div>' +
      '</div>';
  }
  function tagRow(it, label, cls) {
    var w = it.data;
    return '<div class="tags"><span class="tag ' + cls + '">' + label + '</span>' +
      (w.hsk ? '<span class="tag">HSK ' + esc(w.hsk) + '</span>' : "") +
      (w.pos ? '<span class="tag">' + esc(w.pos) + '</span>' : "") +
      (w.src === "ai" ? '<span class="tag ai" title="Từ bổ sung (không có trong text slide)">bổ sung</span>' : "") +
      '<span class="tag">' + esc(it.deck.emoji || "") + ' ' + esc(it.deck.title || it.deckId) + '</span></div>';
  }
  // Chữ Hán to trên thẻ: mỗi chữ một ô 田 riêng (đường kẻ qua tâm từng chữ, không qua khe giữa hai chữ).
  // Từ dài (≥5 ký tự, vd. 摸不着头脑, 只有……才……) thu nhỏ để vẫn nằm trên một hàng ở điện thoại.
  function bigHanziHtml(text) {
    text = String(text || "");
    return '<div class="hanzi zh' + (text.length >= 5 ? " long" : "") + '">' +
      esc(text).replace(/[㐀-鿿豈-﫿]/g, function (ch) { return '<span class="tz">' + ch + '</span>'; }) + '</div>';
  }
  function speakBtn(text, small) {
    return '<button class="spk' + (small ? " sm" : "") + '" data-action="speak" data-text="' + esc(text) + '" title="Nghe">🔊</button>';
  }
  function exampleHtml(ex) {
    if (!ex || !ex.zh) return "";
    return '<div class="ex"><div class="ex-zh zh">' + esc(ex.zh) + ' ' + speakBtn(ex.zh, true) + '</div>' +
      (ex.pinyin ? '<div class="ex-py">' + esc(ex.pinyin) + '</div>' : "") + (ex.vi ? '<div class="ex-vi">' + esc(ex.vi) + '</div>' : "") + '</div>';
  }
  function hvHtml(w) {
    return w.hanviet ? '<div class="hanviet">Hán Việt: <b>' + esc(w.hanviet) + '</b></div>' : "";
  }
  function chietTuHtml(w) {
    return w.chiettu ? '<div class="chiettu"><div class="label">Chiết tự</div><div>' + esc(w.chiettu) + '</div></div>' : "";
  }
  function pickExample(it) {
    var exs = Array.isArray(it.data.examples) ? it.data.examples : [];
    if (!exs.length) return null;
    return exs[cardOf(it.id).reps % exs.length];
  }
  function hintHtml(text) { return '<div class="hint">' + text + '</div>'; }
  function grades4Html(it) {
    var c = cardOf(it.id);
    return '<div class="grades dock">' +
      '<button class="g1" data-action="grade" data-grade="1">Quên<small>1 · ' + intervalLabel(c, 1) + '</small></button>' +
      '<button class="g2" data-action="grade" data-grade="2">Khó<small>2 · ' + intervalLabel(c, 2) + '</small></button>' +
      '<button class="g3" data-action="grade" data-grade="3">Nhớ<small>3 · ' + intervalLabel(c, 3) + '</small></button>' +
      '<button class="g4" data-action="grade" data-grade="4">Dễ<small>4 · ' + intervalLabel(c, 4) + '</small></button>' +
      '</div>' + hintHtml('<kbd>1-4</kbd> chấm · <kbd>Space</kbd> = Nhớ');
  }
  function grades2Html(it) {
    var c = cardOf(it.id);
    return '<div class="grades two dock">' +
      '<button class="g1" data-action="grade" data-grade="1">Quên<small>1 · ' + intervalLabel(c, 1) + '</small></button>' +
      '<button class="g3" data-action="grade" data-grade="3">Nhớ<small>3 · ' + intervalLabel(c, 3) + '</small></button>' +
      '</div>' + hintHtml('<kbd>1</kbd> Quên · <kbd>3</kbd> / <kbd>Space</kbd> Nhớ');
  }
  function flipBtnHtml(extraHint) {
    return '<div class="actions dock"><button class="primary big" data-action="flip">Lật</button></div>' +
      hintHtml((extraHint || "") + '<kbd>Space</kbd> / <kbd>Enter</kbd> lật · <kbd>Esc</kbd> thoát');
  }
  function padHtml(wide) {
    if (!db.settings.drawPad) return "";
    if (wide) return '<div class="pad-wrap"><canvas id="pad" class="pad wide" width="660" height="220"></canvas>' +
      '<button class="small-btn" data-action="clear-pad">Xóa bảng</button></div>';
    return '<div class="pad-wrap"><canvas id="pad" class="pad" width="240" height="240"></canvas>' +
      '<button class="small-btn" data-action="clear-pad">Xóa</button></div>';
  }
  function newWordHtml(it) {
    var w = it.data;
    var exs = (Array.isArray(w.examples) ? w.examples : []).slice(0, 2).map(exampleHtml).join("");
    return '<div class="card">' + tagRow(it, "Từ mới", "new") +
      bigHanziHtml(w.hanzi) + '<div class="center">' + speakBtn(w.hanzi) + '</div>' +
      (w.pinyin ? '<div class="pinyin">' + esc(w.pinyin) + '</div>' : "") +
      hvHtml(w) +
      (w.meaning ? '<div class="meaning">' + esc(w.meaning) + '</div>' : "") +
      chietTuHtml(w) +
      (exs ? '<div class="examples">' + exs + '</div>' : "") +
      (w.note ? '<div class="note">💡 ' + esc(w.note) + '</div>' : "") +
      '<div class="actions dock"><button class="primary big" data-action="understood">Đã hiểu</button></div>' +
      hintHtml('<kbd>Enter</kbd> đã hiểu · thẻ sẽ quay lại sau ~8 thẻ') +
      '</div>';
  }
  function recogHtml(it) {
    var w = it.data;
    var head = tagRow(it, "Nhận mặt chữ", "recog") +
      bigHanziHtml(w.hanzi) + '<div class="center">' + speakBtn(w.hanzi) + '</div>';
    if (!session.flipped) {
      return '<div class="card">' + head + '<p class="muted center" style="margin-top:14px">Đọc được không? Nghĩa là gì?</p>' + flipBtnHtml() + '</div>';
    }
    return '<div class="card">' + head +
      (w.pinyin ? '<div class="pinyin">' + esc(w.pinyin) + '</div>' : "") +
      hvHtml(w) +
      (w.meaning ? '<div class="meaning">' + esc(w.meaning) + '</div>' : "") +
      chietTuHtml(w) +
      '<div class="examples">' + exampleHtml(pickExample(it)) + '</div>' +
      grades4Html(it) + '</div>';
  }
  function recallHtml(it) {
    var w = it.data;
    var head = tagRow(it, "Nghĩa → chữ", "recall") +
      '<div class="meaning front">' + esc(w.meaning) + '</div>' +
      (w.pos ? '<div class="pos">' + esc(w.pos) + '</div>' : "");
    if (!session.flipped) {
      var hint = !w.hanviet ? "" : session.hint ? hvHtml(w)
        : '<div class="center"><button class="small-btn" data-action="hint">Gợi ý Hán Việt</button></div>';
      return '<div class="card">' + head + hint + padHtml() + flipBtnHtml() + '</div>';
    }
    return '<div class="card">' + head +
      bigHanziHtml(w.hanzi) + '<div class="center">' + speakBtn(w.hanzi) + '</div>' +
      (w.pinyin ? '<div class="pinyin">' + esc(w.pinyin) + '</div>' : "") +
      hvHtml(w) +
      padHtml() +
      '<div class="examples">' + exampleHtml(pickExample(it)) + '</div>' +
      grades4Html(it) + '</div>';
  }
  function phraseHtml(it) {
    var p = it.data;
    // Thẻ nói: mặt trước = tình huống + câu Việt, tự nói to (ghi âm nếu có mic); mặt sau = câu mẫu tô đúng/thiếu.
    var head = tagRow(it, "🗣 Thẻ nói", "phrase") +
      (p.when ? '<div class="when">' + esc(p.when) + '</div>' : "") +
      '<div class="meaning front">' + esc(p.vi) + '</div>';
    if (!session.flipped) {
      return '<div class="card">' + head + '<p class="say">Nói to câu tiếng Trung</p>' +
        '<div id="vbox" class="vbox">' + phraseVoiceInner(it) + '</div>' +
        flipBtnHtml(micSupported() ? '<kbd>R</kbd> ghi âm / dừng · ' : "") + '</div>';
    }
    return '<div class="card">' + head +
      '<div id="vbox" class="vbox back">' + phraseVoiceInner(it) + '</div>' +
      grades2Html(it) + '</div>';
  }
  // Thẻ Dịch câu: mặt trước = câu Việt + từ khóa đã học (nghĩa; chữ Hán sau "Gợi ý") + ô gõ + bảng viết tay;
  // mặt sau (Kiểm tra) = câu đã gõ tô đúng/sai, câu mẫu tô đúng/thiếu + pinyin + 🔊, % khớp, tự chấm Chưa được / Được.
  function transHtml(it) {
    var d = it.data, keys = transKeys(it), open = session.hint || session.flipped;
    var head = tagRow(it, "✍ Dịch câu", "trans") +
      (d.when ? '<div class="when">' + esc(d.when) + '</div>' : "") +
      '<div class="meaning front trvi">' + esc(d.vi) + '</div>';
    var kh = !keys.length ? "" : '<div class="trkeys"><span class="trklab">Từ đã học</span>' + keys.map(function (k) {
      return '<span class="trk">' + (open ? '<b class="zh">' + esc(k.hanzi) + '</b>' : "") + esc(shortMeaning(k.meaning)) + '</span>';
    }).join("") + (open ? "" : '<button class="small-btn trhint" data-action="hint">Gợi ý chữ Hán</button>') + '</div>';
    if (!session.flipped) {
      return '<div class="card trcard">' + head + '<p class="say">Viết câu này bằng tiếng Trung</p>' + kh +
        '<form id="trForm" class="trform" action="#" autocomplete="off"><input id="trInput" class="trin zh" type="text" lang="zh-CN" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"' +
        ' aria-label="Gõ câu tiếng Trung" placeholder="Gõ chữ Hán vào đây…" value="' + esc(session.trTyped || "") + '"></form>' +
        padHtml(true) +
        '<div class="actions dock"><button class="primary big" data-action="flip">Kiểm tra</button></div>' +
        hintHtml('<kbd>Enter</kbd> kiểm tra · <kbd>Esc</kbd> thoát') + '</div>';
    }
    var typed = String(session.trTyped || "").trim(), cmp = typed && normSpeech(typed) ? compareSpeech(d.zh, typed) : null;
    var lv = cmp ? (cmp.pct >= 85 ? "good" : cmp.pct >= 50 ? "mid" : "low") : "";
    var c = cardOf(it.id);
    return '<div class="card trcard">' + head + kh +
      '<div class="vcmp trres">' +
        (cmp ? '<div class="trrow"><span class="trlab">Bạn viết</span><span class="trzh zh">' + markedZhHtml(typed, { ok: cmp.okH }) + '</span></div>' : "") +
        '<div class="trrow"><span class="trlab">Câu mẫu</span><span class="trzh zh">' + markedZhHtml(d.zh, cmp) + '</span>' + speakBtn(d.zh, true) + '</div>' +
        (d.pinyin ? '<div class="trpy">' + esc(d.pinyin) + '</div>' : "") +
        (cmp ? '<div class="vpct ' + lv + '">Khớp ' + cmp.pct + '%</div>' : "") +
        '<div class="trnote">' + (cmp ? "Câu khác mẫu vẫn có thể đúng — tự chấm" : "So chữ viết tay (hoặc câu trong đầu) với câu mẫu rồi tự chấm") + '</div>' +
      '</div>' +
      padHtml(true) +
      '<div class="grades two dock">' +
        '<button class="g1" data-action="grade" data-grade="1">Chưa được<small>1 · ' + intervalLabel(c, 1) + '</small></button>' +
        '<button class="g3" data-action="grade" data-grade="3">Được<small>3 · ' + intervalLabel(c, 3) + '</small></button>' +
      '</div>' + hintHtml('<kbd>1</kbd> Chưa được · <kbd>3</kbd> / <kbd>Space</kbd> Được') + '</div>';
  }
  function refBtnHtml(text) {
    return '<button class="spk vref" data-action="speak" data-text="' + esc(text) + '" title="Nghe câu mẫu">🔊 Mẫu</button>';
  }
  function phraseVoiceInner(it) {
    var p = it.data, owner = "card:" + it.id;
    if (!session.flipped) return '<div class="vctl">' + micBtnHtml(owner, "Ghi âm") + '</div>' + voiceStatusHtml(owner, p.zh, false);
    return '<div class="hanzi mid zh">' + markedZhHtml(p.zh, voiceCmp(owner, p.zh)) + '</div>' +
      '<div class="pinyin">' + esc(p.pinyin) + '</div>' +
      '<div class="vctl">' + refBtnHtml(p.zh) + playBtnHtml(owner) + micBtnHtml(owner, "Nói thử", true) + '</div>' +

  // Vẽ lại riêng khối #vbox (không vẽ lại cả thẻ / cả bài → không nhảy cuộn, không mất trạng thái khác).
  function refreshVoice() {
    var el = byId("vbox");
    if (!el) return;
    if (view === "session" && session && session.current && session.current.kind === "phrase") el.innerHTML = phraseVoiceInner(session.current);
    else if (view === "lesson" && lesson && lesson.shadow) el.innerHTML = shadowInner();

  function doneHtml() {
    var minutes = Math.round(session.elapsed / 60);

    if (!key) return;
    if (key === "newPerSession") db.settings.newPerSession = Number(t.value) || 10;
    else if (key === "reviewCap") { var cv = capVal(t.value); db.settings.reviewCap = cv == null ? REVIEW_CAP_DEFAULT : cv; }
    else if (key === "drawPad") db.settings.drawPad = !!t.checked;
    else if (key === "autoSpeak") db.settings.autoSpeak = !!t.checked;
    else if (key === "speechScore") db.settings.speechScore = !!t.checked;
    else if (key === "sessionBlocks") db.settings.sessionBlocks = !!t.checked;
    else if (key === "theme") { db.settings.theme = themeVal(t.value) || "dem"; applyTheme(); }
    saveDb(); render();
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "auSeek" && audioEl) { seekHold = true; audioEl.currentTime = Number(t.value) || 0; return; }
    if (t.id === "exFree" && exam) exam.free[t.getAttribute("data-n")] = t.value;
    if (t.id === "trInput" && session) session.trTyped = t.value;
  });
  // Ô gõ thẻ Dịch câu nằm trong form: phím "Xong/Enter" của bàn phím điện thoại (có máy không gửi keydown Enter) = Kiểm tra.
  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target && e.target.id === "trForm" && view === "session" && session) flip();
  });
  // Listener gắn 1 lần trên #app (delegation) nên đổi thẻ / vẽ lại canvas không rò listener.
  if (window.PointerEvent) {
    app.addEventListener("pointerdown", onPointerDown);
    app.addEventListener("pointermove", onPointerMove);
    app.addEventListener("pointerup", onPointerUp);
    app.addEventListener("pointercancel", onPointerUp);
  } else {
    app.addEventListener("touchstart", onTouchStart, { passive: false });
    app.addEventListener("touchmove", onTouchMove, { passive: false });
    app.addEventListener("touchend", onPadEnd);
    app.addEventListener("touchcancel", onPadEnd);
    app.addEventListener("mousedown", onMouseDown);
    app.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onPadEnd);
  }

  document.addEventListener("keydown", function (e) {
    if (view !== "session" || !session) return;
    var t = e.target;
    // Ô gõ của thẻ Dịch câu: Enter = Kiểm tra (trừ lúc bộ gõ Trung đang ghép chữ), Esc = rời ô; phím khác (Space…) gõ bình thường.
    if (t && t.id === "trInput") {
      if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!e.repeat) flip(); }
      else if (e.key === "Escape") { e.preventDefault(); t.blur(); }
      return;
    }
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var isSpace = key === " " || key === "Spacebar";
    // Space không cuộn trang; Space/Enter không "bấm" nút đang focus (vd. nút Kết thúc) thay cho phím tắt.
    if (isSpace || key === "Enter") {
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
    }
    // Giữ phím sẽ auto-repeat: chặn để Space giữ lâu không vừa lật vừa chấm Nhớ.
    if (e.repeat) { e.preventDefault(); return; }
    // Phím đã xử lý ở đây mà làm đổi màn (Esc, chuyển khúc, mở bài/đề) thì chặn luôn, không để examKey/lessonKey
    // (gắn sau, cùng document) xử lý lại phím đó ở màn mới.
    if (key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); escapeSession(); return; }
    var it = session.current;
    if (!it) {
      if (session.blocks && session.gate != null) { if (key === "Enter" || isSpace) { e.stopImmediatePropagation(); blkGo(); } return; } // thẻ chuyển khúc
      if (session.blocks) { // khúc 3: màn chọn
        if (key === "1") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenLesson(); }
        else if (key === "2") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenExam(); }
        else if (key === "Enter" && session.elapsed >= TARGET_SEC) endSession(true);
        return;
      }
      if (key === "Enter") endSession(true);
      return;
    }
    var mode = modeOf(it);
    if ((key === "r" || key === "R") && mode === "phrase" && micSupported()) { e.preventDefault(); recToggle("card:" + it.id); return; }
    if (isSpace) {
      if (mode === "new") return;
      if (!session.flipped) flip(); else gradeCurrent(3);
      return;
    }
    if (key === "Enter") {
      e.preventDefault();
      if (mode === "new") understood(); else if (!session.flipped) flip();
      return;
    }
    if (/^[1-4]$/.test(key) && mode !== "new" && session.flipped) {
      e.preventDefault();
      gradeCurrent(Number(key));
    }
  });
  // Phím tắt màn đề: tách riêng, chỉ chạy khi view === "exam" (phím phiên học ở trên chỉ chạy khi view === "session").
  document.addEventListener("keydown", examKey);
  // Phím tắt giáo trình: chỉ chạy khi view === "lesson" / "lessons".
  document.addEventListener("keydown", lessonKey);

  // ---------- khởi động ----------
  // Mở link / tải lại trang: về đúng màn theo hash. Mở mới (chưa có history.state của app) thì dựng
  // mục gốc = Trang chủ (+ mục Danh sách đề/bài nếu link trỏ thẳng vào đề/bài) để Back lùi từng màn.
  function initialRoute() {
    var h = location.hash, st = history.state;
    try {
      if (!(st && typeof st.n === "number")) {
        history.replaceState({ d: 0, n: 0 }, "", baseUrl());
        var mid = /^#exam\//.test(h) ? "#exams" : /^#lesson\//.test(h) ? "#lessons" : "";
        if (mid) history.pushState({ d: 1, n: 1, p: "" }, "", mid);
      }
    } catch (e) { /* bỏ qua */ }
    routeTo(h);
  }
  // Nạp file các bài giáo trình đang học TRƯỚC khi dựng thẻ (chờ xong/lỗi, tối đa 8s).
  function boot() {
    var ids = db.settings.enabledLessons.filter(function (id) { return !!LESSON_META[id]; });
    var started = false;
    var go = function () {
      started = true;
      rebuildItems();
      var miss = ids.filter(function (id) { return !lessonData(id); });
      if (!DECKS.length) app.innerHTML = missingDecksHtml();
      else initialRoute();
      // Gọi sau render() để không bị vẽ đè; bài về muộn thì vòng dự phòng bên dưới dựng lại thẻ.
      if (miss.length) toast("Không tải được " + miss.length + " bài giáo trình (" + miss.join(", ") + ") — từ của bài chưa có trong phiên. Mở bài trong Giáo trình để thử lại.");
    };
    if (!ids.length) { go(); return; }
    app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải giáo trình…</p></div></div>';
    loadLessons(ids, go, 8000);
    // Bài nào về muộn hơn timeout: dựng lại thẻ khi tới, nếu đang ở trang chủ thì vẽ lại.
    ids.forEach(function (id) {
      loadLesson(id, function (ok) {
        if (!ok || !started || DECKS.some(function (d) { return d.id === id; })) return;
        rebuildItems();
        if (view === "home") render();
      });
    });
  }
  boot();
})();
</script>
</body>
</html>
