      // Khóa mới (file backup cũ không có thì bỏ qua): tiến độ đề + từ "📝 Từ trong đề".
      var exAdded = 0, wAdded = 0;
      if (obj.exams && typeof obj.exams === "object") {
        var inc = normalizeExdb(obj.exams);
        Object.keys(inc).forEach(function (id) {
          var cur = EXDB[id] || (EXDB[id] = { ans: {}, last: inc[id].last });
          Object.keys(inc[id].ans).forEach(function (n) {
            if (!cur.ans[n]) { cur.ans[n] = inc[id].ans[n]; exAdded++; }
          });
          if (cur.last == null) cur.last = inc[id].last;
        });
        saveExdb();
      }
      if (Array.isArray(obj.custom)) {
        var hadDeck = CUSTOM.length > 0;
        normalizeCustom(obj.custom).forEach(function (w) {
          if (!customHas(w.hanzi)) { CUSTOM.push(w); wAdded++; }
        });
        // Lựa chọn bộ thẻ lấy từ file: không tự tick lại 📝 nếu người dùng đã bỏ chọn nó.
        if (wAdded) { saveCustom(); afterCustomChange(hadDeck || selFromFile); }
      }
      render();
      toast("Đã nhập backup: +" + r.added + " thẻ mới, cập nhật " + r.updated + " thẻ" +
        (exAdded ? ", +" + exAdded + " câu đề" : "") + (wAdded ? ", +" + wAdded + " từ đề" : "") +
        (lsAdded.length ? ", +" + lsAdded.length + " bài giáo trình" : ""));
    };
    reader.onerror = function () { toast("Không đọc được file"); };
    reader.readAsText(file);
  }

  // ---------- luyện đề HSK4: dữ liệu & tiến độ ----------
  var EXAM_KEY = "hoctrung.exams.v1";
  var EXAM_ID_RE = /^[A-Za-z0-9_.-]+$/;
  var EXAM_INDEX = Array.isArray(window.EXAM_INDEX) ? window.EXAM_INDEX.filter(function (e) { return e && e.id && EXAM_ID_RE.test(e.id); }) : [];
  var PART_TABS = { L1: "Nghe 1", L2: "Nghe 2", L3: "Nghe 3", R1: "Đọc 1", R2: "Đọc 2", R3: "Đọc 3", W1: "Viết 1", W2: "Viết 2" };
  var PART_TYPES = { L1: "tf", L2: "mc", L3: "mc", R1: "cloze", R2: "order", R3: "mc", W1: "build", W2: "free" };

  function normalizeExdb(obj) {
    var out = {};
    if (!obj || typeof obj !== "object") return out;
    Object.keys(obj).forEach(function (id) {
      var e = obj[id];
      if (!e || typeof e !== "object") return;
      var ans = {};
      if (e.ans && typeof e.ans === "object") {
        Object.keys(e.ans).forEach(function (n) {
          var a = e.ans[n];
          if (!a || typeof a !== "object" || !/^\d+$/.test(n)) return;
          ans[n] = { pick: a.pick == null ? null : a.pick, ok: a.ok === true ? true : a.ok === false ? false : null };
        });
      }
      out[id] = { ans: ans, last: Number(e.last) > 0 ? Number(e.last) : null };
    });
    return out;
  }
  function loadExdb() {
    try { return normalizeExdb(JSON.parse(localStorage.getItem(EXAM_KEY) || "{}")); } catch (e) { return {}; }
  }
  function saveExdb() {
    try { localStorage.setItem(EXAM_KEY, JSON.stringify(EXDB)); return true; }
    catch (e) { toast("Không lưu được tiến độ đề (trình duyệt chặn localStorage?)"); return false; }
  }
  var EXDB = loadExdb();
  function exProg(id) { return EXDB[id] || (EXDB[id] = { ans: {}, last: null }); }
  function exStats(id) {
    var r = { done: 0, ok: 0 }, e = EXDB[id];
    if (e) Object.keys(e.ans).forEach(function (n) { r.done++; if (e.ans[n].ok === true) r.ok++; });
    return r;
  }

  // Từ "+ Ôn" → bộ 📝; deck ảo dựng lại ngay, lần đầu xuất hiện thì tự tick chọn.
  function afterCustomChange(hadDeck) {
    rebuildItems();
    if (!hadDeck && CUSTOM.length && db.settings.selectedDecks.indexOf(CUSTOM_DECK_ID) < 0) {
      db.settings.selectedDecks.push(CUSTOM_DECK_ID); saveDb();
    }
  }
  function addCustomWord(v, from) {
    if (!v || !v.hanzi) return;
    if (customHas(v.hanzi)) { toast(v.hanzi + " đã có trong bộ 📝 Từ trong đề"); return; }
    var had = CUSTOM.length > 0;
    CUSTOM.push(normalizeCustom([{ hanzi: v.hanzi, pinyin: v.pinyin, hanviet: v.hanviet, vi: v.vi, from: from }])[0]);
    saveCustom(); afterCustomChange(had);
    toast("Đã thêm " + v.hanzi + " vào bộ 📝 Từ trong đề");
  }

  // ---------- luyện đề: nạp đề lười + audio ----------
  var exam = null;        // đề đang mở
  var examPending = null; // id đang tải
  var audioEl = byId("examAudio");
  var audioBadSrc = null;
  var seekHold = false; // đang giữ thanh tua: timeupdate không kéo thanh về chỗ cũ

  function openExam(id) {
    if (!id || !EXAM_ID_RE.test(id)) return;
    var have = window.EXAMS && window.EXAMS[id];
    if (have) { startExam(id, have); return; }
    if (examPending === id) return;
    examPending = id;
    view = "exam-loading"; render();
    var s = document.createElement("script");
    var fail = function () {
      if (examPending !== id) return;
      examPending = null;
      if (view === "exam-loading") { view = "exams"; render(); }
      toast("Không tải được đề " + id);
    };
    s.onload = function () {
      if (s.parentNode) s.parentNode.removeChild(s);
      var ex = window.EXAMS && window.EXAMS[id];
      if (!ex) { fail(); return; }
      if (examPending !== id || view !== "exam-loading") return; // người dùng đã đi chỗ khác
      examPending = null;
      startExam(id, ex);
    };
    s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); fail(); };
    s.src = "exams/" + id + ".js";
    document.body.appendChild(s);
  }
  function partType(p) { return p.type || PART_TYPES[p.key] || "mc"; }
  function startExam(id, data) {
    var parts = (Array.isArray(data.parts) ? data.parts : []).map(function (p) {
      if (!p || !Array.isArray(p.items)) return null;
      var items = p.items.filter(function (it) { return it && Number(it.n) > 0; });
      return items.length ? { key: p.key, name: p.name, type: p.type, banks: p.banks, items: items } : null;
    }).filter(Boolean);
    var flat = [];
    parts.forEach(function (p, pi) { p.items.forEach(function (it, ii) { flat.push({ p: pi, i: ii }); }); });
    if (!flat.length) { toast("Đề " + id + " không có câu nào"); view = "exams"; render(); return; }
    var prog = exProg(id), pos = 0;
    if (prog.last) flat.forEach(function (f, k) { if (parts[f.p].items[f.i].n === prog.last) pos = k; });
    var keepFree = exam && exam.id === id ? exam.free : {};
    exam = { id: id, data: data, parts: parts, flat: flat, pos: pos, showScript: false, order: "", build: [], free: keepFree, freeShown: {}, padFor: null };
    var fresh = setupAudio();
    view = "exam"; render();
    // Làm tiếp đề (audio vừa nạp mới): tua tới đoạn của câu đang dở thay vì phát lại từ đầu file.
    if (fresh && pos > 0) seekToItem(false);
  }
  // Trả về true khi vừa nạp file audio mới.
  function setupAudio() {
    if (!audioEl) return false;
    var src = exam && exam.data.audio;
    if (!src) { audioEl.pause(); return false; }
    if (audioEl.getAttribute("data-src") !== src) {
      audioEl.pause();
      audioEl.setAttribute("data-src", src);
      var rate = audioEl.playbackRate || 1;
      audioEl.src = src;
      try { audioEl.load(); } catch (e) { /* bỏ qua */ }
      audioEl.playbackRate = rate; audioEl.defaultPlaybackRate = rate;
      return true;
    }
    return false;
  }
  function hasAudio() { return !!(exam && exam.data.audio && audioEl && audioBadSrc !== exam.data.audio); }
  function toggleAudio() {
    if (!hasAudio()) return;
    if (audioEl.paused) {
      var p = audioEl.play();
      if (p && p.catch) p.catch(function () { toast("Không phát được audio"); });
    } else audioEl.pause();
  }
  function skipAudio(sec) {
    if (!hasAudio()) return;
    var d = isFinite(audioEl.duration) ? audioEl.duration : Infinity;
    audioEl.currentTime = Math.max(0, Math.min(d, (audioEl.currentTime || 0) + sec));
  }
  function setRate(r) {
    if (!audioEl || !(r > 0)) return;
    audioEl.playbackRate = r; audioEl.defaultPlaybackRate = r;
    updateAudioUi();
  }
  function updateAudioUi() {
    if (view !== "exam" || !audioEl) return;
    var t = byId("auToggle"); if (t) t.textContent = audioEl.paused ? "▶" : "⏸";
    var d = audioEl.duration, c = audioEl.currentTime || 0;
    var tm = byId("auTime");
    if (tm) tm.textContent = fmtClock(Math.floor(c)) + " / " + (isFinite(d) ? fmtClock(Math.floor(d)) : "--:--");
    var sk = byId("auSeek");
    if (sk) { if (isFinite(d)) sk.max = String(Math.floor(d)); if (!seekHold) sk.value = String(Math.floor(c)); }
    var btns = app.querySelectorAll("[data-rate]");
    for (var i = 0; i < btns.length; i++) btns[i].className = Number(btns[i].getAttribute("data-rate")) === audioEl.playbackRate ? "on" : "";
  }
  if (audioEl) {
    ["timeupdate", "loadedmetadata", "play", "pause", "ratechange", "ended"].forEach(function (ev) { audioEl.addEventListener(ev, updateAudioUi); });
    audioEl.addEventListener("error", function () {
      var src = audioEl.getAttribute("data-src");
      if (!src || audioBadSrc === src) return;
      audioBadSrc = src;
      if (view === "exam" && exam && exam.data.audio === src) { toast("Không tải được file audio — dùng nút 🔊 đọc lời thoại thay"); renderExam(true); }
    });
  }

  // ---------- luyện đề: điều hướng & chấm ----------
  function curRef() { return exam.flat[exam.pos]; }
  function curPart() { return exam.parts[curRef().p]; }
  function curItem() { var f = curRef(); return exam.parts[f.p].items[f.i]; }
  function curAns() { return exProg(exam.id).ans[curItem().n]; }
  function resetQuestionUi() { exam.showScript = false; exam.order = ""; exam.build = []; }
  function examGoPos(pos) {
    if (!exam || pos < 0 || pos >= exam.flat.length) return;
    exam.pos = pos; resetQuestionUi();
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ }
    var prog = exProg(exam.id); prog.last = curItem().n; saveExdb();
    renderExam(false);
  }
  function examMove(d) { if (exam) examGoPos(exam.pos + d); }
  // seek: nhảy từ tab phần / ô số câu → tua audio tới đoạn của câu (bấm Trước/Sau thì không tua,
  // để audio đang phát không bị kéo lùi).
  function examGoN(n, seek) {
    for (var k = 0; k < exam.flat.length; k++) {
      var f = exam.flat[k];
      if (exam.parts[f.p].items[f.i].n === n) { examGoPos(k); if (seek) seekToItem(false); return; }
    }
  }
  function examPart(pi) {
    var p = exam.parts[pi]; if (!p) return;
    var ans = exProg(exam.id).ans, target = p.items[0].n;
    for (var i = 0; i < p.items.length; i++) { if (!ans[p.items[i].n]) { target = p.items[i].n; break; } }
    examGoN(target, true);
  }
  // Mốc giây đầu đoạn hội thoại của câu đang mở (it.t). Câu 36-45 đi theo cặp chung một đoạn nên
  // câu thứ hai không có t → lùi về câu gần nhất có t trong cùng phần.
  function itemAudioT() {
    if (!exam) return null;
    var p = exam.flat[exam.pos].p;
    for (var k = exam.pos; k >= 0 && exam.flat[k].p === p; k--) {
      var f = exam.flat[k], t = exam.parts[f.p].items[f.i].t;
      if (t != null && Number(t) >= 0) return Number(t);
    }
    return null;
  }
  function seekToItem(play) {
    var t = itemAudioT();
    if (!hasAudio() || t == null) return;
    if (audioEl.readyState < 1) { // chưa có metadata thì chưa đặt currentTime được → chờ, nếu vẫn đúng đề/câu đó
      var id = exam.id, pos = exam.pos;
      audioEl.addEventListener("loadedmetadata", function () {
        if (view === "exam" && exam && exam.id === id && exam.pos === pos) seekToItem(play);
      }, { once: true });
      return;
    }
    var d = isFinite(audioEl.duration) ? audioEl.duration : Infinity;
    try { audioEl.currentTime = Math.min(t, d); } catch (e) { return; }
    if (play && audioEl.paused) toggleAudio();
    updateAudioUi();
  }
  function normSent(s) { return String(s == null ? "" : s).replace(/[\s，。！？、；：,.!?;:“”‘’"'（）()《》〈〉【】…—\-·~～]/g, ""); }
  // Viết 1: đáp án gốc đôi khi chấp nhận cả câu đảo ("Đáp án gốc cũng chấp nhận 对这个城市我很熟悉。").
  // Nhận: answer + mảng alt (nếu dữ liệu có) + câu chữ Hán đứng sau chữ "chấp nhận" trong explain,
  // nhưng chỉ khi câu đó dùng đúng y các mảnh đề cho (tránh nhận nhầm câu ví dụ khác).
  function buildAnswers(it) {
    var out = [normSent(it.answer)];
    var bag = function (s) { return normSent(s).split("").sort().join(""); };
    var want = bag((Array.isArray(it.words) ? it.words : []).join(""));
    var cands = Array.isArray(it.alt) ? it.alt.slice() : [];
    var ex = String(it.explain || ""), k = ex.search(/chấp nhận/i);
    if (k >= 0) cands = cands.concat(ex.slice(k).match(/[㐀-鿿0-9０-９A-Za-z，、“”]+[。！？]/g) || []);
    cands.forEach(function (c) { if (bag(c) === want && out.indexOf(normSent(c)) < 0) out.push(normSent(c)); });
    return out;
  }
  function isTrue(v) { return v === true || v === "true" || v === "√" || v === "T"; }
  function examPick(pick) {
    if (!exam) return;
    var it = curItem(), type = partType(curPart()), prog = exProg(exam.id);
    if (prog.ans[it.n]) return;
    var ok = null;
    if (it.answer != null) {
      if (type === "tf") ok = pick === isTrue(it.answer);
      else if (type === "build") ok = buildAnswers(it).indexOf(normSent(pick)) >= 0;
      else ok = String(pick).toUpperCase() === String(it.answer).toUpperCase();
    }
    prog.ans[it.n] = { pick: pick, ok: ok }; prog.last = it.n; saveExdb();
    renderExam(true);
  }
  function optionKeys(it, type) {
    if (type === "tf") return ["T", "F"];
    if (type === "cloze") { var b = bankFor(curPart(), it); return b && b.options ? Object.keys(b.options).sort() : []; }
    return it.options ? Object.keys(it.options).sort() : [];
  }
  function bankFor(part, it) {
    return (Array.isArray(part.banks) ? part.banks : []).filter(function (b) { return b && it.n >= b.from && it.n <= b.to; })[0] || null;
  }
  function examOrderAdd(k) {
    var it = curItem();
    if (curAns() || !it.segments || !it.segments[k] || exam.order.indexOf(k) >= 0) return;
    exam.order += k; renderExam(true);
  }
  function examBuildAdd(i) {
    var it = curItem();
    if (curAns() || !Array.isArray(it.words) || i < 0 || i >= it.words.length || exam.build.indexOf(i) >= 0) return;
    exam.build.push(i); renderExam(true);
  }
  function examCheck() {
    var it = curItem(), type = partType(curPart());
    if (curAns()) return;
    if (type === "order") {
      if (exam.order.length < Object.keys(it.segments || {}).length) { toast("Xếp đủ các đoạn đã"); return; }
      examPick(exam.order);
    } else if (type === "build") {
      if (!exam.build.length) { toast("Bấm các mảnh để ghép câu đã"); return; }
      examPick(exam.build.map(function (i) { return it.words[i]; }).join(""));
    }
  }
  function examSelf(ok) {
    var it = curItem(), prog = exProg(exam.id);
    prog.ans[it.n] = { pick: exam.free[it.n] || "", ok: ok }; prog.last = it.n; saveExdb();
    renderExam(true);
  }
  function examRedoQ() {
    var it = curItem(), prog = exProg(exam.id);
    delete prog.ans[it.n]; delete exam.freeShown[it.n]; resetQuestionUi(); saveExdb();
    renderExam(true);
  }
  function examResetPart() {
    var p = curPart();
    if (!confirm("Xóa kết quả phần " + (PART_TABS[p.key] || p.key) + " để làm lại?")) return;
    var prog = exProg(exam.id);
    p.items.forEach(function (it) { delete prog.ans[it.n]; delete exam.freeShown[it.n]; });
    saveExdb(); examGoN(p.items[0].n);
  }
  function examResetAll() {
    if (!confirm("Xóa toàn bộ kết quả đề này để làm lại từ đầu?")) return;
    var prog = exProg(exam.id);
    prog.ans = {}; exam.freeShown = {}; exam.free = {}; saveExdb();
    examGoPos(0);
  }
  function stopExamMedia() {
    if (audioEl) audioEl.pause();
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ }
  }
  function leaveExam() {
    stopExamMedia();
    if (backTo("#exams")) return;
    view = "exams"; render();
  }

  // ---------- luyện đề: HTML ----------
  function linesHtml(text, cls) {
    return String(text == null ? "" : text).split(/\n+/).map(function (l) {
      return l.trim() ? '<div class="' + (cls || "") + '">' + esc(l) + '</div>' : "";
    }).join("");
  }
  function ttsScript(it) {
    var lines = String(it.script || "").split(/\n+/).map(function (l) { return l.replace(/^\s*[男女]\s*[：:]\s*/, ""); });
    var s = lines.join("。");
    if (it.question) s += "。问：" + it.question;
    return s;
  }
  function examLabels(e) {
    var out = [];
    if (e.audio) out.push("🎧 có audio");
    else if (e.listen === "tts") out.push("🔊 nghe bằng giọng máy");
    else if (e.listen === "none") out.push("⚠️ phần nghe không có audio/lời thoại");
    else if (e.listen === "partial") out.push("⚠️ phần nghe thiếu lời thoại");
    if (e.answers === "official") out.push("✅ đáp án gốc");
    else if (e.answers === "partial") out.push("⚠️ thiếu một phần đáp án");
    else out.push("🤖 AI giải");
    if (e.missing) out.push("⚠️ " + e.missing + " câu không có đáp án");
    return out.map(function (l) { return '<span class="tag' + (l.indexOf("⚠️") === 0 ? " warn-tag" : "") + '">' + esc(l) + '</span>'; }).join("");
  }
  function examHomeBox() {
    if (!EXAM_INDEX.length) return "";
    var done = 0;
    EXAM_INDEX.forEach(function (e) { done += exStats(e.id).done; });
    return '<section class="box"><div class="row-between"><h2>📝 Luyện đề HSK4</h2><span class="muted small">' + EXAM_INDEX.length + ' đề</span></div>' +
      '<p class="muted small">Đề HSK4 thật, có dịch + giải thích từng câu. Đã làm ' + done + ' câu.</p>' +
      '<button class="primary big" data-action="exams">Vào luyện đề</button></section>';
  }
  function examsHtml() {
    var rows = EXAM_INDEX.map(function (e) {
      var s = exStats(e.id), total = Number(e.total) || 100;
      return '<li><div class="info"><div class="etitle">' + esc(e.title || e.id) + '</div>' +
        '<div class="labels">' + examLabels(e) + '</div>' +
        '<div class="muted small">Đã làm ' + s.done + '/' + total + ' · đúng ' + s.ok + '</div></div>' +
        '<button class="small-btn' + (s.done ? "" : " primary") + '" data-action="ex-open" data-id="' + esc(e.id) + '">' + (s.done ? "Làm tiếp" : "Mở") + '</button></li>';
    }).join("");
    return '<div class="wrap">' +
      '<div class="row-between"><h1>Luyện đề HSK4</h1><button class="small-btn" data-action="home">← Trang chủ</button></div>' +
      '<p class="muted small">Mỗi lần một câu. Làm xong câu nào sẽ thấy đáp án, lời thoại, dịch, giải thích; từ hay thì bấm <b>+ Ôn</b> để đưa vào bộ 📝 Từ trong đề.</p>' +
      '<section class="box"><ul class="exlist">' + rows + '</ul></section>' + hintHtml('<kbd>Esc</kbd> về trang chủ') + '</div>';
  }
  function audioCtlHtml() {
    if (!exam.data.audio || !audioEl) return "";
    if (audioBadSrc === exam.data.audio) return '<div class="muted small" style="margin-top:6px">🎧 Không tải được file audio — dùng nút 🔊 ở từng câu.</div>';
    var rates = [0.75, 1, 1.25].map(function (r) {
      return '<button data-action="au-rate" data-rate="' + r + '"' + (audioEl.playbackRate === r ? ' class="on"' : "") + '>' + r + '×</button>';
    }).join("");
    return '<div class="audio-ctl">' +
      '<button id="auToggle" data-action="au-toggle" title="Phát / dừng (Space)">' + (audioEl.paused ? "▶" : "⏸") + '</button>' +
      '<button data-action="au-skip" data-sec="-5">⏪ 5s</button><button data-action="au-skip" data-sec="5">⏩ 5s</button>' +
      '<input type="range" id="auSeek" min="0" max="0" step="1" value="0" aria-label="Tua audio">' +

  function examKey(e) {
    var t = e.target;

    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    // Danh sách đề / đang tải: Esc về trang chủ (giống màn Giáo trình).
    if ((view === "exams" || view === "exam-loading") && key === "Escape" && !e.repeat) {
      e.preventDefault(); examPending = null; view = "home"; render(); return;
    }
    if (view !== "exam" || !exam) return;
    if (key === "ArrowLeft") { e.preventDefault(); examMove(-1); return; }
    if (key === "ArrowRight") { e.preventDefault(); examMove(1); return; }
    if (key === "Escape") { e.preventDefault(); leaveExam(); return; }
    if (key === " " || key === "Spacebar") {
      if (!hasAudio()) return; // đề không audio: để Space cuộn trang như bình thường
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
      if (!e.repeat) toggleAudio();
      return;
    }
    if (e.repeat) return;
    var it = curItem(), type = partType(curPart()), a = curAns();
    if (key === "Enter") {
      if (tag === "button") return; // Enter trên nút đang focus = bấm nút đó
      e.preventDefault();
      if (a) return;
      if (type === "order" || type === "build") examCheck();
      else if (type === "free" && !exam.freeShown[it.n]) { exam.freeShown[it.n] = true; renderExam(true); }
      return;
    }
    if (key === "Backspace") {
      if (a) return;
      if (type === "order" && exam.order) { e.preventDefault(); exam.order = exam.order.slice(0, -1); renderExam(true); }
      else if (type === "build" && exam.build.length) { e.preventDefault(); exam.build.pop(); renderExam(true); }
      return;
    }
    if (a || key.length !== 1) return;

  // ---------- HTML: thống kê ----------
  function statsHtml() {
    var totals = { "new": 0, learning: 0, review: 0 };
    var rows = DECKS.map(function (d) {
      var c = { "new": 0, learning: 0, review: 0 };

      '<div id="cardArea"></div>' +

  function tagRow(it, label, cls) {

  // Chữ Hán to trên thẻ: mỗi chữ một ô 田 riêng (đường kẻ qua tâm từng chữ, không qua khe giữa hai chữ).
  // Từ dài (≥5 ký tự, vd. 摸不着头脑, 只有……才……) thu nhỏ để vẫn nằm trên một hàng ở điện thoại.
  function bigHanziHtml(text) {

      '<button class="g1" data-action="grade" data-grade="1">Quên<small>1 · ' + intervalLabel(c, 1) + '</small></button>' +

  function grades2Html(it) {

    return '<div class="grades two dock">' +
      '<button class="g1" data-action="grade" data-grade="1">Quên<small>1 · ' + intervalLabel(c, 1) + '</small></button>' +
      '<button class="g3" data-action="grade" data-grade="3">Nhớ<small>3 · ' + intervalLabel(c, 3) + '</small></button>' +

  function flipBtnHtml() {

  function newWordHtml(it) {

    return '<div class="card">' + tagRow(it, "Từ mới", "new") +

      '<div class="actions dock"><button class="primary big" data-action="understood">Đã hiểu</button></div>' +
      hintHtml('<kbd>Enter</kbd> đã hiểu · thẻ sẽ quay lại sau ~8 thẻ') +

  function recogHtml(it) {

    }

      (w.pinyin ? '<div class="pinyin">' + esc(w.pinyin) + '</div>' : "") +

      (w.meaning ? '<div class="meaning">' + esc(w.meaning) + '</div>' : "") +
      chietTuHtml(w) +

      grades4Html(it) + '</div>';

  function recallHtml(it) {
    var w = it.data;
    var head = tagRow(it, "Nghĩa → chữ", "recall") +
      '<div class="meaning front">' + esc(w.meaning) + '</div>' +
      (w.pos ? '<div class="pos">' + esc(w.pos) + '</div>' : "");
    if (!session.flipped) {
      var hint = !w.hanviet ? "" : session.hint ? hvHtml(w)
        : '<div class="center"><button class="small-btn" data-action="hint">Gợi ý Hán Việt</button></div>';
      return '<div class="card">' + head + hint + padHtml() + flipBtnHtml() + '</div>';
    }
    return '<div class="card">' + head +
      bigHanziHtml(w.hanzi) + '<div class="center">' + speakBtn(w.hanzi) + '</div>' +
      (w.pinyin ? '<div class="pinyin">' + esc(w.pinyin) + '</div>' : "") +
      hvHtml(w) +
      padHtml() +
      '<div class="examples">' + exampleHtml(pickExample(it)) + '</div>' +
      grades4Html(it) + '</div>';
  }
  function phraseHtml(it) {
    var p = it.data;
    var head = tagRow(it, "Mẫu câu", "phrase") +
      (p.when ? '<div class="when">' + esc(p.when) + '</div>' : "") +
      '<div class="meaning front">' + esc(p.vi) + '</div>';
    if (!session.flipped) {
      return '<div class="card">' + head + '<p class="muted center">Tiếng Trung nói sao?</p>' + flipBtnHtml() + '</div>';
    }
    return '<div class="card">' + head +
      '<div class="hanzi mid zh">' + esc(p.zh) + '</div>' +
      '<div class="pinyin">' + esc(p.pinyin) + '</div>' +
      '<div class="center" style="margin-top:8px">' + speakBtn(p.zh) + '</div>' +
      grades2Html(it) + '</div>';
  }
  function doneHtml() {
    var minutes = Math.round(session.elapsed / 60);
    return '<div class="card center"><div class="big-emoji">🏁</div><h1>Hết bài hôm nay</h1>' +
      '<p class="muted">' + session.doneCount + ' lượt · ' + Object.keys(session.touched).length + ' thẻ · ' + minutes + ' phút. Ngon.</p>' +
      '<div class="actions"><button class="primary big" data-action="end-force">Kết thúc</button></div>' +
      hintHtml('<kbd>Enter</kbd> kết thúc') + '</div>';
  }
  function emptyHtml() {
    return '<div class="card center"><div class="big-emoji">🫥</div><h1>Không có thẻ nào</h1>' +
      '<p class="muted">Các chủ đề đã chọn không có từ nào. Kiểm tra lại thư mục <code>decks/</code>.</p>' +
      '<div class="actions"><button class="primary big" data-action="end-force">Về trang chủ</button></div></div>';
  }

  function updateCounts() {
    var el = byId("counts");
    if (!el || !session) return;
    var due = 0, fresh = 0;
    session.queue.forEach(function (it) { if (isNewItem(it)) fresh++; else due++; });
    el.textContent = "Đã làm " + session.doneCount + " · còn ôn " + due + " · từ mới còn " + fresh;
  }
  function renderCard() {
    var area = byId("cardArea");
    if (!area || !session) return;
    var snap = session.keepPad ? snapshotPad() : null;
    PAD.drawing = false; PAD.pointerId = null; PAD.canvas = null;
    var it = session.current;
    var html;
    if (!it) {
      syncElapsed();
      html = session.elapsed >= TARGET_SEC ? doneHtml() : emptyHtml();
    } else {
      var mode = modeOf(it);
      html = mode === "new" ? newWordHtml(it)
        : mode === "recog" ? recogHtml(it)
        : mode === "recall" ? recallHtml(it)
        : phraseHtml(it);
    }
    area.innerHTML = html;
    updateCounts();
    var pad = byId("pad");
    if (pad) { drawGrid(pad); restorePad(pad, snap); }
    if (!session.keepPad) window.scrollTo(0, 0);
    autoSpeak(it);
  }
  function autoSpeak(it) {
    if (!it || !db.settings.autoSpeak) return;
    var mode = modeOf(it);
    var shouldSpeak = mode === "new" || session.flipped;
    if (!shouldSpeak) return;
    var key = it.id + ":" + (session.flipped ? "back" : "front");
    if (session.spokenFor === key) return;
    session.spokenFor = key;
    speak(it.kind === "phrase" ? it.data.zh : it.data.hanzi);
  }

  // ---------- render chung ----------
  function render() {
    if (view !== "lesson" && reading) stopReading();
    if (view === "stats") app.innerHTML = statsHtml();
    else if (view === "session") { app.innerHTML = sessionShellHtml(); renderCard(); tick(); }
    else if (view === "exams" && EXAM_INDEX.length) app.innerHTML = examsHtml();
    else if (view === "exam" && exam) renderExam(false);
    else if (view === "lessons" && LESSON_INDEX.length) { app.innerHTML = lessonsHtml(); centerOnTab(); }
    else if (view === "lesson" && lesson) { renderLesson(false); syncHistory(); return; }
    else if (view === "lesson-loading") app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải bài…</p>' +
      '<button class="small-btn" data-action="lessons">← Danh sách bài</button></div></div>';
    else if (view === "exam-loading") app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải đề…</p>' +
      '<button class="small-btn" data-action="exams">← Danh sách đề</button></div></div>';
    else { view = "home"; app.innerHTML = homeHtml(); }
    syncHistory();
    window.scrollTo(0, 0);
  }

  // ---------- định tuyến bằng hash: nút Back của điện thoại quay về màn trước ----------
  // Hash không gửi lên server (GitHub Pages không 404), ?t= giữ nguyên.
  // history.state = { d: độ sâu màn, n: số mục tính từ mục gốc (Trang chủ), p: hash màn trước }.
  var DEPTH = { home: 0, exams: 1, lessons: 1, stats: 1, session: 1, exam: 2, lesson: 2, "exam-loading": 2, "lesson-loading": 2 };
  var fromPop = false;
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) { /* bỏ qua */ }
  function baseUrl() { return location.pathname + location.search; }
  function routeOf() {
    switch (view) {
      case "exams": return "#exams";
      case "exam": return exam ? "#exam/" + exam.id : "#exams";
      case "exam-loading": return examPending ? "#exam/" + examPending : "#exams";
      case "lessons": return "#lessons";
      case "lesson": return lesson ? "#lesson/" + lesson.id : "#lessons";
      case "lesson-loading": return lessonPending ? "#lesson/" + lessonPending : "#lessons";
      case "stats": return "#stats";
      case "session": return "#session";
      default: return "";
    }
  }
  function syncHistory() {
    if (fromPop) return;
    var r = routeOf();
    if (r === location.hash) return;
    var st = history.state || {}, n = Number(st.n) || 0, d = DEPTH[view] || 0;
    try {
      if (!r && n > 0) { history.go(-n); return; } // về Trang chủ: lùi về mục gốc, stack không phình
      if (d > (Number(st.d) || 0)) history.pushState({ d: d, n: n + 1, p: location.hash }, "", r || baseUrl());
      else history.replaceState({ d: d, n: n, p: st.p }, "", r || baseUrl());
    } catch (e) { /* bỏ qua */ }
  }
  // Nút quay lại trong app: nếu mục trước đúng là màn đích thì history.back() để Back của hệ điều hành khớp.
  function backTo(route) {
    var st = history.state;
    if (fromPop || !st || st.p !== route || location.hash === route) return false;
    history.back();
    return true;
  }
  function routeTo(h) {
    var m;
    examPending = null; lessonPending = null;
    // openExam / openLesson tự vẽ màn (đang tải, đề/bài, hoặc danh sách nếu lỗi).
    if ((m = /^#exam\/(.+)$/.exec(h)) && EXAM_ID_RE.test(m[1])) { openExam(m[1]); return; }
    if ((m = /^#lesson\/(.+)$/.exec(h)) && LESSON_META[m[1]]) { openLesson(m[1]); return; }
    view = h === "#exams" ? "exams" : h === "#lessons" ? "lessons" : h === "#stats" ? "stats" : "home";
    render();
  }
  window.addEventListener("popstate", function () {
    if (!DECKS.length) return;
    fromPop = true;
    try {
      var h = location.hash;
      if (view === "exam" && h !== routeOf()) stopExamMedia();
      if (view === "lesson") stopReading();
      if (view === "session" && h !== "#session") closeSession();
      if (h === "#session" && session) { render(); return; }
      routeTo(h);
    } finally { fromPop = false; }
  });
  function missingDecksHtml() {
    return '<div class="wrap"><div class="warn"><h1>Thiếu file bài học</h1>' +
      '<p>Không thấy dữ liệu nào trong <code>window.DECKS</code>. Kiểm tra thư mục <code>decks/</code> nằm cạnh <code>index.html</code> và có đủ 12 file <code>.js</code>.</p>' +
      '<p class="muted small">Mỗi file phải bắt đầu bằng <code>window.DECKS = window.DECKS || []; window.DECKS.push({...})</code>.</p></div></div>';
  }

  // ---------- sự kiện (event delegation trên #app) ----------
  function setSelectedDecks(ids) {
    db.settings.selectedDecks = ids;
    saveDb(); render();
  }
  // Bài đang học đã chọn nhưng chưa tải được (không có trong DECKS): giữ lại trong lựa chọn khi
  // tick/bỏ tick bộ khác hoặc "Chọn hết", để bài tải được lần sau vẫn vào phiên.
  function keepUnloadedLessons(ids) {
    return ids.concat(db.settings.selectedDecks.filter(function (x) {
      return lessonOn(x) && !DECKS.some(function (d) { return d.id === x; }) && ids.indexOf(x) < 0;
    }));
  }
  function onAction(action, el) {
    switch (action) {
      case "start": startSession(); break;
      case "stats": view = "stats"; render(); break;
      case "home": view = "home"; render(); break;
      case "export": exportBackup(); break;
      case "import": { var f = byId("importFile"); if (f) { f.value = ""; f.click(); } break; }
      case "select-all": setSelectedDecks(keepUnloadedLessons(DECKS.map(function (d) { return d.id; }))); break;
      case "select-none": setSelectedDecks([]); break;
      case "speak": speak(el.getAttribute("data-text")); break;
      case "understood": understood(); break;
      case "flip": flip(); break;
      case "hint": showHint(); break;
      case "clear-pad": clearPad(); break;
      case "grade": gradeCurrent(Number(el.getAttribute("data-grade"))); break;
      case "end": endSession(false); break;
      case "end-force": endSession(true); break;
      // luyện đề
      case "exams": if (view === "exam") leaveExam(); else { examPending = null; if (!backTo("#exams")) { view = "exams"; render(); } } break;
      case "ex-open": openExam(el.getAttribute("data-id")); break;
      case "ex-part": examPart(Number(el.getAttribute("data-part"))); break;
      case "ex-go": examGoN(Number(el.getAttribute("data-n")), true); break;
      case "ex-prev": examMove(-1); break;
      case "ex-next": examMove(1); break;
      case "ex-script": exam.showScript = !exam.showScript; renderExam(true); break;
      case "ex-pick": {
        var pk = el.getAttribute("data-pick");
        examPick(partType(curPart()) === "tf" ? pk === "T" : pk);
        break;
      }
      case "ex-order": examOrderAdd(el.getAttribute("data-k")); break;
      case "ex-build": examBuildAdd(Number(el.getAttribute("data-k"))); break;
      case "ex-unbuild": if (!curAns()) { exam.build.splice(Number(el.getAttribute("data-k")), 1); renderExam(true); } break;
      case "ex-clear": exam.order = ""; exam.build = []; renderExam(true); break;
      case "ex-check": examCheck(); break;
      case "ex-sample": exam.freeShown[curItem().n] = true; renderExam(true); break;
      case "ex-self": examSelf(el.getAttribute("data-ok") === "1"); break;
      case "ex-redo-q": examRedoQ(); break;
      case "ex-reset-part": examResetPart(); break;
      case "ex-reset-all": examResetAll(); break;
      case "ex-add": {
        var v = (curItem().vocab || [])[Number(el.getAttribute("data-i"))];
        addCustomWord(v, exam.id + "#" + curItem().n);
        renderExam(true);
        break;
      }
      case "au-toggle": toggleAudio(); break;
      case "au-skip": skipAudio(Number(el.getAttribute("data-sec")) || 0); break;
      case "au-rate": setRate(Number(el.getAttribute("data-rate"))); break;
      case "au-item": seekToItem(true); break;
      // giáo trình
      case "lessons": lessonPending = null; if (view === "lesson") stopReading(); if (!backTo("#lessons")) { view = "lessons"; render(); } break;
      case "ls-level": UI.lsLevel = Number(el.getAttribute("data-level")); saveUi(); render(); break;
      case "ls-open": openLesson(el.getAttribute("data-id")); break;
      case "ls-tab": setLessonTab(el.getAttribute("data-tab")); break;
      case "ls-toggle": toggleLessonStudy(); break;
      case "ls-word": {
        var wi = Number(el.getAttribute("data-i"));
        if (lesson.open[wi]) delete lesson.open[wi]; else lesson.open[wi] = true;
        renderLesson(true);
        break;
      }
      case "ls-word-all": {
        var ws = lsArr(lesson.data.words).filter(function (w) { return w && w.hanzi; });
        var all = ws.every(function (w, i) { return lesson.open[i]; });
        lesson.open = {};
        if (!all) ws.forEach(function (w, i) { lesson.open[i] = true; });
        renderLesson(true);
        break;
      }
      case "ls-py": UI.lsPy = UI.lsPy === false; saveUi(); renderLesson(true); break;
      case "ls-vi": UI.lsVi = UI.lsVi === false; saveUi(); renderLesson(true); break;
      case "ls-read": lessonReadAll(Number(el.getAttribute("data-t"))); break;
      case "ls-quiz": {
        var qi = Number(el.getAttribute("data-i"));
        if (lesson.quiz[qi] == null) { lesson.quiz[qi] = el.getAttribute("data-v") === "T"; renderLesson(true); }
        break;
      }
      case "ls-quiz-reset": lesson.quiz = {}; renderLesson(true); break;
      default: break;
    }
  }
  app.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el || !app.contains(el)) return;
    e.preventDefault();
    onAction(el.getAttribute("data-action"), el);
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "importFile") { importBackupFile(t.files && t.files[0]); return; }
    if (t.id === "auSeek") { seekHold = false; updateAudioUi(); return; }
    var deckId = t.getAttribute("data-deck");
    if (deckId) {
      var ids = db.settings.selectedDecks.filter(function (id) { return id !== deckId; });
      if (t.checked) ids.push(deckId);
      setSelectedDecks(keepUnloadedLessons(ids));
      return;
    }
    var key = t.getAttribute("data-setting");
    if (!key) return;
    if (key === "newPerSession") db.settings.newPerSession = Number(t.value) || 10;
    else if (key === "drawPad") db.settings.drawPad = !!t.checked;
    else if (key === "autoSpeak") db.settings.autoSpeak = !!t.checked;
    else if (key === "theme") { db.settings.theme = themeVal(t.value) || "dem"; applyTheme(); }
    saveDb(); render();
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "auSeek" && audioEl) { seekHold = true; audioEl.currentTime = Number(t.value) || 0; return; }
    if (t.id === "exFree" && exam) exam.free[t.getAttribute("data-n")] = t.value;
  });
  // Listener gắn 1 lần trên #app (delegation) nên đổi thẻ / vẽ lại canvas không rò listener.
  if (window.PointerEvent) {
    app.addEventListener("pointerdown", onPointerDown);
    app.addEventListener("pointermove", onPointerMove);
    app.addEventListener("pointerup", onPointerUp);
    app.addEventListener("pointercancel", onPointerUp);
  } else {
    app.addEventListener("touchstart", onTouchStart, { passive: false });
    app.addEventListener("touchmove", onTouchMove, { passive: false });
    app.addEventListener("touchend", onPadEnd);
    app.addEventListener("touchcancel", onPadEnd);
    app.addEventListener("mousedown", onMouseDown);
    app.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onPadEnd);
  }

  document.addEventListener("keydown", function (e) {
    if (view !== "session" || !session) return;
    var t = e.target;
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var isSpace = key === " " || key === "Spacebar";
    // Space không cuộn trang; Space/Enter không "bấm" nút đang focus (vd. nút Kết thúc) thay cho phím tắt.
    if (isSpace || key === "Enter") {
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
    }
    // Giữ phím sẽ auto-repeat: chặn để Space giữ lâu không vừa lật vừa chấm Nhớ.
    if (e.repeat) { e.preventDefault(); return; }
    if (key === "Escape") { e.preventDefault(); escapeSession(); return; }
    var it = session.current;
    if (!it) {
      if (key === "Enter") endSession(true);
      return;
    }
    var mode = modeOf(it);
    if (isSpace) {
      if (mode === "new") return;
      if (!session.flipped) flip(); else gradeCurrent(3);
      return;
    }
    if (key === "Enter") {
      e.preventDefault();
      if (mode === "new") understood(); else if (!session.flipped) flip();
      return;
    }
    if (/^[1-4]$/.test(key) && mode !== "new" && session.flipped) {
      e.preventDefault();
      gradeCurrent(Number(key));
    }
  });
  // Phím tắt màn đề: tách riêng, chỉ chạy khi view === "exam" (phím phiên học ở trên chỉ chạy khi view === "session").
  document.addEventListener("keydown", examKey);
  // Phím tắt giáo trình: chỉ chạy khi view === "lesson" / "lessons".
  document.addEventListener("keydown", lessonKey);

  // ---------- khởi động ----------
  // Mở link / tải lại trang: về đúng màn theo hash. Mở mới (chưa có history.state của app) thì dựng
  // mục gốc = Trang chủ (+ mục Danh sách đề/bài nếu link trỏ thẳng vào đề/bài) để Back lùi từng màn.
  function initialRoute() {
    var h = location.hash, st = history.state;
    try {
      if (!(st && typeof st.n === "number")) {
        history.replaceState({ d: 0, n: 0 }, "", baseUrl());
        var mid = /^#exam\//.test(h) ? "#exams" : /^#lesson\//.test(h) ? "#lessons" : "";
        if (mid) history.pushState({ d: 1, n: 1, p: "" }, "", mid);
      }
    } catch (e) { /* bỏ qua */ }
    routeTo(h);
  }
  // Nạp file các bài giáo trình đang học TRƯỚC khi dựng thẻ (chờ xong/lỗi, tối đa 8s).
  function boot() {
    var ids = db.settings.enabledLessons.filter(function (id) { return !!LESSON_META[id]; });
    var started = false;
    var go = function () {
      started = true;
      rebuildItems();
      var miss = ids.filter(function (id) { return !lessonData(id); });
      if (!DECKS.length) app.innerHTML = missingDecksHtml();
      else initialRoute();
      // Gọi sau render() để không bị vẽ đè; bài về muộn thì vòng dự phòng bên dưới dựng lại thẻ.
      if (miss.length) toast("Không tải được " + miss.length + " bài giáo trình (" + miss.join(", ") + ") — từ của bài chưa có trong phiên. Mở bài trong Giáo trình để thử lại.");
    };
    if (!ids.length) { go(); return; }
    app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải giáo trình…</p></div></div>';
    loadLessons(ids, go, 8000);
    // Bài nào về muộn hơn timeout: dựng lại thẻ khi tới, nếu đang ở trang chủ thì vẽ lại.
    ids.forEach(function (id) {
      loadLesson(id, function (ok) {
        if (!ok || !started || DECKS.some(function (d) { return d.id === id; })) return;
        rebuildItems();
        if (view === "home") render();
      });
    });
  }
  boot();
})();
</script>
</body>
</html>
