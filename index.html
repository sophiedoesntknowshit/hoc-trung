  // ---------- render chung ----------
  var lastView = "";
  // Màn được mở từ khúc 3 của phiên (phiên vẫn chạy, thanh nhỏ "Về phiên" ở trên). Sang màn khác (trang chủ, thống kê) = kết thúc phiên như cũ.
  var AWAY_VIEWS = { lesson: 1, "lesson-loading": 1, lessons: 1, exam: 1, "exam-loading": 1, exams: 1, roleplay: 1, "roleplay-loading": 1 };
  function render() {
    if (session && view !== "session" && !AWAY_VIEWS[view]) closeSession();
    updateMini();
    if (view !== "lesson" && reading) stopReading();
    voiceSweep(); // rời thẻ / câu đang ghi → bỏ bản ghi, tắt mic
    // Đổi màn: dừng giọng đọc còn dở (giọng máy của màn cũ không đọc đè sang màn mới).
    if (lastView && lastView !== view) { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } }
    lastView = view;
    if (view === "stats") app.innerHTML = statsHtml();
    else if (view === "leech") app.innerHTML = leechHtml();
    else if (view === "me") app.innerHTML = meHtml();
    else if (view === "dich") app.innerHTML = dichHtml();
    else if (view === "session") { app.innerHTML = sessionShellHtml(); renderCard(); tick(); }
    else if (view === "exams" && EXAM_INDEX.length) app.innerHTML = examsHtml();
    else if (view === "exam" && exam) renderExam(false);
    else if (view === "lessons" && LESSON_INDEX.length) { app.innerHTML = lessonsHtml(); centerOnTab(); }
    else if (view === "lesson" && lesson) { renderLesson(false); syncHistory(); return; }
    else if (view === "map" && MAP_INDEX.length) { app.innerHTML = mapHtml(); addTabBar(); syncHistory(); window.scrollTo(0, 0); mapScrollFocus(); return; }
    else if (view === "map-lv" && mapLv && mapLevelFull(mapLv.key)) app.innerHTML = mapLvHtml();
    else if (view === "roleplay" && rp) { renderRp(false); syncHistory(); return; }
    else if (view === "roleplay-loading") app.innerHTML = loadingHtml("Đang tải tình huống…", "rp-back", "Quay lại");
    else if (view === "map-loading") app.innerHTML = loadingHtml("Đang tải chủ đề…", "map", "Bản đồ");
    else if (view === "lesson-loading") app.innerHTML = loadingHtml("Đang tải bài…", "lessons", "Danh sách bài");
    else if (view === "exam-loading") app.innerHTML = loadingHtml("Đang tải đề…", "exams", "Danh sách đề");
    else { view = "home"; app.innerHTML = homeHtml(); }
    addTabBar();
    syncHistory();
    window.scrollTo(0, 0);
    if (view === "me" && aiFocusNext) aiFocusGo();
  }
  // Vẽ lại màn hiện tại nhưng giữ chỗ cuộn (tick nhiều ô cài đặt liền nhau không bị nhảy lên đầu trang).
  // Vẽ lại mà giữ chỗ: anchorSel = control vừa chạm, giữ đứng yên trên màn hình (dòng phía trên đổi cao thấp
  // cũng không làm trang nhảy); focusSel = ô trả focus bàn phím về sau khi vẽ (Tab tiếp theo không nhảy lên đầu trang).
  // Vẽ lại, giữ chỗ cuộn (+ mép trên của anchorSel) và focus (focusSel). Ô đang gõ trước khi vẽ = ô focusSel → giữ cả vị trí con trỏ / vùng chọn
  // (chữ không đổi). Không truyền focusSel mà đang gõ ô "✨ Nhánh mới" → tự giữ ô đó (mapAdvance vẽ lại khi AI soạn xong).
  function renderKeepScroll(anchorSel, focusSel) {
    var y = window.pageYOffset || 0, ae = document.activeElement, sel = null;
    if (!focusSel && ae && ae.getAttribute && ae.getAttribute("data-mnew")) focusSel = 'input[data-mnew="' + ae.getAttribute("data-mnew") + '"]';
    try {
      if (focusSel && ae && ae.matches && ae.matches(focusSel) && typeof ae.selectionStart === "number")
        sel = { v: ae.value, s: ae.selectionStart, e: ae.selectionEnd, d: ae.selectionDirection };
    } catch (e) { sel = null; }
    var a = anchorSel ? document.querySelector(anchorSel) : null, t0 = a ? a.getBoundingClientRect().top : null;
    render(); window.scrollTo(0, y);
    var b = anchorSel ? document.querySelector(anchorSel) : null;
    if (b && t0 != null) { var d = b.getBoundingClientRect().top - t0; if (d) window.scrollBy(0, d); }
    var f = focusSel ? document.querySelector(focusSel) : null;
    if (f && !f.disabled) {
      try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); }
      if (sel && f.value === sel.v) try { f.setSelectionRange(sel.s, sel.e, sel.d || "none"); } catch (e) { /* ô không hỗ trợ vùng chọn */ }
    }
  }

  // ---------- định tuyến bằng hash: nút Back của điện thoại quay về màn trước ----------

  app.addEventListener("compositionend", function (e) {
    if (!(e.target && e.target.getAttribute && e.target.getAttribute("data-mnew"))) return;
    mapComposing = false;
    if (mapRefreshPending) setTimeout(function () { if (!mapComposing && mapRefreshPending) mapAiRefresh(); }, 0);
  });
  app.addEventListener("focusout", function (e) {
    if (!(e.target && e.target.getAttribute && e.target.getAttribute("data-mnew"))) return;
    mapComposing = false;
    if (mapRefreshPending) setTimeout(function () { if (mapRefreshPending) mapAiRefresh(); }, 0);
  });
  // Ô khóa OpenAI (không nằm trong form để trình duyệt khỏi đòi lưu như mật khẩu): Enter = Lưu.
  app.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "aiKeyIn" && e.key === "Enter" && !e.isComposing) { e.preventDefault(); aiSaveKey(); }
    // Ô "✨ Nhánh mới" trong bản đồ: Enter = Soạn
    var mn = e.target && e.target.getAttribute && e.target.getAttribute("data-mnew");
    if (mn && e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!e.repeat) mapAiBranchStart(mn); }
  });
  // Điện thoại (màn cảm ứng): phím "Tiếp" của ô Pinyin khi ô Nghĩa còn trống → sang ô Nghĩa, chưa Kiểm tra. Máy tính: Enter = Kiểm tra như cũ. true = đã chuyển ô.
  function rcPyNext(t) {
    if (!t || t.id !== "rcPy" || !window.matchMedia || !matchMedia("(pointer:coarse)").matches) return false;
    var v = byId("rcVi");
    if (!v || String(v.value || "").trim()) return false;
    v.focus();
    return true;
  }
  // Ô gõ thẻ Dịch câu nằm trong form: phím "Xong/Enter" của bàn phím điện thoại (có máy không gửi keydown Enter) = Kiểm tra.
  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target && e.target.id === "trForm" && view === "session" && session) flip();
    if (e.target && (e.target.id === "rcForm" || e.target.id === "rcSenForm") && view === "session" && session && !rcPyNext(document.activeElement)) flip(); // Kiểm tra / Chấm câu
    if (e.target && e.target.id === "wuForm" && view === "session" && session) warmCheck();
    if (e.target && e.target.id === "rpForm" && view === "roleplay") rpSend();
  });
  // Listener gắn 1 lần trên #app (delegation) nên đổi thẻ / vẽ lại canvas không rò listener.
  if (window.PointerEvent) {
    app.addEventListener("pointerdown", onPointerDown);
    app.addEventListener("pointermove", onPointerMove);
    app.addEventListener("pointerup", onPointerUp);
    app.addEventListener("pointercancel", onPointerUp);
  } else {
    app.addEventListener("touchstart", onTouchStart, { passive: false });
    app.addEventListener("touchmove", onTouchMove, { passive: false });
    app.addEventListener("touchend", onPadEnd);
    app.addEventListener("touchcancel", onPadEnd);
    app.addEventListener("mousedown", onMouseDown);
    app.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onPadEnd);
  }

  document.addEventListener("keydown", function (e) {
    if (view !== "session" || !session) return;
    var t = e.target;
    // Ô gõ của thẻ Dịch câu / bài cũ / thẻ Nhận mặt chữ (pinyin, nghĩa, câu): Enter = Kiểm tra (trừ lúc bộ gõ đang ghép chữ),
    // Esc = rời ô; phím khác (Space, 1-4…) gõ bình thường, không thành phím tắt phiên.
    if (t && (t.id === "trInput" || t.id === "wuInput" || t.id === "rcPy" || t.id === "rcVi" || t.id === "rcSen")) {
      if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!e.repeat && !rcPyNext(t)) { if (t.id === "wuInput") warmCheck(); else flip(); } }
      else if (e.key === "Escape") { e.preventDefault(); t.blur(); }
      return;
    }
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var isSpace = key === " " || key === "Spacebar";
    // Space không cuộn trang; Space/Enter không "bấm" nút đang focus (vd. nút Kết thúc) thay cho phím tắt.
    if (isSpace || key === "Enter") {
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
    }
    // Giữ phím sẽ auto-repeat: chặn để Space giữ lâu không vừa lật vừa chấm Nhớ.
    if (e.repeat) { e.preventDefault(); return; }
    // Phím đã xử lý ở đây mà làm đổi màn (Esc, chuyển khúc, mở bài/đề) thì chặn luôn, không để examKey/lessonKey
    // (gắn sau, cùng document) xử lý lại phím đó ở màn mới.
    if (key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); escapeSession(); return; }
    if (warmActive()) { warmKey(e, key, isSpace); return; } // kiểm tra bài cũ đầu buổi
    var it = session.current;
    if (!it) {
      if (session.blocks && session.gate != null) { if (key === "Enter" || isSpace) { e.stopImmediatePropagation(); blkGo(); } return; } // thẻ chuyển khúc
      if (session.blocks) { // khúc 3: màn chọn
        if (key === "1") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenLesson(); }
        else if (key === "2") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenExam(); }
        else if (key === "3") { e.preventDefault(); e.stopImmediatePropagation(); blkOpenRp(); }
        else if (key === "Enter" && session.elapsed >= TARGET_SEC) endSession(true);
        return;
      }
      if (key === "Enter") endSession(true);
      return;
    }
    var mode = modeOf(it);
    if ((key === "r" || key === "R") && mode === "phrase" && micSupported()) { e.preventDefault(); recToggle("card:" + it.id); return; }
    if (isSpace) {
      if (mode === "new") return;
      if (!session.flipped) flip(); else gradeCurrent(3);
      return;
    }
    if (key === "Enter") {
      e.preventDefault();
      if (mode === "new") understood(); else if (!session.flipped) flip();
      return;
    }
    if (/^[1-4]$/.test(key) && mode !== "new" && session.flipped) {
      e.preventDefault();
      gradeCurrent(Number(key));
    }
  });
  // Phím tắt màn đề: tách riêng, chỉ chạy khi view === "exam" (phím phiên học ở trên chỉ chạy khi view === "session").
  document.addEventListener("keydown", examKey);
  // Phím tắt giáo trình: chỉ chạy khi view === "lesson" / "lessons".
  document.addEventListener("keydown", lessonKey);
  document.addEventListener("keydown", mapKey);
  document.addEventListener("keydown", rpKey);

  // ---------- khởi động ----------
  // Mở link / tải lại trang: về đúng màn theo hash. Mở mới (chưa có history.state của app) thì dựng
  // mục gốc = Trang chủ (+ mục Danh sách đề/bài nếu link trỏ thẳng vào đề/bài) để Back lùi từng màn.
  function initialRoute() {
    var h = location.hash, st = history.state;
    try {
      if (!(st && typeof st.n === "number")) {
        history.replaceState({ d: 0, n: 0 }, "", baseUrl());
        var mid = /^#exam\//.test(h) ? "#exams" : /^#lesson\//.test(h) ? "#lessons" : /^#map\//.test(h) || /^#roleplay\//.test(h) ? "#map" : "";
        if (mid) history.pushState({ d: 1, n: 1, p: "" }, "", mid);
      }
    } catch (e) { /* bỏ qua */ }
    routeTo(h);
  }
  // ---------- [P] app cài được (PWA): service worker, giữ dữ liệu lâu dài, nhắc xuất backup ----------
  // sw.js cài sẵn vỏ app → mở được khi mất mạng; bản mới chờ sẵn → thanh "Có bản mới · Tải lại" (không tự tải lại giữa phiên).
  var PWA_EXPORT_KEY = "hoctrung.lastexport.v1"; // lần xuất backup cuối (ms) — riêng máy này, không đi theo backup
  var PWA_REMIND_DAYS = 7;
  var PWA = { persist: null, prompt: null, waiting: null, reloading: false, installed: false };
  function pwaMarkExport() {
    try { localStorage.setItem(PWA_EXPORT_KEY, String(Date.now())); } catch (e) { /* bỏ qua */ }
    pwaRefresh();
    if (view === "home") renderKeepScroll(); // dòng nhắc "N ngày chưa xuất backup" ở Trang Học mất ngay
  }
  function pwaLastExport() {
    var n = 0;
    try { n = Number(localStorage.getItem(PWA_EXPORT_KEY)) || 0; } catch (e) { /* bỏ qua */ }
    return n;
  }
  // số ngày chưa xuất; chưa xuất lần nào thì tính từ buổi học đầu tiên (chưa học buổi nào → 0)
  function pwaBackupDays() {
    var last = pwaLastExport();
    if (!last) {
      var first = (db.sessions || []).map(function (s) { return s.date; }).filter(Boolean).sort()[0];
      last = first ? new Date(first + "T00:00:00").getTime() : Date.now();
    }
    return Math.max(0, Math.floor((Date.now() - last) / 86400000));
  }
  function pwaBackupDue() { return pwaBackupDays() > PWA_REMIND_DAYS; }
  // 1 dòng nhắc ở Trang Học (mảng notes) — "" khi chưa tới hạn
  function pwaHomeNote() {
    if (!pwaBackupDue()) return "";
    return '<span class="pwanote">' + ico("warn") + (pwaLastExport() ? pwaBackupDays() + " ngày chưa xuất backup" : "Chưa xuất backup lần nào") +
      ' · <button class="link" data-action="export">Xuất ngay</button></span>';
  }
  // các dòng thêm vào mục Sao lưu ở tab Tôi (giữ dữ liệu · xuất lần cuối · cài app)
  function pwaMeHtml() {
    var last = pwaLastExport(), due = pwaBackupDue(), d = last ? new Date(last) : null;
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent), web = /^https?:$/.test(location.protocol);
    var keep = PWA.persist === true
      ? '<div class="setting"><span>Dữ liệu: <b>được giữ lâu dài</b><small class="snote">Trình duyệt sẽ không tự xóa tiến độ khi máy đầy bộ nhớ.</small></span>' +
        '<span class="pwamk ok">' + ico("check") + 'giữ</span></div>'
      : '<div class="setting"><span>Dữ liệu: trình duyệt có thể tự xóa — <b>nhớ Xuất backup</b><small class="snote">Cài app ra màn hình chính để trình duyệt giữ dữ liệu lâu dài.</small></span>' +
        '<span class="pwamk due">' + ico("warn") + 'chưa chắc</span></div>';
    var exp = '<div class="setting"><span>' + (d ? 'Xuất lần cuối: <b>' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear() + '</b>' : 'Chưa xuất backup lần nào') +
      (due ? '<small class="snote due">' + (d ? 'Đã ' + pwaBackupDays() + ' ngày' : 'Đã học hơn ' + PWA_REMIND_DAYS + ' ngày') + ' — nên xuất lại để phòng mất dữ liệu.</small>'
        : '<small class="snote">Nhắc lại khi quá ' + PWA_REMIND_DAYS + ' ngày chưa xuất.</small>') + '</span>' +
      (due ? '<span class="pwamk due">' + ico("clock") + 'nhắc</span>' : d ? '<span class="pwamk ok">' + ico("check") + 'ổn</span>' : "") + '</div>';
    var inst = PWA.installed
      ? '<div class="setting"><span>Đang chạy như app đã cài<small class="snote">Mở từ màn hình chính · dùng được khi mất mạng.</small></span>' +
        '<span class="pwamk ok">' + ico("check") + 'đã cài</span></div>'
      : '<div class="setting"><span>Cài app: ' + (ios ? 'Safari → Chia sẻ → Thêm vào MH chính' : 'Chrome → ⋮ → Thêm vào màn hình chính') +
        '<small class="snote">' + (web ? 'Mở như app, không thanh địa chỉ · học được cả khi mất mạng (trừ AI và audio đề).' : 'Mở bản web (https) để cài app và dùng khi mất mạng.') + '</small></span>' +
        (PWA.prompt ? '<button class="small-btn" data-action="pwa-install">' + ico("down") + 'Cài app</button>' : "") + '</div>';
    return '<div class="pwabox" id="pwaBox">' + keep + exp + inst + '</div>';
  }
  // trạng thái đổi (persist trả về, có nút cài, vừa xuất…) → vẽ lại đúng khối của mình, không vẽ lại cả màn
  function pwaRefresh() {
    var box = byId("pwaBox");
    if (box) box.outerHTML = pwaMeHtml();
  }
  function pwaInstall() {
    var p = PWA.prompt;
    if (!p) return;
    PWA.prompt = null;
    try {
      p.prompt();
      p.userChoice.then(function (c) { if (c && c.outcome === "accepted") toast("Đang cài app…"); pwaRefresh(); }, pwaRefresh);
    } catch (e) { pwaRefresh(); }
  }
  // thanh nhỏ "Có bản mới · Tải lại" (ẩn trong phiên học — .wrap.sess / html.insess); bấm mới tải lại, không tự tải
  function pwaShowBar(worker) {
    PWA.waiting = worker;
    var bar = byId("swBar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "swBar"; bar.className = "swbar"; bar.setAttribute("role", "status");
      bar.innerHTML = '<span>Có bản mới</span><span aria-hidden="true">·</span><button type="button" class="swgo">Tải lại</button>' +
        '<button type="button" class="swx" title="Để sau" aria-label="Để sau">' + ico("x") + '</button>';
      bar.querySelector(".swgo").addEventListener("click", pwaApply);
      bar.querySelector(".swx").addEventListener("click", function () { bar.hidden = true; }); // để sau: bản mới tự vào ở lần mở app sau
      document.body.appendChild(bar);
    }
    bar.hidden = false;
  }
  function pwaApply() {
    var w = PWA.waiting;
    PWA.reloading = true;
    if (!w) { location.reload(); return; }
    w.postMessage({ type: "skip" }); // sw.js skipWaiting → controllerchange → tải lại
    setTimeout(function () { location.reload(); }, 4000); // dự phòng
  }
  function pwaWatch(reg) {
    var sw = navigator.serviceWorker;
    if (reg.waiting && sw.controller) pwaShowBar(reg.waiting);
    reg.addEventListener("updatefound", function () {
      var w = reg.installing;
      if (!w) return;
      w.addEventListener("statechange", function () { if (w.state === "installed" && sw.controller) pwaShowBar(w); });
    });
    // quay lại app sau một lúc → hỏi có bản mới không (tối đa 30 phút / lần)
    var checked = Date.now();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible" || Date.now() - checked < 1800000) return;
      checked = Date.now();
      reg.update().catch(function () { /* mất mạng */ });
    });
  }
  function pwaInit() {
    try { PWA.installed = !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; } catch (e) { /* bỏ qua */ }
    var st = navigator.storage;
    if (st && st.persisted) {
      st.persisted().then(function (p) { return p || (st.persist ? st.persist() : false); })
        .then(function (p) { PWA.persist = !!p; pwaRefresh(); }, function () { /* bỏ qua */ });
    }
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); PWA.prompt = e; pwaRefresh(); });
    window.addEventListener("appinstalled", function () { PWA.prompt = null; PWA.installed = true; pwaRefresh(); toast("Đã cài app — mở từ màn hình chính"); });
    app.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest('[data-action="pwa-install"]')) pwaInstall();
    });
    if (!/^https?:$/.test(location.protocol) || !("serviceWorker" in navigator)) return;
    var hadCtl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (PWA.reloading) { location.reload(); return; }
      if (hadCtl) return;
      // Lần mở đầu: bài / cấp / đề / từ điển nạp lúc boot (trước khi SW điều khiển trang) chưa vào cache → tải lại 1 lần qua SW để lưu.
      hadCtl = true;
      try {
        performance.getEntriesByType("resource").forEach(function (x) {
          if (/\/(lessons|map|exams|expand|dict)\/[^/?#]+\.js$/.test(x.name)) fetch(x.name).catch(function () { /* mất mạng: lần sau */ });
        });
      } catch (e) { /* bỏ qua */ }
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(pwaWatch, function () { /* không đăng ký được: app vẫn chạy như web thường */ });
    });
  }
  pwaInit();
  // Nạp file các bài giáo trình đang học TRƯỚC khi dựng thẻ (chờ xong/lỗi, tối đa 8s).
  function boot() {
    var ids = db.settings.enabledLessons.filter(function (id) { return !!LESSON_META[id]; });
    var topics = mapOnTopics(); // chủ đề có cấp bản đồ đang học: nạp cùng lúc với bài giáo trình
    var started = false, wait = (ids.length ? 1 : 0) + (topics.length ? 1 : 0);
    var go = function () {
      started = true;
      rebuildItems();
      var miss = ids.filter(function (id) { return !lessonData(id); });
      var mmiss = topics.filter(function (t) { return !mapData(t); });
      if (!DECKS.length) app.innerHTML = missingDecksHtml();
      else initialRoute();
      // Gọi sau render() để không bị vẽ đè; bài về muộn thì vòng dự phòng bên dưới dựng lại thẻ.
      if (miss.length) toast("Không tải được " + miss.length + " bài giáo trình (" + miss.join(", ") + ") — từ của bài chưa có trong phiên. Mở bài trong Giáo trình để thử lại.");
      else if (mmiss.length) toast("Không tải được bản đồ chủ đề (" + mmiss.join(", ") + ") — từ của cấp đang học chưa có trong phiên. Mở cấp trong Bản đồ để thử lại.");
      if (DECKS.length) mapAdvance(null, false); // tiến độ nhập từ backup / máy khác có thể đã đạt 80%
      if (dictFixNeeded()) setTimeout(function () { loadDict(); }, 2000); // dữ liệu AI đã lưu có "?" / pinyin hỏng → nạp từ điển để sửa
    };
    var part = function () { if (--wait <= 0) go(); };
    if (!wait) { go(); return; }
    app.innerHTML = loadingHtml("Đang tải giáo trình…");
    if (topics.length) {
      loadMapTopics(topics, part, 8000);
      topics.forEach(function (t) { // chủ đề về muộn hơn timeout: dựng lại thẻ khi tới
        loadMapTopic(t, function (ok) {
          if (!ok || !started || mapOnKeys().every(function (k) {
            return MAP_LV[k].topic.id !== t || DECKS.some(function (d) { return d.id === MAP_LV[k].deckId; });
          })) return;
          rebuildItems();
          if (view === "home") render();
        });
      });
    }
    if (!ids.length) return;
    loadLessons(ids, part, 8000);
    // Bài nào về muộn hơn timeout: dựng lại thẻ khi tới, nếu đang ở trang chủ thì vẽ lại.
    ids.forEach(function (id) {
      loadLesson(id, function (ok) {
        if (!ok || !started || DECKS.some(function (d) { return d.id === id; })) return;
        rebuildItems();
        if (view === "home") render();
      });
    });
  }
  boot();
})();
