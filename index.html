<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học tiếng Trung</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#20242e; --border:#2b303c;
  --text:#e9ebf1; --muted:#9aa3b3; --accent:#4f8cff; --accent-dark:#3a6fd8;
  --red:#e5484d; --orange:#f5a524; --green:#30a46c; --blue:#4f8cff;
  --gold:#f2c94c; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 72px}
h1{font-size:28px;margin:4px 0 2px}
h2{font-size:18px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.zh{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
button{font:inherit;color:var(--text);border:1px solid var(--border);background:var(--card2);
  border-radius:12px;padding:12px 18px;min-height:52px;cursor:pointer;font-size:17px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:var(--accent-dark)}
button.big{width:100%;font-size:21px;min-height:64px}
button.link{background:none;border:none;color:var(--accent);padding:0 8px;min-height:44px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
button.spk{background:none;border:1px solid var(--border);border-radius:999px;min-height:44px;min-width:44px;padding:6px 12px;font-size:22px}
button.spk.sm{min-height:34px;min-width:34px;font-size:16px;padding:2px 8px;vertical-align:middle}
button.small-btn{min-height:40px;padding:6px 14px;font-size:15px}
select,input[type=file]{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:44px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:14px 0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.decks{list-style:none;margin:0;padding:0}
.decks li{border-top:1px solid var(--border)}
.decks li:first-child{border-top:none}
.decks label{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer}
.decks .emoji{font-size:24px;width:32px;text-align:center;flex:none}
.decks .dtitle{flex:1;font-weight:600}
.decks .counts{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.setting{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.setting:first-of-type{border-top:none}
.setting span{flex:1}
.actions-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.actions-row button{padding:12px 8px;font-size:15px}
/* session bar */
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:5;border-bottom:1px solid var(--border);margin-bottom:14px}
.bar.nostick{position:static}
/* khổ ngang thấp (điện thoại xoay ngang): thanh audio phần Nghe gộp 1 hàng (bỏ tên đề, giữ nút Danh sách đề) */
@media (max-height:500px){.bar{padding:6px 0 4px;margin-bottom:8px}.bar.exbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.bar.exbar .bar-top b{display:none}.bar.exbar .audio-ctl{flex:1;margin-top:0}.bar.exbar .audio-ctl input[type=range]{min-width:70px}}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.track{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .5s linear}
.banner{background:#2a2612;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:600;text-align:center}
/* card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px 14px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.new{background:#13331f;border-color:var(--green);color:#7fe0a8}
.tag.recog{background:#132238;border-color:var(--blue);color:#9cc0ff}
.tag.recall{background:#2e1f0c;border-color:var(--orange);color:#ffd27a}
.tag.phrase{background:#2a1838;border-color:#a06bd8;color:#d7b6ff}
.hanzi{font-size:clamp(60px,16vw,104px);line-height:1.15;text-align:center;margin:8px 0 4px;letter-spacing:.04em}
.hanzi.mid{font-size:clamp(34px,8vw,48px);line-height:1.3}
.pinyin{text-align:center;font-size:24px;color:#bcd0ff;margin-top:6px}
.hanviet{text-align:center;color:var(--muted);margin-top:4px}
.hanviet b{color:var(--text)}
.meaning{text-align:center;font-size:24px;font-weight:600;margin:10px 0 4px}
.meaning.front{font-size:30px;margin:28px 0 8px}
.pos{text-align:center;color:var(--muted);margin-bottom:8px}
.chiettu{background:#1d2a1e;border:1px solid #2f5d3a;border-left:4px solid var(--green);border-radius:10px;padding:10px 12px;margin:14px 0}
.chiettu .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#7fe0a8;margin-bottom:4px;font-weight:700}
.examples{margin-top:12px}
.ex{border-top:1px solid var(--border);padding:10px 0}
.ex-zh{font-size:22px}
.ex-py{color:#bcd0ff;font-size:15px}
.ex-vi{color:var(--muted);font-size:15px}
.note{background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.when{text-align:center;color:var(--muted);font-style:italic;margin-top:14px}
.actions{margin-top:16px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades.two{grid-template-columns:repeat(2,1fr)}
.grades button{min-height:64px;font-weight:700;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grades small{font-weight:400;font-size:12px;color:var(--muted)}
/* điện thoại: hàng nút Lật / Đã hiểu / chấm điểm dính đáy màn hình, khỏi phải cuộn (-16px = padding ngang của .card) */
@media (max-width:600px){.dock{position:sticky;bottom:0;z-index:4;background:var(--card);margin:16px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)} .hint{display:none}}
.g1{background:#3a1d1f;border-color:var(--red)}
.g2{background:#3a2c12;border-color:var(--orange)}
.g3{background:#163525;border-color:var(--green)}
.g4{background:#16263f;border-color:var(--blue)}
.hint{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.hint kbd{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:inherit;font-size:12px}
.pad-wrap{text-align:center;margin:12px 0 4px}
.pad{display:block;margin:0 auto 8px;width:240px;height:240px;border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.big-emoji{font-size:64px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b303c;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.warn{background:#3a1d1f;border:1px solid var(--red);border-radius:var(--radius);padding:16px}
code{background:var(--card2);padding:1px 6px;border-radius:5px}
/* luyện đề */
.pad.wide{width:100%;max-width:640px;height:auto}
.exlist{list-style:none;margin:0;padding:0}
.exlist li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--border)}
.exlist li:first-child{border-top:none}
.exlist .info{flex:1;min-width:0}
.exlist .etitle{font-weight:600}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.audio-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.audio-ctl button{min-height:40px;padding:4px 10px;font-size:15px}
.audio-ctl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.audio-ctl input[type=range]{flex:1;min-width:120px;height:40px;margin:0;accent-color:var(--accent)}
.audio-ctl .time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.ptabs button{min-height:40px;padding:4px 12px;font-size:15px;white-space:nowrap;flex:none}
.ptabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-bottom:14px}
.qgrid button{min-height:38px;padding:2px;font-size:14px;border-radius:8px}
.qgrid button.ok{background:#163525;border-color:var(--green)}
.qgrid button.bad{background:#3a1d1f;border-color:var(--red)}
.qgrid button.done{background:#2b303c;border-color:var(--muted)}
.qgrid button.cur{outline:2px solid var(--gold);outline-offset:1px}
.opts{display:grid;gap:8px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:52px;width:100%}
.opt b{flex:none;width:22px}
.opt .ovi{display:block;color:var(--muted);font-size:14px}
.opt.right{background:#163525;border-color:var(--green)}
.opt.wrong{background:#3a1d1f;border-color:var(--red)}
.opt.dim{opacity:.55}
.opt.picked{border-color:var(--accent);background:#141c2c}
.opts.two .opt{justify-content:center;text-align:center;font-weight:700}
.opts.cloze{grid-template-columns:repeat(3,1fr)}
.opts.cloze .opt{padding:12px 10px;gap:6px;align-items:center}
.opts.cloze .opt b{width:auto}
.opts.cloze .opt .zh{white-space:nowrap}
.qtext{font-size:22px;margin:8px 0}
.passage{font-size:19px;line-height:1.7;background:var(--card2);border-radius:10px;padding:10px 12px;margin:8px 0}
.script{background:var(--card2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:18px;line-height:1.6}
.script .vi,.vi-line{color:var(--muted);font-size:15px;margin-top:4px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0;font-size:18px}
.bank div{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.bank div.used{opacity:.45;text-decoration:line-through}
.seg{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:18px}
.seg b{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:1px dashed var(--border);border-radius:10px;margin:8px 0}
.chips button{min-height:44px;padding:6px 12px;font-size:20px}
.chips button.used{opacity:.3}
.chips.ans{border-color:var(--accent);background:#141c2c}
.seq{font-size:24px;letter-spacing:.1em;text-align:center;margin:8px 0;font-weight:700}
textarea{width:100%;min-height:80px;font:inherit;font-size:20px;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px}
.result{border-radius:10px;padding:10px 12px;margin-top:14px;font-weight:700}
.result.ok{background:#163525;border:1px solid var(--green)}
.result.bad{background:#3a1d1f;border:1px solid var(--red)}
.result.na{background:var(--card2);border:1px solid var(--border)}
.result small{font-weight:400;color:var(--muted)}
.vocab{margin-top:12px}
.vrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:8px 0;flex-wrap:wrap}
.vrow .vh{font-size:22px}
.vrow .vt{flex:1;min-width:150px;font-size:15px}
.vrow .vt .py{color:#bcd0ff}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* giáo trình */
.decks li.lsdeck{display:flex;align-items:center;gap:12px}
.decks li.lsdeck label{flex:1;min-width:0}
.decks li.lsdeck button.link{flex:none;min-width:44px;min-height:44px;padding:0 10px;border-left:1px solid var(--border)}
/* màn hẹp: số đếm xuống dòng dưới tên (78px = checkbox 22 + gap 12 + emoji 32 + gap 12) để tên không bị ép thành cột */
@media (max-width:480px){
  .decks label{flex-wrap:wrap;row-gap:2px}
  .decks .dtitle{flex:1 1 0;min-width:0}
  .decks .counts{flex-basis:100%;text-align:left;padding-left:78px}
}
.tag.ai{background:#2a1838;border-color:#a06bd8;color:#d7b6ff}
.tag.on{background:#13331f;border-color:var(--green);color:#7fe0a8}
.lshead{text-align:center;margin:6px 0 4px}
.lshead .em{font-size:44px}
.lshead .tzh{font-size:30px;font-weight:700;margin:2px 0}
.goals{margin:6px 0 0;padding-left:20px;font-size:15px;color:var(--muted)}
button.lstoggle{width:100%;min-height:58px;font-size:18px;font-weight:700;margin:10px 0}
button.lstoggle.on{background:#163525;border-color:var(--green)}
.wrow{border-top:1px solid var(--border);padding:10px 4px;cursor:pointer}
.wrow:first-child{border-top:none}
.wrow .wtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrow .wh{font-size:30px;line-height:1.2}
.wrow .wt{flex:1;min-width:150px;font-size:15px}
.wrow .wt .py{color:#bcd0ff;font-size:17px}
.wrow .wt .mn{color:var(--text);font-weight:600}
.wrow.open{background:#141c2c;border-radius:10px}
.wmore{cursor:auto;margin-top:6px}
.gp{border-top:1px solid var(--border);padding:14px 0}
.gp:first-child{border-top:none;padding-top:0}
.gp .gpt{font-size:26px;font-weight:700}
.gp .gpn{color:var(--muted);margin-bottom:8px}
.struct{background:#132238;border:1px solid var(--blue);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:19px;font-weight:600}
.mistake{background:#3a1d1f;border:1px solid #6b2a2d;border-left:4px solid var(--red);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.tline{display:flex;gap:8px;align-items:flex-start;padding:8px 6px;border-top:1px solid var(--border);border-radius:8px}
.tline:first-child{border-top:none}
.tline.reading{background:#2a2612;outline:1px solid var(--gold)}
.tline .spkr{flex:none;font-weight:700;color:var(--gold);min-width:28px;font-size:18px;padding-top:2px}
.tline .tb{flex:1;min-width:0}
.tline .tzh{font-size:22px;line-height:1.5}
.qz{border-top:1px solid var(--border);padding:12px 0}
.qz:first-child{border-top:none;padding-top:0}
.ptabs.lstabs{overflow-x:visible;position:sticky;top:0;z-index:5;background:var(--bg)}
.ptabs.lstabs button{flex:1 1 0;min-width:0;padding:4px 6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<audio id="examAudio" preload="metadata" hidden></audio>

<script src="decks/chao-hoi.js"></script>
<script src="decks/an-uong.js"></script>
<script src="decks/di-lai.js"></script>
<script src="decks/hoi-duong.js"></script>
<script src="decks/mua-sam.js"></script>
<script src="decks/khach-san.js"></script>
<script src="decks/san-bay-du-lich.js"></script>
<script src="decks/thoi-tiet-thoi-gian.js"></script>
<script src="decks/tam-chuyen.js"></script>
<script src="decks/suc-khoe.js"></script>
<script src="decks/dien-thoai-thanh-toan.js"></script>
<script src="decks/nha-cua-sinh-hoat.js"></script>
<script src="exams/index.js"></script>
<script src="lessons/index.js"></script>

<script>
(function () {
  "use strict";

  // ---------- hằng số ----------
  var STORE_KEY = "hoctrung.v1";
  var DAY_MS = 86400000;
  var TARGET_SEC = 45 * 60;
  var RELEARN_GAP = 8;
  var REFILL_NEW = 5;
  var REFILL_EARLY = 10;
  var MIN_CARDS_FOR_STREAK = 5;
  var NEW_OPTIONS = [5, 10, 15, 20];

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var BASE_DECKS = Array.isArray(window.DECKS) ? window.DECKS.filter(function (d) { return d && d.id; }) : [];
  var DECKS = BASE_DECKS.slice(); // + deck ảo "Từ trong đề" khi có từ (xem rebuildItems)

  // ---------- tiện ích ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function fmtClock(sec) { return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60); }
  function dateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function fmtDate(key) { var p = String(key).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : key; }
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function round2(x) { return Math.round(x * 100) / 100; }
  function byId(id) { return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2600);
  }

  // ---------- từ lưu từ đề thi (bộ "📝 Từ trong đề") ----------
  var CUSTOM_KEY = "hoctrung.custom.v1";
  var CUSTOM_DECK_ID = "tu-de-thi";
  function normalizeCustom(arr) {
    var out = [], seen = {};
    (Array.isArray(arr) ? arr : []).forEach(function (w) {
      if (!w || typeof w !== "object" || !w.hanzi || seen[w.hanzi]) return;
      seen[w.hanzi] = true;
      out.push({ hanzi: String(w.hanzi), pinyin: String(w.pinyin || ""), hanviet: String(w.hanviet || ""), vi: String(w.vi || ""), from: String(w.from || "") });
    });
    return out;
  }
  function loadCustom() {
    try { return normalizeCustom(JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]")); } catch (e) { return []; }
  }
  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(CUSTOM)); return true; }
    catch (e) { toast("Không lưu được từ (trình duyệt chặn localStorage?)"); return false; }
  }
  var CUSTOM = loadCustom();
  function customHas(hanzi) { return CUSTOM.some(function (w) { return w.hanzi === hanzi; }); }
  function customDeck() {
    return {
      id: CUSTOM_DECK_ID, title: "Từ trong đề", emoji: "📝", phrases: [],
      words: CUSTOM.map(function (w) {
        var m = /^(.*)#(\d+)$/.exec(w.from);
        return {
          hanzi: w.hanzi, pinyin: w.pinyin, hanviet: w.hanviet, meaning: w.vi, chiettu: "", examples: [],
          note: m ? "Gặp trong đề " + m[1] + ", câu " + m[2] + "." : ""
        };
      })
    };
  }

  // ---------- giáo trình HSK chuẩn: chỉ mục + nạp lười ----------
  var LESSON_ID_RE = /^[A-Za-z0-9_.-]+$/;
  var LESSON_INDEX = Array.isArray(window.LESSON_INDEX) ? window.LESSON_INDEX.filter(function (l) { return l && l.id && LESSON_ID_RE.test(l.id); }) : [];
  var LESSON_META = {};
  LESSON_INDEX.forEach(function (l) { LESSON_META[l.id] = l; });
  function lessonData(id) { var L = window.LESSONS && window.LESSONS[id]; return L && typeof L === "object" ? L : null; }
  var lessonWaiters = {}; // id -> [callback(ok)] khi đang tải
  function loadLesson(id, cb) {
    if (!LESSON_META[id]) { cb(false); return; }
    if (lessonData(id)) { cb(true); return; }
    if (lessonWaiters[id]) { lessonWaiters[id].push(cb); return; }
    lessonWaiters[id] = [cb];
    var s = document.createElement("script"), done = false;
    var finish = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (s.parentNode) s.parentNode.removeChild(s);
      var ok = !!lessonData(id), cbs = lessonWaiters[id] || [];
      delete lessonWaiters[id];
      cbs.forEach(function (f) { try { f(ok); } catch (e) { /* bỏ qua */ } });
    };
    var timer = setTimeout(finish, 10000);
    s.onload = finish; s.onerror = finish;
    s.src = "lessons/" + id + ".js";
    document.body.appendChild(s);
  }
  // Nạp nhiều bài; gọi cb đúng 1 lần khi tất cả xong/lỗi hoặc quá timeout.
  function loadLessons(ids, cb, timeoutMs) {
    var left = ids.length, called = false;
    var end = function () { if (called) return; called = true; clearTimeout(t); cb(); };
    var t = setTimeout(end, timeoutMs || 8000);
    if (!left) { end(); return; }
    ids.forEach(function (id) { loadLesson(id, function () { if (--left <= 0) end(); }); });
  }
  function lessonDeck(id) {
    var L = lessonData(id), m = LESSON_META[id] || {};
    if (!L) return null;
    var level = L.level || m.level || "", no = L.lesson || m.lesson || "";
    return {
      id: id, lesson: true, emoji: L.emoji || m.emoji || "📘",
      title: "HSK" + level + " · B" + no + " " + (L.title_zh || m.title_zh || ""),
      words: Array.isArray(L.words) ? L.words : [], phrases: Array.isArray(L.phrases) ? L.phrases : []
    };
  }
  function lessonDecks() {
    var ids = db && db.settings && Array.isArray(db.settings.enabledLessons) ? db.settings.enabledLessons : [];
    return LESSON_INDEX.filter(function (l) { return ids.indexOf(l.id) >= 0; })
      .map(function (l) { return lessonDeck(l.id); }).filter(Boolean);
  }

  // ---------- dữ liệu thẻ ----------
  var ITEMS = [];
  var ITEM_BY_ID = {};
  function rebuildItems() {
    DECKS = BASE_DECKS.concat(lessonDecks(), CUSTOM.length ? [customDeck()] : []);
    ITEMS = []; ITEM_BY_ID = {};
    DECKS.forEach(function (deck) {
      (Array.isArray(deck.words) ? deck.words : []).forEach(function (w) {
        if (!w || !w.hanzi) return;
        var id = deck.id + ":" + w.hanzi;
        if (ITEM_BY_ID[id]) return;
        var it = { id: id, deckId: deck.id, deck: deck, kind: "word", data: w };
        ITEMS.push(it); ITEM_BY_ID[id] = it;
      });
      (Array.isArray(deck.phrases) ? deck.phrases : []).forEach(function (p, i) {
        if (!p || !p.zh) return;
        var id = deck.id + ":p:" + i;
        var it = { id: id, deckId: deck.id, deck: deck, kind: "phrase", data: p };
        ITEMS.push(it); ITEM_BY_ID[id] = it;
      });
    });
  }
  rebuildItems();

  // ---------- lưu trữ ----------
  function defaultDb() {
    return {
      cards: {},
      sessions: [],
      settings: { newPerSession: 10, drawPad: true, autoSpeak: true, selectedDecks: DECKS.map(function (d) { return d.id; }), enabledLessons: [] }
    };
  }
  function num(x, d) { x = Number(x); return isFinite(x) ? x : d; }
  function normalizeCard(c) {
    if (!c || typeof c !== "object") return null;
    var st = c.state === "learning" || c.state === "review" || c.state === "new" ? c.state : "new";
    return {
      state: st, ease: Math.max(1.3, num(c.ease, 2.5)), interval: Math.max(0, num(c.interval, 0)),
      due: num(c.due, 0), reps: Math.max(0, Math.floor(num(c.reps, 0))),
      lapses: Math.max(0, Math.floor(num(c.lapses, 0))), last: num(c.last, 0)
    };
  }
  function normalizeDb(obj) {
    var base = defaultDb();
    if (!obj || typeof obj !== "object") return base;
    if (obj.cards && typeof obj.cards === "object") {
      Object.keys(obj.cards).forEach(function (id) {
        var c = normalizeCard(obj.cards[id]);
        if (c) base.cards[id] = c;
      });
    }
    if (Array.isArray(obj.sessions)) base.sessions = obj.sessions.filter(function (s) { return s && typeof s === "object"; });
    var s = obj.settings;
    if (s && typeof s === "object") {
      if (NEW_OPTIONS.indexOf(Number(s.newPerSession)) >= 0) base.settings.newPerSession = Number(s.newPerSession);
      if (typeof s.drawPad === "boolean") base.settings.drawPad = s.drawPad;
      if (typeof s.autoSpeak === "boolean") base.settings.autoSpeak = s.autoSpeak;
      if (Array.isArray(s.selectedDecks)) base.settings.selectedDecks = s.selectedDecks.slice();
      if (Array.isArray(s.enabledLessons)) {
        // Bỏ id không có trong chỉ mục (không mở được để gỡ ra) — trừ khi chỉ mục không tải được.
        base.settings.enabledLessons = s.enabledLessons.filter(function (id, i, a) {
          return typeof id === "string" && LESSON_ID_RE.test(id) && a.indexOf(id) === i && (!LESSON_INDEX.length || !!LESSON_META[id]);
        });
      }
    }
    return base;
  }
  function loadDb() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return defaultDb();
    try { return normalizeDb(JSON.parse(raw)); } catch (e) { return defaultDb(); }
  }
  function saveDb() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
    catch (e) { toast("Không lưu được tiến độ (trình duyệt chặn localStorage?)"); return false; }
  }
  var db = loadDb();

  function newCard() { return { state: "new", ease: 2.5, interval: 0, due: 0, reps: 0, lapses: 0, last: 0 }; }
  function cardOf(id) { return db.cards[id] || newCard(); }
  function cardState(id) { var c = db.cards[id]; return c && c.state ? c.state : "new"; }
  function isNewItem(it) { return cardState(it.id) === "new"; }
  function isDue(id, now) { var c = db.cards[id]; return !!c && c.state !== "new" && c.due <= now; }

  function selectedDecks() {
    var sel = db.settings.selectedDecks;
    return DECKS.filter(function (d) { return sel.indexOf(d.id) >= 0; });
  }

  // ---------- SRS (SM-2 rút gọn) ----------
  // due của Khó/Nhớ/Dễ tính từ 0h hôm nay + interval ngày, để thẻ luôn tới hạn ngay từ sáng.
  function computeGrade(card, grade, now) {
    var c = {
      state: card.state, ease: card.ease, interval: card.interval,
      due: card.due, reps: card.reps, lapses: card.lapses, last: card.last
    };
    var today = startOfDay(now);
    if (grade === 1) {
      c.lapses += 1; c.interval = 0; c.ease = Math.max(1.3, round2(c.ease - 0.2));
      c.state = "learning"; c.due = now;
    } else if (grade === 2) {
      c.interval = c.interval === 0 ? 1 : Math.max(1, Math.round(c.interval * 1.2));
      c.ease = Math.max(1.3, round2(c.ease - 0.15));
      c.due = today + c.interval * DAY_MS; c.state = "review";
    } else if (grade === 3) {
      c.interval = c.interval === 0 ? 1 : c.interval === 1 ? 3 : Math.round(c.interval * c.ease);
      c.due = today + c.interval * DAY_MS; c.state = "review";
    } else {
      c.interval = c.interval === 0 ? 3 : Math.round(Math.max(c.interval * c.ease * 1.3, c.interval + 2));
      c.ease = round2(c.ease + 0.15);
      c.due = today + c.interval * DAY_MS; c.state = "review";
    }
    c.reps += 1; c.last = now;
    return c;
  }
  function intervalLabel(card, grade) {
    var c = computeGrade(card, grade, Date.now());
    if (grade === 1) return "lát nữa";
    return c.interval + " ngày";
  }
  function applyGrade(id, grade) {
    db.cards[id] = computeGrade(cardOf(id), grade, Date.now());
    saveDb();
  }

  // ---------- phát âm ----------
  var zhVoice = null;
  function pickVoice() {
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      var best = null, any = null;
      for (var i = 0; i < vs.length; i++) {
        var lang = String(vs[i].lang || "").replace("_", "-");
        if (/^zh-CN/i.test(lang) || /^cmn/i.test(lang)) { best = vs[i]; break; }
        if (!any && /^zh/i.test(lang)) any = vs[i];
      }
      zhVoice = best || any;
    } catch (e) { zhVoice = null; }
  }
  if (window.speechSynthesis) {
    pickVoice();
    try {
      if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
      else window.speechSynthesis.onvoiceschanged = pickVoice;
    } catch (e) { /* bỏ qua */ }
  }
  function speak(text) {
    if (!text || !window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
    if (!zhVoice) pickVoice();
    if (reading) stopReading();
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = "zh-CN";
      u.rate = 0.9;
      if (zhVoice) u.voice = zhVoice;
      window.speechSynthesis.speak(u);
    } catch (e) { /* không có giọng thì thôi */ }
  }
  // Đọc cả bài khóa: đọc lần lượt từng dòng (nối onend), tô dòng đang đọc. Bấm lại / 🔊 khác / rời màn = dừng.
  var reading = null;   // { key, u } đang đọc
  var readToken = 0;
  function markReadLine(elId) {
    var olds = app.querySelectorAll(".tline.reading");
    for (var i = 0; i < olds.length; i++) olds[i].classList.remove("reading");
    var el = elId ? byId(elId) : null;
    if (el) {
      el.classList.add("reading");
      try { el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) { /* bỏ qua */ }
    }
  }
  function updateReadUi() {
    var btns = app.querySelectorAll('[data-action="ls-read"]');
    for (var i = 0; i < btns.length; i++) {
      var on = !!reading && reading.key === btns[i].getAttribute("data-t");
      btns[i].textContent = on ? "⏹ Dừng đọc" : "▶ Đọc cả bài";
      btns[i].className = "small-btn" + (on ? " primary" : "");
    }
  }
  function stopReading() {
    readToken++;
    var was = !!reading;
    reading = null;
    if (was) { try { window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } }
    markReadLine(null); updateReadUi();
  }
  function readAll(key, lines) {
    if (reading && reading.key === key) { stopReading(); return; }
    stopReading();
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") { toast("Trình duyệt không hỗ trợ đọc"); return; }
    if (!lines.length) return;
    if (!zhVoice) pickVoice();
    try { window.speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ }
    var token = ++readToken;
    reading = { key: key, u: null };
    var play = function (i) {
      if (token !== readToken) return;
      if (i >= lines.length) { stopReading(); return; }
      reading.elId = lines[i].elId;
      markReadLine(lines[i].elId);
      var u = new SpeechSynthesisUtterance(String(lines[i].text));
      u.lang = "zh-CN"; u.rate = 0.9;
      if (zhVoice) u.voice = zhVoice;
      u.onend = function () { if (token === readToken) setTimeout(function () { play(i + 1); }, 250); };
      u.onerror = u.onend;
      reading.u = u; // giữ tham chiếu để Chrome không thu gom mất onend
      try { window.speechSynthesis.speak(u); } catch (e) { stopReading(); }
    };
    updateReadUi();
    play(0);
  }

  // ---------- thống kê ----------
  function streak() {
    var byDay = {};
    db.sessions.forEach(function (s) { if (s && s.date) byDay[s.date] = (byDay[s.date] || 0) + (Number(s.cards) || 0); });
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!(byDay[dateKey(d)] >= MIN_CARDS_FOR_STREAK)) d.setDate(d.getDate() - 1);
    var n = 0;
    while (byDay[dateKey(d)] >= MIN_CARDS_FOR_STREAK) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function deckCounts(deck, now) {
    var r = { fresh: 0, learning: 0, due: 0, review: 0 };
    ITEMS.forEach(function (it) {
      if (it.deckId !== deck.id) return;
      var c = db.cards[it.id];
      if (!c || c.state === "new") { r.fresh++; return; }
      if (c.state === "learning") r.learning++; else r.review++;
      if (c.due <= now) r.due++;
    });
    return r;
  }
  function dueCount(decks, now) {
    var ids = {}; decks.forEach(function (d) { ids[d.id] = true; });
    return ITEMS.filter(function (it) { return ids[it.deckId] && isDue(it.id, now); }).length;
  }
  // Đếm trên db.cards (không phải ITEMS) để thẻ của bài giáo trình đã bỏ khỏi phiên vẫn được tính.
  function learnedCount() {
    return Object.keys(db.cards).filter(function (k) {
      var p = k.split(":")[0];
      return db.cards[k].state !== "new" && (ITEM_BY_ID[k] || LESSON_META[p]);
    }).length;
  }

  // ---------- hàng đợi ----------
  function deckNewOrder(deck) {
    var words = [], phrases = [];
    ITEMS.forEach(function (it) {
      if (it.deckId !== deck.id || !isNewItem(it)) return;
      (it.kind === "word" ? words : phrases).push(it);
    });
    var out = [], wi = 0, pi = 0;
    while (wi < words.length || pi < phrases.length) {
      for (var k = 0; k < 3 && wi < words.length; k++) out.push(words[wi++]);
      if (pi < phrases.length) out.push(phrases[pi++]);
    }
    return out;
  }
  // Xếp vòng tròn: mỗi vòng lấy 1 thẻ của từng danh sách.
  function rrMerge(lists) {
    var rr = [], i = 0, any = true;
    while (any) {
      any = false;
      lists.forEach(function (l) { if (i < l.length) { rr.push(l[i]); any = true; } });
      i++;
    }
    return rr;
  }
  // Xen kẽ 1-1 hai danh sách; hết bên nào thì lấy nốt bên kia.
  function alt(x, y) {
    var out = [], a = 0, b = 0;
    while (a < x.length || b < y.length) {
      if (a < x.length) out.push(x[a++]);
      if (b < y.length) out.push(y[b++]);
    }
    return out;
  }
  function buildNewPool(decks) {
    var base = rrMerge(decks.filter(function (d) { return d.id !== CUSTOM_DECK_ID && !d.lesson; }).map(deckNewOrder));
    // Bài giáo trình đang học có lượt riêng, xen 1-1 với 12 chủ đề — nếu chỉ xếp chung vòng tròn
    // thì mỗi bài chỉ được ~1/14 số từ mới, bài 50 từ cần hàng chục phiên mới học hết.
    var less = rrMerge(decks.filter(function (d) { return d.lesson; }).map(deckNewOrder));
    // Từ người học tự bấm "+ Ôn" (bộ 📝) đi trước, xen kẽ 1-1 với phần còn lại — nếu chỉ
    // xếp vòng tròn thì bộ 📝 đứng cuối, với 10 từ mới/phiên sẽ không bao giờ tới lượt.
    var cd = decks.filter(function (d) { return d.id === CUSTOM_DECK_ID; })[0];
    var cl = cd ? deckNewOrder(cd) : [];
    return alt(cl, alt(less, base));
  }
  function dueItems(decks, now) {
    var ids = {}; decks.forEach(function (d) { ids[d.id] = true; });
    return ITEMS.filter(function (it) { return ids[it.deckId] && isDue(it.id, now); })
      .sort(function (a, b) { return db.cards[a.id].due - db.cards[b.id].due; });
  }
  function interleave(reviews, news) {
    var out = [], r = 0, n = 0;
    while (r < reviews.length || n < news.length) {
      for (var k = 0; k < 3 && r < reviews.length; k++) out.push(reviews[r++]);
      if (n < news.length) out.push(news[n++]);
    }
    return out;
  }
  function modeOf(it) {
    if (it.kind === "phrase") return "phrase";
    var c = db.cards[it.id];
    if (!c || c.state === "new") return "new";
    return c.reps % 2 === 0 ? "recog" : "recall";
  }

  // ---------- phiên học ----------
  var view = "home";
  var session = null;

  function startSession() {
    var decks = selectedDecks();
    if (!decks.length) { toast("Chọn ít nhất 1 chủ đề đã"); return; }
    if (session && session.timerId) clearInterval(session.timerId);
    var now = Date.now();
    var pool = buildNewPool(decks);
    var firstNew = pool.splice(0, db.settings.newPerSession);
    session = {
      startedAt: now, elapsed: 0, timerId: null, decks: decks,
      queue: interleave(dueItems(decks, now), firstNew), newPool: pool,
      current: null, flipped: false, hint: false, keepPad: false,
      shown45: false, doneCount: 0, touched: {}, spokenFor: ""
    };
    view = "session";
    syncHistory();
    app.innerHTML = sessionShellHtml();
    nextCard();
    session.timerId = setInterval(tick, 1000);
  }
  function syncElapsed() { session.elapsed = Math.floor((Date.now() - session.startedAt) / 1000); }
  function tick() {
    if (!session) return;
    syncElapsed();
    var clock = byId("clock"); if (clock) clock.textContent = fmtClock(session.elapsed) + " / 45:00";
    var prog = byId("prog"); if (prog) prog.style.width = Math.min(100, session.elapsed / TARGET_SEC * 100) + "%";
    if (session.elapsed >= TARGET_SEC && !session.shown45) {
      session.shown45 = true;
      var b = byId("banner45"); if (b) b.hidden = false;
      toast("Đủ 45 phút rồi 🎉 học tiếp thì cứ tiếp");
    }
  }
  function requeue(it) {
    session.queue.splice(Math.min(RELEARN_GAP, session.queue.length), 0, it);
  }
  function refillQueue() {
    syncElapsed();
    if (session.elapsed >= TARGET_SEC) return;
    var more = session.newPool.splice(0, REFILL_NEW);
    if (more.length) { session.queue = session.queue.concat(more); return; }
    var ids = {}; session.decks.forEach(function (d) { ids[d.id] = true; });
    var early = ITEMS.filter(function (it) { return ids[it.deckId] && cardState(it.id) !== "new"; })
      .sort(function (a, b) {
        var ta = session.touched[a.id] ? 1 : 0, tb = session.touched[b.id] ? 1 : 0;
        return ta !== tb ? ta - tb : db.cards[a.id].due - db.cards[b.id].due;
      })
      .slice(0, REFILL_EARLY);
    session.queue = session.queue.concat(early);
  }
  function nextCard() {
    session.flipped = false; session.hint = false; session.keepPad = false;
    if (!session.queue.length) refillQueue();
    session.current = session.queue.shift() || null;
    renderCard();
  }
  // Ghi phiên ngay khi học (không chờ bấm Kết thúc): reload / đóng tab giữa chừng vẫn tính phút + thẻ + streak.
  // session.rec là chính object nằm trong db.sessions → mỗi lần saveDb() là cập nhật dòng đó.
  function recordSession() {
    if (!session) return;
    syncElapsed();
    var n = Object.keys(session.touched).length;
    if (!n) return;
    if (!session.rec) {
      session.rec = { date: dateKey(new Date()), minutes: 0, cards: 0, startedAt: session.startedAt };
      db.sessions.push(session.rec);
      if (db.sessions.length > 400) db.sessions = db.sessions.slice(-400);
    }
    session.rec.minutes = Math.round(session.elapsed / 60);
    session.rec.cards = n;
    saveDb();
  }
  function markTouched(it) { session.doneCount++; session.touched[it.id] = true; recordSession(); }
  function understood() {
    var it = session.current;
    if (!it || modeOf(it) !== "new") return;
    var c = cardOf(it.id);
    c.state = "learning"; c.interval = 0; c.due = Date.now();
    db.cards[it.id] = c; saveDb();
    markTouched(it); requeue(it); nextCard();
  }
  function flip() {
    if (!session.current || session.flipped || modeOf(session.current) === "new") return;
    session.flipped = true; session.keepPad = true;
    renderCard();
  }
  function showHint() {
    if (!session.current || session.hint) return;
    session.hint = true; session.keepPad = true;
    renderCard();
  }
  function gradeCurrent(grade) {
    var it = session.current;
    if (!it || !session.flipped) return;
    if (modeOf(it) === "phrase" && grade !== 1 && grade !== 3) return;
    applyGrade(it.id, grade);
    markTouched(it);
    if (grade === 1) requeue(it);
    nextCard();
  }
  function endSession(force) {
    if (!session) return;
    syncElapsed();
    if (!force && session.elapsed < TARGET_SEC && !confirm("Chưa đủ 45 phút đâu, thoát thật không?")) return;
    closeSession();
    view = "home"; render();
  }
  // Lưu lần cuối + dừng đồng hồ + bỏ phiên (dùng chung cho Kết thúc và nút Back của điện thoại).
  function closeSession() {
    if (!session) return;
    recordSession();
    clearInterval(session.timerId); session.timerId = null;
    var r = session.rec || { minutes: 0, cards: 0 };
    session = null;
    toast("Đã lưu phiên: " + r.minutes + " phút, " + r.cards + " thẻ");
  }
  window.addEventListener("pagehide", recordSession);

  // câu thứ hai không có t → lùi về câu gần nhất có t trong cùng phần.

  // Viết 1: đáp án gốc đôi khi chấp nhận cả câu đảo ("Đáp án gốc cũng chấp nhận 对这个城市我很熟悉。").
  // Nhận: answer + mảng alt (nếu dữ liệu có) + câu chữ Hán đứng sau chữ "chấp nhận" trong explain,
  // nhưng chỉ khi câu đó dùng đúng y các mảnh đề cho (tránh nhận nhầm câu ví dụ khác).
  function buildAnswers(it) {

    if (prog.ans[it.n]) return;

    if (it.answer != null) {
      if (type === "tf") ok = pick === isTrue(it.answer);
      else if (type === "build") ok = buildAnswers(it).indexOf(normSent(pick)) >= 0;
      else ok = String(pick).toUpperCase() === String(it.answer).toUpperCase();

  function examKey(e) {
    var t = e.target;

    // Danh sách đề / đang tải: Esc về trang chủ (giống màn Giáo trình).

    if (key === "ArrowLeft") { e.preventDefault(); examMove(-1); return; }

      if (!hasAudio()) return; // đề không audio: để Space cuộn trang như bình thường
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();

      return;
    }
    if (e.repeat) return;
    var it = curItem(), type = partType(curPart()), a = curAns();

      return;
    }
    if (key === "Backspace") {
      if (a) return;
      if (type === "order" && exam.order) { e.preventDefault(); exam.order = exam.order.slice(0, -1); renderExam(true); }
      else if (type === "build" && exam.build.length) { e.preventDefault(); exam.build.pop(); renderExam(true); }
      return;
    }

      var ks = optionKeys(it, type);

  function renderLesson(keepScroll) {
    if (!lesson) return;

    app.innerHTML = lessonHtml();
    // Đổi tab: giữ chỗ cuộn nếu còn ở trên hàng tab; đã cuộn qua thì đưa hàng tab lên sát mép trên (không về đầu trang).
    if (keepScroll === "tab") {
      var t = app.querySelector(".lstabs");
      var top = 0;
      if (t) { // hàng tab dính (sticky): đo vị trí gốc khi tạm tắt dính
        t.style.position = "static";
        top = Math.max(0, t.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) - 8);
        t.style.position = "";
      }
      window.scrollTo(0, Math.min(y, top));
    } else window.scrollTo(0, keepScroll ? y : 0);
    if (reading && reading.elId) markReadLine(reading.elId);
  }
  function lessonReadAll(ti) {
    var t = lsArr(lesson.data.texts).filter(function (x) { return x && lsArr(x.lines).length; })[ti];

    lsArr(t.lines).forEach(function (ln, li) { if (ln && ln.zh) lines.push({ text: ln.zh, elId: "tl-" + ti + "-" + li }); });

  function lessonKey(e) {
    if (view !== "lesson" && view !== "lessons") return;
    var t = e.target;
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (e.key === "Escape") {
      e.preventDefault();
      if (view === "lesson") { stopReading(); lessonPending = null; if (backTo("#lessons")) return; view = "lessons"; } else view = "home";
      render(); return;
    }
    if (view === "lesson" && lesson && /^[1-4]$/.test(e.key)) {
      var tabs = lessonTabs(), tb = tabs[Number(e.key) - 1];

  function updateCounts() {
    var el = byId("counts");
    if (!el || !session) return;
    var due = 0, fresh = 0;
    session.queue.forEach(function (it) { if (isNewItem(it)) fresh++; else due++; });
    el.textContent = "Đã làm " + session.doneCount + " · còn ôn " + due + " · từ mới còn " + fresh;
  }
  function renderCard() {
    var area = byId("cardArea");
    if (!area || !session) return;
    var snap = session.keepPad ? snapshotPad() : null;
    PAD.drawing = false; PAD.pointerId = null; PAD.canvas = null;
    var it = session.current;
    var html;
    if (!it) {
      syncElapsed();
      html = session.elapsed >= TARGET_SEC ? doneHtml() : emptyHtml();
    } else {
      var mode = modeOf(it);
      html = mode === "new" ? newWordHtml(it)
        : mode === "recog" ? recogHtml(it)
        : mode === "recall" ? recallHtml(it)
        : phraseHtml(it);
    }
    area.innerHTML = html;
    updateCounts();
    var pad = byId("pad");
    if (pad) { drawGrid(pad); restorePad(pad, snap); }
    if (!session.keepPad) window.scrollTo(0, 0);
    autoSpeak(it);
  }
  function autoSpeak(it) {
    if (!it || !db.settings.autoSpeak) return;
    var mode = modeOf(it);
    var shouldSpeak = mode === "new" || session.flipped;
    if (!shouldSpeak) return;
    var key = it.id + ":" + (session.flipped ? "back" : "front");
    if (session.spokenFor === key) return;
    session.spokenFor = key;
    speak(it.kind === "phrase" ? it.data.zh : it.data.hanzi);
  }

  // ---------- render chung ----------
  function render() {
    if (view !== "lesson" && reading) stopReading();
    if (view === "stats") app.innerHTML = statsHtml();
    else if (view === "session") { app.innerHTML = sessionShellHtml(); renderCard(); tick(); }
    else if (view === "exams" && EXAM_INDEX.length) app.innerHTML = examsHtml();
    else if (view === "exam" && exam) renderExam(false);
    else if (view === "lessons" && LESSON_INDEX.length) { app.innerHTML = lessonsHtml(); centerOnTab(); }
    else if (view === "lesson" && lesson) { renderLesson(false); syncHistory(); return; }
    else if (view === "lesson-loading") app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải bài…</p>' +
      '<button class="small-btn" data-action="lessons">← Danh sách bài</button></div></div>';
    else if (view === "exam-loading") app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải đề…</p>' +
      '<button class="small-btn" data-action="exams">← Danh sách đề</button></div></div>';
    else { view = "home"; app.innerHTML = homeHtml(); }
    syncHistory();
    window.scrollTo(0, 0);
  }

  // ---------- định tuyến bằng hash: nút Back của điện thoại quay về màn trước ----------
  // Hash không gửi lên server (GitHub Pages không 404), ?t= giữ nguyên.
  // history.state = { d: độ sâu màn, n: số mục tính từ mục gốc (Trang chủ), p: hash màn trước }.
  var DEPTH = { home: 0, exams: 1, lessons: 1, stats: 1, session: 1, exam: 2, lesson: 2, "exam-loading": 2, "lesson-loading": 2 };
  var fromPop = false;
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) { /* bỏ qua */ }
  function baseUrl() { return location.pathname + location.search; }
  function routeOf() {
    switch (view) {
      case "exams": return "#exams";
      case "exam": return exam ? "#exam/" + exam.id : "#exams";
      case "exam-loading": return examPending ? "#exam/" + examPending : "#exams";
      case "lessons": return "#lessons";
      case "lesson": return lesson ? "#lesson/" + lesson.id : "#lessons";
      case "lesson-loading": return lessonPending ? "#lesson/" + lessonPending : "#lessons";
      case "stats": return "#stats";
      case "session": return "#session";
      default: return "";
    }
  }
  function syncHistory() {
    if (fromPop) return;
    var r = routeOf();
    if (r === location.hash) return;
    var st = history.state || {}, n = Number(st.n) || 0, d = DEPTH[view] || 0;
    try {
      if (!r && n > 0) { history.go(-n); return; } // về Trang chủ: lùi về mục gốc, stack không phình
      if (d > (Number(st.d) || 0)) history.pushState({ d: d, n: n + 1, p: location.hash }, "", r || baseUrl());
      else history.replaceState({ d: d, n: n, p: st.p }, "", r || baseUrl());
    } catch (e) { /* bỏ qua */ }
  }
  // Nút quay lại trong app: nếu mục trước đúng là màn đích thì history.back() để Back của hệ điều hành khớp.
  function backTo(route) {
    var st = history.state;
    if (fromPop || !st || st.p !== route || location.hash === route) return false;
    history.back();
    return true;
  }
  function routeTo(h) {
    var m;
    examPending = null; lessonPending = null;
    // openExam / openLesson tự vẽ màn (đang tải, đề/bài, hoặc danh sách nếu lỗi).
    if ((m = /^#exam\/(.+)$/.exec(h)) && EXAM_ID_RE.test(m[1])) { openExam(m[1]); return; }
    if ((m = /^#lesson\/(.+)$/.exec(h)) && LESSON_META[m[1]]) { openLesson(m[1]); return; }
    view = h === "#exams" ? "exams" : h === "#lessons" ? "lessons" : h === "#stats" ? "stats" : "home";
    render();
  }
  window.addEventListener("popstate", function () {
    if (!DECKS.length) return;
    fromPop = true;
    try {
      var h = location.hash;
      if (view === "exam" && h !== routeOf()) stopExamMedia();
      if (view === "lesson") stopReading();
      if (view === "session" && h !== "#session") closeSession();
      if (h === "#session" && session) { render(); return; }
      routeTo(h);
    } finally { fromPop = false; }
  });
  function missingDecksHtml() {
    return '<div class="wrap"><div class="warn"><h1>Thiếu file bài học</h1>' +
      '<p>Không thấy dữ liệu nào trong <code>window.DECKS</code>. Kiểm tra thư mục <code>decks/</code> nằm cạnh <code>index.html</code> và có đủ 12 file <code>.js</code>.</p>' +
      '<p class="muted small">Mỗi file phải bắt đầu bằng <code>window.DECKS = window.DECKS || []; window.DECKS.push({...})</code>.</p></div></div>';
  }

  // ---------- sự kiện (event delegation trên #app) ----------
  function setSelectedDecks(ids) {
    db.settings.selectedDecks = ids;
    saveDb(); render();
  }
  // Bài đang học đã chọn nhưng chưa tải được (không có trong DECKS): giữ lại trong lựa chọn khi
  // tick/bỏ tick bộ khác hoặc "Chọn hết", để bài tải được lần sau vẫn vào phiên.
  function keepUnloadedLessons(ids) {
    return ids.concat(db.settings.selectedDecks.filter(function (x) {
      return lessonOn(x) && !DECKS.some(function (d) { return d.id === x; }) && ids.indexOf(x) < 0;
    }));
  }
  function onAction(action, el) {
    switch (action) {
      case "start": startSession(); break;
      case "stats": view = "stats"; render(); break;
      case "home": view = "home"; render(); break;
      case "export": exportBackup(); break;
      case "import": { var f = byId("importFile"); if (f) { f.value = ""; f.click(); } break; }
      case "select-all": setSelectedDecks(keepUnloadedLessons(DECKS.map(function (d) { return d.id; }))); break;
      case "select-none": setSelectedDecks([]); break;
      case "speak": speak(el.getAttribute("data-text")); break;
      case "understood": understood(); break;
      case "flip": flip(); break;
      case "hint": showHint(); break;
      case "clear-pad": clearPad(); break;
      case "grade": gradeCurrent(Number(el.getAttribute("data-grade"))); break;
      case "end": endSession(false); break;
      case "end-force": endSession(true); break;
      // luyện đề
      case "exams": if (view === "exam") leaveExam(); else { examPending = null; if (!backTo("#exams")) { view = "exams"; render(); } } break;
      case "ex-open": openExam(el.getAttribute("data-id")); break;
      case "ex-part": examPart(Number(el.getAttribute("data-part"))); break;
      case "ex-go": examGoN(Number(el.getAttribute("data-n")), true); break;
      case "ex-prev": examMove(-1); break;
      case "ex-next": examMove(1); break;
      case "ex-script": exam.showScript = !exam.showScript; renderExam(true); break;
      case "ex-pick": {
        var pk = el.getAttribute("data-pick");
        examPick(partType(curPart()) === "tf" ? pk === "T" : pk);
        break;
      }
      case "ex-order": examOrderAdd(el.getAttribute("data-k")); break;
      case "ex-build": examBuildAdd(Number(el.getAttribute("data-k"))); break;
      case "ex-unbuild": if (!curAns()) { exam.build.splice(Number(el.getAttribute("data-k")), 1); renderExam(true); } break;
      case "ex-clear": exam.order = ""; exam.build = []; renderExam(true); break;
      case "ex-check": examCheck(); break;
      case "ex-sample": exam.freeShown[curItem().n] = true; renderExam(true); break;
      case "ex-self": examSelf(el.getAttribute("data-ok") === "1"); break;
      case "ex-redo-q": examRedoQ(); break;
      case "ex-reset-part": examResetPart(); break;
      case "ex-reset-all": examResetAll(); break;
      case "ex-add": {
        var v = (curItem().vocab || [])[Number(el.getAttribute("data-i"))];
        addCustomWord(v, exam.id + "#" + curItem().n);
        renderExam(true);
        break;
      }
      case "au-toggle": toggleAudio(); break;
      case "au-skip": skipAudio(Number(el.getAttribute("data-sec")) || 0); break;
      case "au-rate": setRate(Number(el.getAttribute("data-rate"))); break;
      case "au-item": seekToItem(true); break;
      // giáo trình
      case "lessons": lessonPending = null; if (view === "lesson") stopReading(); if (!backTo("#lessons")) { view = "lessons"; render(); } break;
      case "ls-level": UI.lsLevel = Number(el.getAttribute("data-level")); saveUi(); render(); break;
      case "ls-open": openLesson(el.getAttribute("data-id")); break;
      case "ls-tab": setLessonTab(el.getAttribute("data-tab")); break;
      case "ls-toggle": toggleLessonStudy(); break;
      case "ls-word": {
        var wi = Number(el.getAttribute("data-i"));
        if (lesson.open[wi]) delete lesson.open[wi]; else lesson.open[wi] = true;
        renderLesson(true);
        break;
      }
      case "ls-word-all": {
        var ws = lsArr(lesson.data.words).filter(function (w) { return w && w.hanzi; });
        var all = ws.every(function (w, i) { return lesson.open[i]; });
        lesson.open = {};
        if (!all) ws.forEach(function (w, i) { lesson.open[i] = true; });
        renderLesson(true);
        break;
      }
      case "ls-py": UI.lsPy = UI.lsPy === false; saveUi(); renderLesson(true); break;
      case "ls-vi": UI.lsVi = UI.lsVi === false; saveUi(); renderLesson(true); break;
      case "ls-read": lessonReadAll(Number(el.getAttribute("data-t"))); break;
      case "ls-quiz": {
        var qi = Number(el.getAttribute("data-i"));
        if (lesson.quiz[qi] == null) { lesson.quiz[qi] = el.getAttribute("data-v") === "T"; renderLesson(true); }
        break;
      }
      case "ls-quiz-reset": lesson.quiz = {}; renderLesson(true); break;
      default: break;
    }
  }
  app.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el || !app.contains(el)) return;
    e.preventDefault();
    onAction(el.getAttribute("data-action"), el);
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "importFile") { importBackupFile(t.files && t.files[0]); return; }
    if (t.id === "auSeek") { seekHold = false; updateAudioUi(); return; }
    var deckId = t.getAttribute("data-deck");
    if (deckId) {
      var ids = db.settings.selectedDecks.filter(function (id) { return id !== deckId; });
      if (t.checked) ids.push(deckId);
      setSelectedDecks(keepUnloadedLessons(ids));
      return;
    }
    var key = t.getAttribute("data-setting");
    if (!key) return;
    if (key === "newPerSession") db.settings.newPerSession = Number(t.value) || 10;
    else if (key === "drawPad") db.settings.drawPad = !!t.checked;
    else if (key === "autoSpeak") db.settings.autoSpeak = !!t.checked;
    saveDb(); render();
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "auSeek" && audioEl) { seekHold = true; audioEl.currentTime = Number(t.value) || 0; return; }
    if (t.id === "exFree" && exam) exam.free[t.getAttribute("data-n")] = t.value;
  });
  // Listener gắn 1 lần trên #app (delegation) nên đổi thẻ / vẽ lại canvas không rò listener.
  if (window.PointerEvent) {
    app.addEventListener("pointerdown", onPointerDown);
    app.addEventListener("pointermove", onPointerMove);
    app.addEventListener("pointerup", onPointerUp);
    app.addEventListener("pointercancel", onPointerUp);
  } else {
    app.addEventListener("touchstart", onTouchStart, { passive: false });
    app.addEventListener("touchmove", onTouchMove, { passive: false });
    app.addEventListener("touchend", onPadEnd);
    app.addEventListener("touchcancel", onPadEnd);
    app.addEventListener("mousedown", onMouseDown);
    app.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onPadEnd);
  }

  document.addEventListener("keydown", function (e) {
    if (view !== "session" || !session) return;
    var t = e.target;
    var tag = (t && t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (t && t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;
    var isSpace = key === " " || key === "Spacebar";
    // Space không cuộn trang; Space/Enter không "bấm" nút đang focus (vd. nút Kết thúc) thay cho phím tắt.
    if (isSpace || key === "Enter") {
      e.preventDefault();
      if (tag === "button" && t.blur) t.blur();
    }
    // Giữ phím sẽ auto-repeat: chặn để Space giữ lâu không vừa lật vừa chấm Nhớ.
    if (e.repeat) { e.preventDefault(); return; }
    if (key === "Escape") { e.preventDefault(); escapeSession(); return; }
    var it = session.current;
    if (!it) {
      if (key === "Enter") endSession(true);
      return;
    }
    var mode = modeOf(it);
    if (isSpace) {
      if (mode === "new") return;
      if (!session.flipped) flip(); else gradeCurrent(3);
      return;
    }
    if (key === "Enter") {
      e.preventDefault();
      if (mode === "new") understood(); else if (!session.flipped) flip();
      return;
    }
    if (/^[1-4]$/.test(key) && mode !== "new" && session.flipped) {
      e.preventDefault();
      gradeCurrent(Number(key));
    }
  });
  // Phím tắt màn đề: tách riêng, chỉ chạy khi view === "exam" (phím phiên học ở trên chỉ chạy khi view === "session").
  document.addEventListener("keydown", examKey);
  // Phím tắt giáo trình: chỉ chạy khi view === "lesson" / "lessons".
  document.addEventListener("keydown", lessonKey);

  // ---------- khởi động ----------
  // Mở link / tải lại trang: về đúng màn theo hash. Mở mới (chưa có history.state của app) thì dựng
  // mục gốc = Trang chủ (+ mục Danh sách đề/bài nếu link trỏ thẳng vào đề/bài) để Back lùi từng màn.
  function initialRoute() {
    var h = location.hash, st = history.state;
    try {
      if (!(st && typeof st.n === "number")) {
        history.replaceState({ d: 0, n: 0 }, "", baseUrl());
        var mid = /^#exam\//.test(h) ? "#exams" : /^#lesson\//.test(h) ? "#lessons" : "";
        if (mid) history.pushState({ d: 1, n: 1, p: "" }, "", mid);
      }
    } catch (e) { /* bỏ qua */ }
    routeTo(h);
  }
  // Nạp file các bài giáo trình đang học TRƯỚC khi dựng thẻ (chờ xong/lỗi, tối đa 8s).
  function boot() {
    var ids = db.settings.enabledLessons.filter(function (id) { return !!LESSON_META[id]; });
    var started = false;
    var go = function () {
      started = true;
      rebuildItems();
      var miss = ids.filter(function (id) { return !lessonData(id); });
      if (!DECKS.length) app.innerHTML = missingDecksHtml();
      else initialRoute();
      // Gọi sau render() để không bị vẽ đè; bài về muộn thì vòng dự phòng bên dưới dựng lại thẻ.
      if (miss.length) toast("Không tải được " + miss.length + " bài giáo trình (" + miss.join(", ") + ") — từ của bài chưa có trong phiên. Mở bài trong Giáo trình để thử lại.");
    };
    if (!ids.length) { go(); return; }
    app.innerHTML = '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><p class="muted">Đang tải giáo trình…</p></div></div>';
    loadLessons(ids, go, 8000);
    // Bài nào về muộn hơn timeout: dựng lại thẻ khi tới, nếu đang ở trang chủ thì vẽ lại.
    ids.forEach(function (id) {
      loadLesson(id, function (ok) {
        if (!ok || !started || DECKS.some(function (d) { return d.id === id; })) return;
        rebuildItems();
        if (view === "home") render();
      });
    });
  }
  boot();
})();
</script>
</body>
</html>
